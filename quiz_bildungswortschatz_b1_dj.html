<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教養語彙テスト B1レベル（独→日）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 5px 11px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 12px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 6px; }
  .pos-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-bottom: 10px; }
  .pos-N   { background: #e8f0fe; color: #1a56b0; }
  .pos-V   { background: #fef3e8; color: #b05a1a; }
  .pos-Adj { background: #fde8e8; color: #b01a1a; }
  .pos-Adv { background: #e8feee; color: #1a7a3c; }
  .question-text { font-size: 24px; font-weight: 600; margin-bottom: 1.25rem; font-family: "Segoe UI", "Candara", sans-serif; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: inherit; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; display: none; font-family: "Segoe UI", "Candara", sans-serif; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>教養語彙テスト　B1レベル（独→日）</h1>
    <p>ドイツ語の意味を選びなさい（独→日）。領域ごとにテストが分かれています。</p>
  </header>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="pos-tag" id="pos-tag"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQ()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="res-title"></h2>
    <div class="score-big" id="res-score"></div>
    <div class="score-msg" id="res-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">もう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNext()">次のテスト →</button>
    </div>
  </div>
</div>
<script>
const sets = [
  { label:"①論理・思考", questions:[
    { q:"der Beweis", pos:"N", opts:["証拠・証明", "関係・割合・比率", "結果・論理的帰結", "変容・変革（構造的）"], ans:0, hint:"einen Beweis liefern（証拠を示す）の形が典型的。", exp:"der Beweis＝証拠・証明。einen Beweis liefern（証拠を示す）の形が典型的。" },
    { q:"der Standpunkt", pos:"N", opts:["結論", "妥協・妥協点", "立場・見地", "影響"], ans:2, hint:"von meinem Standpunkt aus（私の立場からは）の形でよく使う。", exp:"der Standpunkt＝立場・見地。von meinem Standpunkt aus（私の立場からは）の形でよく使う。" },
    { q:"die Ansicht", pos:"N", opts:["見解", "結果・影響", "寛容・許容", "理由・根拠"], ans:0, hint:"meiner Ansicht nach は Meinung よりフォーマル。", exp:"die Ansicht＝見解。meiner Ansicht nach は Meinung よりフォーマル。" },
    { q:"die Annahme", pos:"N", opts:["程度・規模", "発言・陳述", "対立・葛藤", "仮定・前提"], ans:3, hint:"von der Annahme ausgehen（〜という前提から出発する）の形でよく使う。", exp:"die Annahme＝仮定・前提。von der Annahme ausgehen（〜という前提から出発する）の形でよく使う。" },
    { q:"logisch", pos:"Adj", opts:["論理的な", "緊急の・切迫した", "公の・公開の", "本質的な・重要な"], ans:0, hint:"Das ist nicht logisch.（それは論理的でない）の形が典型的。", exp:"logisch＝論理的な。Das ist nicht logisch.（それは論理的でない）の形が典型的。" },
    { q:"meinen", pos:"V", opts:["表す・示す・描写する", "〜と思う・考える", "達成する・到達する", "判断する"], ans:1, hint:"Was meinen Sie dazu?（それについてどう思いますか）の形が典型的。", exp:"meinen＝〜と思う・考える。Was meinen Sie dazu?（それについてどう思いますか）の形が典型的。" },
    { q:"erkennen", pos:"V", opts:["比較する", "増加する", "認識する・気づく", "高める・増やす"], ans:2, hint:"ein Problem erkennen（問題に気づく）の形が典型的。", exp:"erkennen＝認識する・気づく。ein Problem erkennen（問題に気づく）の形が典型的。" },
    { q:"der Schluss", pos:"N", opts:["程度・規模", "結論", "対立・葛藤", "発展・展開"], ans:1, hint:"zu dem Schluss kommen（〜という結論に至る）の形が最頻出。", exp:"der Schluss＝結論。zu dem Schluss kommen（〜という結論に至る）の形が最頻出。" },
    { q:"die Ursache", pos:"N", opts:["原因", "可能性・機会", "関係・つながり", "説明・解説"], ans:0, hint:"die Ursache des Problems（問題の原因）の形が典型的。", exp:"die Ursache＝原因。die Ursache des Problems（問題の原因）の形が典型的。" },
    { q:"die Folge", pos:"N", opts:["結果・影響", "減少・後退", "品質・質", "不足・欠如"], ans:0, hint:"als Folge davon（その結果として）の形もよく使う。", exp:"die Folge＝結果・影響。als Folge davon（その結果として）の形もよく使う。" },
    { q:"überlegen", pos:"V", opts:["説得する・納得させる", "考える・検討する", "表す・示す・描写する", "確認する・断言する"], ans:1, hint:"sich etw. überlegen（〜をよく考える）の再帰形が最頻出。", exp:"überlegen＝考える・検討する。sich etw. überlegen（〜をよく考える）の再帰形が最頻出。" },
    { q:"allerdings", pos:"Adv", opts:["しかしながら・ただし", "他方では", "〜と比較して", "ほとんど〜ない"], ans:0, hint:"前文の内容を認めつつも留保を加える副詞。文頭に置くことが多い。", exp:"allerdings＝しかしながら・ただし。前文の内容を認めつつも留保を加える副詞。文頭に置くことが多い。" },
    { q:"die Meinung", pos:"N", opts:["意味・重要性", "意見", "影響", "結果・成果"], ans:1, hint:"meiner Meinung nach（私の意見では）の形が最頻出。", exp:"die Meinung＝意見。meiner Meinung nach（私の意見では）の形が最頻出。" },
    { q:"begründen", pos:"V", opts:["根拠を示す", "評価する", "減少する", "説得する・納得させる"], ans:0, hint:"eine Entscheidung begründen（決定の根拠を示す）の形が典型的。", exp:"begründen＝根拠を示す。eine Entscheidung begründen（決定の根拠を示す）の形が典型的。" },
    { q:"der Grund", pos:"N", opts:["解決策", "結果・影響", "理由・根拠", "欠点・短所"], ans:2, hint:"Grund と Ursache はどちらも「理由・原因」だが、Grund は主観的な理由に使うことが多い。", exp:"der Grund＝理由・根拠。Grund と Ursache はどちらも「理由・原因」だが、Grund は主観的な理由に使うことが多い。" },
    { q:"der Zusammenhang", pos:"N", opts:["少数・少数派", "関連・文脈", "責任", "指摘・ヒント・注意"], ans:1, hint:"in welchem Zusammenhang（どういう文脈で）の形が頻出。", exp:"der Zusammenhang＝関連・文脈。in welchem Zusammenhang（どういう文脈で）の形が頻出。" }
  ]},
  { label:"②変化・推移", questions:[
    { q:"verbessern", pos:"V", opts:["評価する", "改善する", "〜と思う・考える", "強調する"], ans:1, hint:"die Situation verbessern（状況を改善する）の形が典型的。", exp:"verbessern＝改善する。die Situation verbessern（状況を改善する）の形が典型的。" },
    { q:"zunehmen", pos:"V", opts:["維持する・保つ", "表す・示す・描写する", "増加する", "報告する・伝える"], ans:2, hint:"Die Zahl nimmt zu.（数が増加する）の形が典型的。", exp:"zunehmen＝増加する。Die Zahl nimmt zu.（数が増加する）の形が典型的。" },
    { q:"der Fortschritt", pos:"N", opts:["不足・欠如", "関係・割合・比率", "進歩・進展", "理由・根拠"], ans:2, hint:"Fortschritte machen（進歩する）の形が最頻出。", exp:"der Fortschritt＝進歩・進展。Fortschritte machen（進歩する）の形が最頻出。" },
    { q:"der Wandel", pos:"N", opts:["変容・変革（構造的）", "意味・重要性", "結果・論理的帰結", "側面・観点"], ans:0, hint:"sozialer Wandel のように長期的・構造的な変化に使う。", exp:"der Wandel＝変容・変革（構造的）。sozialer Wandel のように長期的・構造的な変化に使う。" },
    { q:"die Entwicklung", pos:"N", opts:["会話・話し合い", "情報", "措置・対策", "発展・展開"], ans:3, hint:"eine positive Entwicklung（前向きな発展）の形が典型的。", exp:"die Entwicklung＝発展・展開。eine positive Entwicklung（前向きな発展）の形が典型的。" },
    { q:"die Zunahme", pos:"N", opts:["対立・葛藤", "増加", "差異・相違", "証拠・証明"], ans:1, hint:"eine starke Zunahme（大幅な増加）の形が典型的。", exp:"die Zunahme＝増加。eine starke Zunahme（大幅な増加）の形が典型的。" },
    { q:"beibehalten", pos:"V", opts:["防ぐ・阻止する", "維持する・保つ", "増加する", "改善する"], ans:1, hint:"einen Kurs beibehalten（方針を維持する）の形が典型的。", exp:"beibehalten＝維持する・保つ。einen Kurs beibehalten（方針を維持する）の形が典型的。" },
    { q:"verschlechtern", pos:"V", opts:["悪化する", "減少する", "協力する", "考える・検討する"], ans:0, hint:"sich verschlechtern（悪化する）の再帰形が最頻出。", exp:"verschlechtern＝悪化する。sich verschlechtern（悪化する）の再帰形が最頻出。" },
    { q:"abnehmen", pos:"V", opts:["確認する・断言する", "証明する・立証する", "協力する", "減少する"], ans:3, hint:"Die Nachfrage nimmt ab.（需要が減少する）の形が典型的。", exp:"abnehmen＝減少する。Die Nachfrage nimmt ab.（需要が減少する）の形が典型的。" },
    { q:"die Veränderung", pos:"N", opts:["平等・同等性", "価値・価値観", "結果・成果", "変化・変容"], ans:3, hint:"eine grundlegende Veränderung（根本的な変化）の形が典型的。", exp:"die Veränderung＝変化・変容。eine grundlegende Veränderung（根本的な変化）の形が典型的。" },
    { q:"der Rückgang", pos:"N", opts:["前提条件・必要条件", "減少・後退", "理由・根拠", "課題・挑戦"], ans:1, hint:"ein deutlicher Rückgang（顕著な減少）の形が典型的。", exp:"der Rückgang＝減少・後退。ein deutlicher Rückgang（顕著な減少）の形が典型的。" },
    { q:"allmählich", pos:"Adv", opts:["次第に・ますます", "まったく・十分に", "徐々に", "概して・全体的に見て"], ans:2, hint:"allmählich besser werden（徐々によくなる）の形が典型的。", exp:"allmählich＝徐々に。allmählich besser werden（徐々によくなる）の形が典型的。" }
  ]},
  { label:"③評価・判断", questions:[
    { q:"bedeutend", pos:"Adj", opts:["重要な・著しい", "論理的な", "明確な・はっきりした", "相当な・著しい"], ans:0, hint:"eine bedeutende Rolle spielen（重要な役割を果たす）の形が典型的。", exp:"bedeutend＝重要な・著しい。eine bedeutende Rolle spielen（重要な役割を果たす）の形が典型的。" },
    { q:"der Vergleich", pos:"N", opts:["少数・少数派", "利点・長所", "比較", "関係・つながり"], ans:2, hint:"im Vergleich zu（〜と比較して）の形で最頻出。", exp:"der Vergleich＝比較。im Vergleich zu（〜と比較して）の形で最頻出。" },
    { q:"bewerten", pos:"V", opts:["証明する・立証する", "高める・増やす", "評価する", "考慮する・踏まえる"], ans:2, hint:"etw. positiv bewerten（〜を肯定的に評価する）の形が典型的。", exp:"bewerten＝評価する。etw. positiv bewerten（〜を肯定的に評価する）の形が典型的。" },
    { q:"der Wert", pos:"N", opts:["社会", "価値・価値観", "困難・難しさ", "関連・文脈"], ans:1, hint:"einen hohen Wert legen auf（〜を重視する）の形が典型的。", exp:"der Wert＝価値・価値観。einen hohen Wert legen auf（〜を重視する）の形が典型的。" },
    { q:"die Kritik", pos:"N", opts:["平等・同等性", "批判・批評", "課題・挑戦", "寛容・許容"], ans:1, hint:"Kritik üben an（〜を批判する）の形が典型的。", exp:"die Kritik＝批判・批評。Kritik üben an（〜を批判する）の形が典型的。" },
    { q:"der Nachteil", pos:"N", opts:["原因", "欠点・短所", "責任", "社会"], ans:1, hint:"Nachteile in Kauf nehmen（欠点をやむなく受け入れる）の形も重要。", exp:"der Nachteil＝欠点・短所。Nachteile in Kauf nehmen（欠点をやむなく受け入れる）の形も重要。" },
    { q:"betonen", pos:"V", opts:["高める・増やす", "悪化する", "達成する・到達する", "強調する"], ans:3, hint:"die Wichtigkeit betonen（重要性を強調する）の形が典型的。", exp:"betonen＝強調する。die Wichtigkeit betonen（重要性を強調する）の形が典型的。" },
    { q:"vergleichen", pos:"V", opts:["防ぐ・阻止する", "比較する", "確認する・断言する", "証明する・立証する"], ans:1, hint:"A mit B vergleichen（AとBを比較する）の形が典型的。", exp:"vergleichen＝比較する。A mit B vergleichen（AとBを比較する）の形が典型的。" },
    { q:"die Bedeutung", pos:"N", opts:["責任", "意味・重要性", "情報", "解決策"], ans:1, hint:"von großer Bedeutung sein（大きな意味を持つ）の形が典型的。", exp:"die Bedeutung＝意味・重要性。von großer Bedeutung sein（大きな意味を持つ）の形が典型的。" },
    { q:"die Qualität", pos:"N", opts:["批判・批評", "原因", "意味・重要性", "品質・質"], ans:3, hint:"auf Qualität achten（品質に気をつける）の形が典型的。", exp:"die Qualität＝品質・質。auf Qualität achten（品質に気をつける）の形が典型的。" },
    { q:"der Aspekt", pos:"N", opts:["問題", "側面・観点", "欠点・短所", "立場・見地"], ans:1, hint:"alle Aspekte berücksichtigen（すべての側面を考慮する）の形が典型的。", exp:"der Aspekt＝側面・観点。alle Aspekte berücksichtigen（すべての側面を考慮する）の形が典型的。" },
    { q:"wesentlich", pos:"Adj", opts:["緊急の・切迫した", "重要な・著しい", "論理的な", "本質的な・重要な"], ans:3, hint:"ein wesentlicher Unterschied（本質的な差異）の形が典型的。", exp:"wesentlich＝本質的な・重要な。ein wesentlicher Unterschied（本質的な差異）の形が典型的。" },
    { q:"grundsätzlich", pos:"Adv", opts:["本質的には・主に", "それどころか・反対に", "原則的に・基本的に", "概して・全体的に見て"], ans:2, hint:"grundsätzlich einverstanden sein（基本的に同意する）の形が典型的。", exp:"grundsätzlich＝原則的に・基本的に。grundsätzlich einverstanden sein（基本的に同意する）の形が典型的。" },
    { q:"der Vorteil", pos:"N", opts:["価値・価値観", "原因", "利点・長所", "関係・つながり"], ans:2, hint:"Vorteile und Nachteile のセットで覚えよう。", exp:"der Vorteil＝利点・長所。Vorteile und Nachteile のセットで覚えよう。" },
    { q:"beurteilen", pos:"V", opts:["判断する", "減らす・削減する", "解決する", "協力する"], ans:0, hint:"die Lage beurteilen（状況を判断する）の形が典型的。", exp:"beurteilen＝判断する。die Lage beurteilen（状況を判断する）の形が典型的。" }
  ]},

    { q:"der Fortschritt", pos:"N", opts:["前提条件・必要条件", "寛容・許容", "結果・影響", "進歩・進展"], ans:3, hint:"Fortschritte machen（進歩する）の形が最頻出。", exp:"der Fortschritt＝進歩・進展。Fortschritte machen（進歩する）の形が最頻出。" },
    { q:"wesentlich", pos:"Adj", opts:["客観的な・事実に即した", "必要な・不可欠な", "本質的な・重要な", "相当な・著しい"], ans:2, hint:"ein wesentlicher Unterschied（本質的な差異）の形が典型的。", exp:"wesentlich＝本質的な・重要な。ein wesentlicher Unterschied（本質的な差異）の形が典型的。" },
    { q:"die Qualität", pos:"N", opts:["説明・解説", "結果・論理的帰結", "側面・観点", "品質・質"], ans:3, hint:"auf Qualität achten（品質に気をつける）の形が典型的。", exp:"die Qualität＝品質・質。auf Qualität achten（品質に気をつける）の形が典型的。" }
];
const RANDOM_COUNT = 20;
const posLabel = { N:"名詞", V:"動詞", Adj:"形容詞", Adv:"副詞" };

function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildRandomSet() {
  return { label:"ランダム", questions: shuffle(allQuestions).slice(0, RANDOM_COUNT) };
}

// ナビ用セットリスト（ランダムは動的生成）
let currentQuestions = [];
let cur=0, score=0, answered=false, curSetIdx=0;
const NAV_SETS = sets.map(s=>s.label).concat(["ランダム"]);

function initNav() {
  const nav = document.getElementById('set-nav');
  NAV_SETS.forEach((label,i) => {
    const b = document.createElement('button');
    const isRandom = label === "ランダム";
    b.className = 'set-btn' + (isRandom?' random-btn':'') + (i===0?' active':'');
    b.textContent = label;
    b.onclick = () => selectSet(i);
    nav.appendChild(b);
  });
}

function selectSet(i) {
  curSetIdx=i; cur=0; score=0; answered=false;
  document.querySelectorAll('.set-btn').forEach((b,j)=>{
    const isRandom = NAV_SETS[j]==="ランダム";
    b.className='set-btn'+(isRandom?' random-btn':'')+(j===i?' active':'');
  });
  if (NAV_SETS[i]==="ランダム") {
    currentQuestions = buildRandomSet().questions;
  } else {
    currentQuestions = sets[i].questions;
  }
  document.getElementById('result-card').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  render();
}

function render() {
  const q=currentQuestions[cur];
  document.getElementById('prog-bar').style.width=((cur+1)/currentQuestions.length*100)+'%';
  document.getElementById('prog-text').textContent='問'+(cur+1)+' / '+currentQuestions.length;
  document.getElementById('q-num').textContent='問'+(cur+1);
  const tag=document.getElementById('pos-tag');
  tag.textContent='【'+posLabel[q.pos]+'】';
  tag.className='pos-tag pos-'+q.pos;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('hint-text').textContent=q.hint;
  document.getElementById('hint-text').style.display='none';
  document.getElementById('hint-btn').style.display='inline';
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  document.getElementById('next-btn').style.display='none';
  answered=false;
  const opts=document.getElementById('q-options');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='option-btn'; b.textContent=o; b.onclick=()=>select(i);
    opts.appendChild(b);
  });
}

function showHint(){
  const h=document.getElementById('hint-text');
  h.style.display=h.style.display==='none'?'block':'none';
}

function select(i){
  if(answered)return;
  answered=true;
  const q=currentQuestions[cur];
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach(b=>b.disabled=true);
  document.getElementById('hint-btn').style.display='none';
  document.getElementById('hint-text').style.display='none';
  const fb=document.getElementById('feedback');
  if(i===q.ans){
    score++;
    btns[i].classList.add('correct');
    fb.className='feedback correct';
    fb.textContent='✓ 正解！　'+q.exp;
  }else{
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className='feedback wrong';
    fb.textContent='✗ 不正解。　'+q.exp;
  }
  const nb=document.getElementById('next-btn');
  nb.style.display='block';
  nb.textContent=cur+1<currentQuestions.length?'次の問題 →':'結果を見る';
}

function nextQ(){cur++;if(cur<currentQuestions.length)render();else showResult();}

function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('result-card').style.display='block';
  const total=currentQuestions.length,pct=Math.round(score/total*100);
  document.getElementById('res-title').textContent=NAV_SETS[curSetIdx]+'　終了';
  document.getElementById('res-score').textContent=score+' / '+total;
  const msgs=['語彙リストをもう一度確認してから再挑戦しましょう。','もう少しです。リストを見直してから再挑戦しましょう。','よくできました。間違えた語を復習しましょう。','素晴らしい！ほぼ完璧です。'];
  document.getElementById('res-msg').textContent='正答率 '+pct+'%　'+msgs[pct>=90?3:pct>=70?2:pct>=50?1:0];
  const nb=document.getElementById('next-set-btn');
  const nextIdx=curSetIdx+1;
  if(nextIdx<NAV_SETS.length){nb.style.display='inline-block';nb.textContent=NAV_SETS[nextIdx]+' →';}
  else nb.style.display='none';
}

function restart(){
  cur=0;score=0;
  if(NAV_SETS[curSetIdx]==="ランダム") currentQuestions=buildRandomSet().questions;
  document.getElementById('result-card').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  render();
}

function goNext(){selectSet(curSetIdx+1);}

// 初期化
currentQuestions = sets[0].questions;
initNav();
render();
</script>
</body>
</html>
