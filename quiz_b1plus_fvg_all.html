<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FVG穴埋めテスト B1+レベル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 6px; }
  .question-tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; margin-bottom: 10px; background: #f0f0f0; color: #555; }
  .question-tag.noun { background: #e8f0fe; color: #1a56b0; }
  .question-tag.verb { background: #fef3e8; color: #b05a1a; }
  .question-tag.prep { background: #e8feee; color: #1a7a3c; }
  .question-text { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; line-height: 1.7; font-family: "Segoe UI", "Candara", sans-serif; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: "Segoe UI", "Candara", sans-serif; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; display: none; font-family: "Segoe UI", "Candara", sans-serif; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>FVG穴埋めテスト　B1+レベル</h1>
    <p>空欄に入る語を選びなさい。（各テスト15問：名詞5・動詞5・前置詞5）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← ポータルに戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:7%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card" id="q-card">
      <div class="question-num" id="q-num"></div>
      <div class="question-tag" id="q-tag"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このテストをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のテストへ →</button>
    </div>
  </div>
</div>

<script>
// type: "n"=名詞, "v"=動詞, "p"=前置詞
const sets = [
  {
    label: "テストA",
    questions: [
      { type:"n", q:"Er brachte seine Meinung klar zum _______ .", opts:["Ausdruck","Abschluss","Sprache","Ergebnis"], ans:0, hint:"「etw. zum _____ bringen」で「〜を表現する」という意味になる名詞。", exp:"zum Ausdruck bringen＝〜を表現する。zum Abschluss bringen（終わらせる）、zur Sprache bringen（話題にする）との混同に注意。" },
      { type:"n", q:"Die Schüler machen in diesem Jahr große _______ .", opts:["Erfahrungen","Fortschritte","Ausnahmen","Eindrücke"], ans:1, hint:"「Fortschritte machen」で「進歩する」という意味。", exp:"Fortschritte machen＝進歩する。Erfahrungen machen（経験を積む）、Ausnahmen machen（例外を設ける）も重要なFVG。" },
      { type:"n", q:"Wir müssen Konsequenzen aus dem _______ ziehen.", opts:["Schluss","Vergleich","Versagen","Betrieb"], ans:2, hint:"「aus etw. Konsequenzen ziehen」＝〜から教訓を得る。空欄は「失敗」を意味する名詞。", exp:"Konsequenzen aus dem Versagen ziehen＝失敗から教訓を得る・結果を引き受ける。Versagen は「失敗・機能不全」を意味する名詞。" },
      { type:"n", q:"Das Thema kam in der Sitzung zur _______ .", opts:["Verfügung","Entscheidung","Sprache","Kraft"], ans:2, hint:"「zur _____ kommen」で「話題になる」という意味。対構造のペアにも注意。", exp:"zur Sprache kommen＝話題になる（自然に）。対構造として jd. bringt etw. zur Sprache（意図的に話題にする）と区別する。" },
      { type:"n", q:"Der Vorschlag fand breite _______ im Parlament.", opts:["Anerkennung","Zustimmung","Verwendung","Lösung"], ans:1, hint:"「breite _____ finden」＝広く賛同を得る。対構造ペアでは auf Widerstand stoßen と対になる。", exp:"Zustimmung finden＝賛同を得る。対構造として auf Widerstand / Kritik stoßen（抵抗・批判に直面する）と対比できる。Anerkennung finden（認められる）も重要なFVG。" },
      { type:"v", q:"Er _______ klar Stellung zum Vorschlag.", opts:["machte","nahm","brachte","gab"], ans:1, hint:"「Stellung _____ zu」で「〜に対して立場をとる」という意味。", exp:"Stellung nehmen zu＝〜に対して立場をとる。nehmen グループの重要表現。" },
      { type:"v", q:"Die Kommission _______ zu dem Schluss, dass weitere Maßnahmen nötig sind.", opts:["brachte","setzte","kam","zog"], ans:2, hint:"「zu dem Schluss _____ 」で「〜という結論に至る」という意味。", exp:"zu dem Schluss kommen＝〜という結論に至る。kommen グループの頻出表現。" },
      { type:"v", q:"Das Gericht _______ das Urteil außer Kraft.", opts:["trat","setzte","brachte","führte"], ans:1, hint:"「etw. außer Kraft _______」で「〜を無効にする・廃止する」。対構造に注意。", exp:"außer Kraft setzen＝〜を無効にする・廃止する。対構造として außer Kraft treten（失効する）と区別する。setzen＝主体的行為、treten＝自動的状態変化。" },
      { type:"v", q:"Experten _______ scharfe Kritik an dem Plan.", opts:["machten","nahmen","übten","leisteten"], ans:2, hint:"「Kritik _____ an」で「〜に批判を加える」という意味。", exp:"Kritik üben an＝〜に批判を加える。üben グループの重要表現。" },
      { type:"v", q:"Viele Traditionen sind in Vergessenheit _______.", opts:["gebracht","gesetzt","geraten","gefallen"], ans:2, hint:"「in Vergessenheit _______」で「忘れられていく」。意図なく自然にそうなる動詞。", exp:"in Vergessenheit geraten＝忘れられていく（自然に）。対構造として etw. in Vergessenheit bringen（意図的に忘れさせる）と区別する。geraten＝自動的な状態変化。" },
      { type:"p", q:"Die Arbeit nimmt viel Zeit _______ Anspruch.", opts:["für","in","zur","unter"], ans:1, hint:"「etw. _____ Anspruch nehmen」で「〜を要求する・消費する」。", exp:"in Anspruch nehmen＝〜を要求する・消費する。前置詞は in（4格）。" },
      { type:"p", q:"Sie stellte ihr Können _______ Beweis.", opts:["in","für","unter","außer"], ans:2, hint:"「etw. _______ Beweis stellen」で「〜を証明する・実証する」。", exp:"unter Beweis stellen＝〜を証明する・実証する。前置詞は unter（4格）。in Frage stellen（疑問視する）などの類似表現と混同しないこと。" },
      { type:"p", q:"Diese Aussage steht _______ Widerspruch zu den Fakten.", opts:["in","im","an","unter"], ans:1, hint:"「im _______ stehen zu」で「〜と矛盾している」。im は in dem の縮約形。", exp:"im Widerspruch stehen zu＝〜と矛盾している（状態）。im は in dem の縮約形。対構造として in Widerspruch geraten zu（矛盾するようになる）と区別する。" },
      { type:"p", q:"Er nahm den Misserfolg _______ Anlass, seine Methode zu überdenken.", opts:["in","von","zum","für"], ans:2, hint:"「etw. _______ Anlass nehmen」で「〜をきっかけにする」。", exp:"zum Anlass nehmen＝〜を機会・きっかけにする。前置詞は zu（3格）で zum となる。" },
      { type:"p", q:"Wirtschaftliche Interessen stehen _______ Vordergrund.", opts:["an","in","im","unter"], ans:2, hint:"「_______ Vordergrund stehen」で「前面にある・重視されている」。im は in dem の縮約形。", exp:"im Vordergrund stehen＝前面にある・重視されている（状態）。im は in dem の縮約形。対構造として etw. in den Vordergrund stellen（〜を前面に出す）と区別する。" },
    ]
  },
  {
    label: "テストB",
    questions: [
      { type:"n", q:"Die Regierung kam zur _______ , den Plan zu ändern.", opts:["Sprache","Entscheidung","Verfügung","Kraft"], ans:1, hint:"「zur _______ kommen」で「決定に至る」という意味。", exp:"zur Entscheidung kommen＝決定に至る。zur Verfügung kommen（提供される）との混同に注意。" },
      { type:"n", q:"Die neue Anlage wurde offiziell in _______ genommen.", opts:["Anspruch","Kraft","Betrieb","Schutz"], ans:2, hint:"「in _______ nehmen」で「稼働させる・運用開始する」という意味。対義表現も重要。", exp:"in Betrieb nehmen＝稼働させる・運用開始する。対義として außer Betrieb nehmen（運用停止する）がある。" },
      { type:"n", q:"Die Bevölkerung leistete _______ gegen die neuen Maßnahmen.", opts:["Beitrag","Widerstand","Hilfe","Kritik"], ans:1, hint:"「_______ leisten」で「抵抗する」という意味。leisten グループの重要表現。", exp:"Widerstand leisten＝抵抗する。einen Beitrag leisten（貢献する）、Hilfe leisten（援助する）も重要なFVG。" },
      { type:"n", q:"Das Klima hat großen _______ auf die Gesundheit.", opts:["Eindruck","Einfluss","Anspruch","Wert"], ans:1, hint:"「_______ haben auf」で「〜に影響がある（状態）」という意味。", exp:"Einfluss haben auf＝〜に影響がある（状態）。対構造として Einfluss ausüben auf（意図的に影響を及ぼす）と区別する。" },
      { type:"n", q:"Der Lehrer gab eine ausführliche _______ zu dem Thema.", opts:["Antwort","Aussage","Erklärung","Begründung"], ans:2, hint:"「eine _______ geben」で「説明する・解説する」という意味。", exp:"eine Erklärung geben＝説明する。eine Antwort geben（回答する）、ein Beispiel geben（例を挙げる）も重要なFVG。" },
      { type:"v", q:"Sie _______ das Missverständnis schnell in Ordnung.", opts:["kam","brachte","nahm","stellte"], ans:1, hint:"「etw. in Ordnung _______」で「〜を整理する・解決する」という意味。", exp:"in Ordnung bringen＝〜を整理する・解決する。bringen グループの重要表現。" },
      { type:"v", q:"Das Unternehmen _______ seinen Mitarbeitern Laptops zur Verfügung.", opts:["stand","stellte","brachte","nahm"], ans:1, hint:"「etw. zur Verfügung _______」で「〜を提供する」。対構造の能動側の動詞。", exp:"zur Verfügung stellen＝提供する・用意する。対構造として zur Verfügung stehen（利用できる状態にある）と区別する。stellen＝提供する行為、stehen＝利用可能な状態。" },
      { type:"v", q:"Die Regierung _______ das neue Gesetz am 1. Januar in Kraft.", opts:["trat","führte","setzte","brachte"], ans:2, hint:"「etw. in Kraft _______」で「〜を施行する・発効させる」。対構造に注意。", exp:"in Kraft setzen＝施行する・発効させる。対構造として in Kraft treten（発効する・自動的に）と区別する。setzen＝主体が施行する、treten＝自動的に状態になる。" },
      { type:"v", q:"Sie _______ einen wichtigen Beitrag zur Forschung.", opts:["machte","gab","leistete","nahm"], ans:2, hint:"「einen Beitrag _______」で「貢献する」という意味。leisten グループ。", exp:"einen Beitrag leisten＝貢献する。leisten グループでは Widerstand leisten（抵抗する）、Hilfe leisten（援助する）も重要。" },
      { type:"v", q:"Wir sollten alle Möglichkeiten in Betracht _______.", opts:["stellen","nehmen","bringen","ziehen"], ans:3, hint:"「etw. in Betracht _______」で「〜を考慮する」。ziehen グループ。", exp:"in Betracht ziehen＝〜を考慮する。ziehen グループでは Schlüsse ziehen（結論を引き出す）、in Zweifel ziehen（疑問視する）も重要。" },
      { type:"p", q:"Der Chef setzt die Mitarbeiter _______ Druck.", opts:["in","unter","an","im"], ans:1, hint:"「jdn. _______ Druck setzen」で「〜にプレッシャーをかける」。前置詞は何格？", exp:"unter Druck setzen＝〜にプレッシャーをかける。前置詞は unter（4格）。対応する状態表現 unter Druck stehen（プレッシャーを受けている）も重要。" },
      { type:"p", q:"Viele Arbeitsplätze stehen _______ dem Spiel.", opts:["in","von","auf","an"], ans:2, hint:"「_______ dem Spiel stehen」で「危機にさらされている」。auf +D の形。", exp:"auf dem Spiel stehen＝危機にさらされている。前置詞は auf（3格）で auf dem となる。" },
      { type:"p", q:"Die zwei Firmen stehen _______ enger Verbindung.", opts:["von","in","unter","zu"], ans:1, hint:"「_______ Verbindung stehen」で「つながりがある・連絡している」。", exp:"in Verbindung stehen＝つながりがある・連絡している。前置詞は in（3格）。" },
      { type:"p", q:"Diese Lösung kommt leider nicht _______ Frage.", opts:["von","an","in","für"], ans:2, hint:"「_______ Frage kommen」で「考えられる（否定形で多用）」という意味。", exp:"in Frage kommen＝考えられる・当てはまる。前置詞は in（4格）。etw. in Frage stellen（疑問視する）との混同に注意。" },
      { type:"p", q:"Wie sind Sie mit dem Unternehmen _______ Kontakt gekommen?", opts:["an","bei","für","in"], ans:3, hint:"「_______ Kontakt kommen」で「接触する・連絡をとる」という意味。", exp:"in Kontakt kommen＝接触する・連絡をとる。前置詞は in（4格）。Kontakt aufnehmen（連絡をとる）とも対応する。" },
    ]
  },
  {
    label: "テストC",
    questions: [
      { type:"n", q:"Es ist schwer, Beruf und Familie in _______ zu bringen.", opts:["Ordnung","Einklang","Zusammenhang","Gang"], ans:1, hint:"「in _______ bringen mit」で「〜と一致させる・調和させる」という意味。", exp:"in Einklang bringen＝〜と一致させる・調和させる。in Ordnung bringen（整理・解決する）、in Zusammenhang bringen（関連づける）との混同に注意。" },
      { type:"n", q:"Man sollte auf ältere Menschen _______ nehmen.", opts:["Stellung","Kontakt","Rücksicht","Anteil"], ans:2, hint:"「_______ nehmen auf」で「〜に配慮する」という意味。", exp:"Rücksicht nehmen auf＝〜に配慮する。nehmen グループの重要表現。Stellung nehmen（立場をとる）との混同に注意。" },
      { type:"n", q:"Bitte gib mir _______ , sobald du ankommst.", opts:["Bescheid","Antwort","Beispiel","Auskunft"], ans:0, hint:"「_______ geben」で「知らせる・通知する」という意味。済んだら辺りの言い方。", exp:"Bescheid geben＝知らせる・通知する。geben グループの重要表現。eine Antwort geben（回答する）、ein Beispiel geben（例を挙げる）と区別する。" },
      { type:"n", q:"Er hat _______ mit der neuen Software.", opts:["Interesse","Möglichkeit","Schwierigkeiten","Angst"], ans:2, hint:"「_______ haben mit」で「〜に困難がある」という意味。複数形で使う。", exp:"Schwierigkeiten haben mit＝〜に困難がある。haben グループの重要表現。Interesse haben an（関心がある）、Angst haben vor（恐れている）も重要。" },
      { type:"n", q:"Neue Erkenntnisse finden _______ in die Praxis.", opts:["Anerkennung","Verwendung","Eingang","Zustimmung"], ans:2, hint:"「_______ finden in」で「〜に取り入れられる・組み込まれる」という意味。", exp:"Eingang finden in＝〜に取り入れられる・組み込まれる。Anerkennung finden（認められる）、Verwendung finden（利用される）との混同に注意。" },
      { type:"v", q:"Er _______ einen interessanten Vorschlag in der Sitzung.", opts:["nahm","machte","brachte","gab"], ans:1, hint:"「einen Vorschlag _______」で「提案する」という意味。machen グループ。", exp:"einen Vorschlag machen＝提案する。machen グループでは Fortschritte machen（進歩する）、Erfahrungen machen（経験を積む）も重要。" },
      { type:"v", q:"Wir müssen gewisse Nachteile in Kauf _______.", opts:["bringen","stellen","nehmen","setzen"], ans:2, hint:"「etw. in Kauf _______」で「〜を甘受する・やむなく受け入れる」という意味。", exp:"in Kauf nehmen＝〜を甘受する・やむなく受け入れる。nehmen グループの頻出表現。" },
      { type:"v", q:"Wir müssen Schlüsse aus den Daten _______.", opts:["nehmen","stellen","machen","ziehen"], ans:3, hint:"「Schlüsse _______ aus」で「〜から結論を引き出す」という意味。ziehen グループ。", exp:"Schlüsse ziehen aus＝〜から結論を引き出す。ziehen グループでは Grenzen ziehen（境界を設ける）、einen Vergleich ziehen（比較を行う）も重要。" },
      { type:"v", q:"Es gelang ihnen, den festgefahrenen Prozess in Gang zu _______.", opts:["kommen","setzen","bringen","stellen"], ans:2, hint:"「etw. in Gang _______」で「〜を動かす・始動させる」。対構造の能動側。", exp:"in Gang bringen＝〜を動かす・始動させる。対構造として in Gang sein（進行中である）、in Bewegung kommen（動き出す）と区別する。" },
      { type:"v", q:"Beide Seiten _______ intensive Verhandlungen.", opts:["übten","führten","leisteten","machten"], ans:1, hint:"「Verhandlungen _______」で「交渉を行う」という意味。führen グループ。", exp:"Verhandlungen führen＝交渉を行う。führen グループでは eine Diskussion führen（議論を行う）、ein Gespräch führen（会話する）も重要。" },

const tagLabel = { n:"名詞", v:"動詞", p:"前置詞" };
const tagClass = { n:"noun", v:"verb", p:"prep" };

let currentSet = 0;
let current = 0;
let score = 0;
let answered = false;

function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}

function selectSet(idx) {
  currentSet = idx;
  current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  const total = qs.length;
  document.getElementById('q-num').textContent = `問${current+1}`;
  const tag = document.getElementById('q-tag');
  tag.textContent = '【' + tagLabel[q.type] + '】';
  tag.className = 'question-tag ' + tagClass[q.type];
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-bar').style.width = `${((current+1)/total)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${total}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}

function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。　' + q.exp;
  }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}

function nextQuestion() {
  current++;
  if (current < sets[currentSet].questions.length) {
    render();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = '';
  if (pct >= 90) msg = '素晴らしい！ほぼ完璧です。';
  else if (pct >= 70) msg = 'よくできました。間違えた表現を復習しましょう。';
  else if (pct >= 50) msg = 'もう少しです。リストを見直してから再挑戦しましょう。';
  else msg = 'FVGリストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) {
    nb.style.display = 'inline-block';
    nb.textContent = sets[currentSet + 1].label + 'へ →';
  } else {
    nb.style.display = 'none';
  }
}

function restart() {
  current = 0; score = 0;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function goNextSet() { selectSet(currentSet + 1); }

initSetNav();
render();
</script>
