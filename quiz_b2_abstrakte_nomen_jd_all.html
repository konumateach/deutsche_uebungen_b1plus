<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象名詞テスト B2レベル（日→独）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 8px; }
  .question-text { font-size: 17px; font-weight: 500; margin-bottom: 1.25rem; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: "Segoe UI", "Candara", sans-serif; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>抽象名詞テスト　B2レベル</h1>
    <p>日本語の意味に合うドイツ語名詞を選びなさい。（各テスト20問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← ポータルに戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:5%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このテストをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のテストへ →</button>
    </div>
  </div>
</div>
<script>
const sets = [
  { label:"テストA", questions:[
    { q:"「態度・姿勢・立場」を意味するドイツ語名詞はどれか。", opts:["die Haltung","die Weltanschauung","die Prämisse","die Norm"], ans:0, hint:"eine klare Haltung einnehmen（明確な立場をとる）の形でよく使う。", exp:"die Haltung（-，-en）＝態度・姿勢・立場。eine klare Haltung einnehmen（明確な立場をとる）。" },
    { q:"「世界観」を意味するドイツ語名詞はどれか。", opts:["das Paradigma","die Ideologie","die Weltanschauung","das Ideal"], ans:2, hint:"Welt（世界）＋ Anschauung（見方）からなる複合名詞。", exp:"die Weltanschauung（-，-en）＝世界観。eine konservative Weltanschauung vertreten（保守的な世界観を持つ）。" },
    { q:"「原則・原理」を意味するドイツ語名詞はどれか。", opts:["die These","das Prinzip","die Moral","die Norm"], ans:1, hint:"an einem Prinzip festhalten（原則を守る）の形でよく使う。", exp:"das Prinzip（-s，-ien）＝原則・原理。an einem Prinzip festhalten（原則を守る）。" },
    { q:"「規範・基準」を意味するドイツ語名詞はどれか。", opts:["die Norm","das Ideal","die Prämisse","die Haltung"], ans:0, hint:"gesellschaftliche Normen（社会的規範）の形でよく使う。", exp:"die Norm（-，-en）＝規範・基準。gesellschaftliche Normen in Frage stellen（社会的規範を問い直す）。" },
    { q:"「理想」を意味するドイツ語名詞はどれか。", opts:["die These","die Moral","die Ideologie","das Ideal"], ans:3, hint:"einem Ideal nachjagen（理想を追い求める）の形でよく使う。", exp:"das Ideal（-s，-e）＝理想。einem Ideal nachjagen（理想を追い求める）。" },
    { q:"「イデオロギー・思想体系」を意味するドイツ語名詞はどれか。", opts:["die Ideologie","das Paradigma","die Norm","die Weltanschauung"], ans:0, hint:"einer Ideologie anhängen（イデオロギーに傾倒する）の形でよく使う。", exp:"die Ideologie（-，-n）＝イデオロギー・思想体系。einer Ideologie anhängen（イデオロギーに傾倒する）。" },
    { q:"「パラダイム・思考の枠組み」を意味するドイツ語名詞はどれか。", opts:["die Prämisse","die Weltanschauung","das Paradigma","das Ideal"], ans:2, hint:"ein Paradigma überwinden（パラダイムを乗り越える）の形でよく使う。ギリシャ語由来。", exp:"das Paradigma（-s，-men）＝パラダイム・思考の枠組み。ein Paradigma überwinden（パラダイムを乗り越える）。" },
    { q:"「前提・大前提」を意味するドイツ語名詞はどれか。", opts:["die Norm","die Prämisse","die Haltung","die These"], ans:1, hint:"von falschen Prämissen ausgehen（誤った前提から出発する）の形でよく使う。", exp:"die Prämisse（-，-n）＝前提・大前提。von falschen Prämissen ausgehen（誤った前提から出発する）。" },
    { q:"「命題・主張」を意味するドイツ語名詞はどれか。", opts:["die These","die Moral","das Prinzip","die Ideologie"], ans:0, hint:"eine These aufstellen und belegen（命題を立てて論証する）の形でよく使う。", exp:"die These（-，-n）＝命題・主張。eine These aufstellen und belegen（命題を立てて論証する）。" },
    { q:"「道徳・倫理」を意味するドイツ語名詞はどれか。", opts:["das Ideal","die Norm","die Moral","das Paradigma"], ans:2, hint:"moralische Grundsätze verletzen（道徳的原則を犯す）の形でよく使う。", exp:"die Moral（-，-en）＝道徳・倫理。moralische Grundsätze verletzen（道徳的原則を犯す）。" },
    { q:"「論拠・議論」を意味するドイツ語名詞はどれか。", opts:["die Hypothese","das Argument","die Objektivität","die Evidenz"], ans:1, hint:"ein überzeugendes Argument liefern（説得力ある論拠を示す）の形でよく使う。", exp:"das Argument（-s，-e）＝論拠・議論。ein überzeugendes Argument liefern（説得力ある論拠を示す）。" },
    { q:"「仮説」を意味するドイツ語名詞はどれか。", opts:["die Schlussfolgerung","die Hypothese","die Praxis","die Evidenz"], ans:1, hint:"eine Hypothese aufstellen und testen（仮説を立てて検証する）の形でよく使う。", exp:"die Hypothese（-，-n）＝仮説。eine Hypothese aufstellen und testen（仮説を立てて検証する）。" },
    { q:"「結論・推論」を意味するドイツ語名詞はどれか。", opts:["die Objektivität","die Theorie","die Schlussfolgerung","die Ambiguität"], ans:2, hint:"eine voreilige Schlussfolgerung ziehen（早まった結論を出す）の形でよく使う。", exp:"die Schlussfolgerung（-，-en）＝結論・推論。eine voreilige Schlussfolgerung ziehen（早まった結論を出す）。" },
    { q:"「実践・現場・慣行」を意味するドイツ語名詞はどれか。", opts:["die Praxis","die Theorie","die Evidenz","die Subjektivität"], ans:0, hint:"Theorie und Praxis in Einklang bringen（理論と実践を一致させる）の形でよく使う。", exp:"die Praxis（-，Praxen）＝実践・現場・慣行。Theorie und Praxis in Einklang bringen（理論と実践を一致させる）。" },
    { q:"「理論」を意味するドイツ語名詞はどれか。", opts:["die Ambiguität","die Praxis","die Theorie","die Objektivität"], ans:2, hint:"eine Theorie widerlegen（理論を反証する）の形でよく使う。", exp:"die Theorie（-，-n）＝理論。eine Theorie widerlegen（理論を反証する）。" },
    { q:"「矛盾・反論」を意味するドイツ語名詞はどれか。", opts:["die Evidenz","der Widerspruch","die Subjektivität","die Objektivität"], ans:1, hint:"in Widerspruch zu etw. stehen（〜と矛盾している）の形でよく使う。", exp:"der Widerspruch（-s，Widersprüche）＝矛盾・反論。in Widerspruch zu etw. stehen（〜と矛盾している）。" },
    { q:"「客観性」を意味するドイツ語名詞はどれか。", opts:["die Ambiguität","die Objektivität","die Subjektivität","die Evidenz"], ans:1, hint:"wissenschaftliche Objektivität wahren（科学的客観性を保つ）の形でよく使う。", exp:"die Objektivität（-，-）＝客観性。wissenschaftliche Objektivität wahren（科学的客観性を保つ）。" },
    { q:"「主観性」を意味するドイツ語名詞はどれか。", opts:["die Objektivität","die Hypothese","die Subjektivität","die Theorie"], ans:2, hint:"die Subjektivität des Urteils eingestehen（判断の主観性を認める）の形でよく使う。", exp:"die Subjektivität（-，-）＝主観性。die Subjektivität des Urteils eingestehen（判断の主観性を認める）。" },
    { q:"「根拠・証拠・エビデンス」を意味するドイツ語名詞はどれか。", opts:["die Schlussfolgerung","die Praxis","die Evidenz","die Ambiguität"], ans:2, hint:"empirische Evidenz vorlegen（実証的根拠を提示する）の形でよく使う。", exp:"die Evidenz（-，-en）＝根拠・証拠・エビデンス。empirische Evidenz vorlegen（実証的根拠を提示する）。" },
    { q:"「曖昧性・多義性」を意味するドイツ語名詞はどれか。", opts:["die Objektivität","die Ambiguität","die Theorie","der Widerspruch"], ans:1, hint:"mit Ambiguität produktiv umgehen（曖昧さを積極的に扱う）の形でよく使う。", exp:"die Ambiguität（-，-en）＝曖昧性・多義性。mit Ambiguität produktiv umgehen（曖昧さを積極的に扱う）。" },
  ]},
  { label:"テストB", questions:[
    { q:"「権力・力」を意味するドイツ語名詞はどれか。", opts:["die Autorität","die Macht","die Struktur","die Hierarchie"], ans:1, hint:"Macht ausüben（権力を行使する）の形でよく使う。", exp:"die Macht（-，Mächte）＝権力・力。Macht ausüben und Macht missbrauchen（権力を行使し、権力を乱用する）。" },
    { q:"「権威・権限」を意味するドイツ語名詞はどれか。", opts:["die Legitimität","die Autorität","die Macht","die Institution"], ans:1, hint:"die Autorität des Staates in Frage stellen（国家の権威を問い直す）の形でよく使う。", exp:"die Autorität（-，-en）＝権威・権限。die Autorität des Staates in Frage stellen（国家の権威を問い直す）。" },
    { q:"「制度・機関」を意味するドイツ語名詞はどれか。", opts:["die Transparenz","die Institution","die Hierarchie","der Konsens"], ans:1, hint:"demokratische Institutionen stärken（民主的機関を強化する）の形でよく使う。", exp:"die Institution（-，-en）＝制度・機関。demokratische Institutionen stärken（民主的機関を強化する）。" },
    { q:"「構造」を意味するドイツ語名詞はどれか。", opts:["die Struktur","der Mechanismus","die Macht","die Rechenschaft"], ans:0, hint:"bestehende Strukturen aufbrechen（既存の構造を打破する）の形でよく使う。", exp:"die Struktur（-，-en）＝構造。bestehende Strukturen aufbrechen（既存の構造を打破する）。" },
    { q:"「メカニズム・仕組み」を意味するドイツ語名詞はどれか。", opts:["die Hierarchie","die Transparenz","der Mechanismus","die Legitimität"], ans:2, hint:"einen Kontrollmechanismus einführen（管理メカニズムを導入する）の形でよく使う。", exp:"der Mechanismus（-，-men）＝メカニズム・仕組み。einen Kontrollmechanismus einführen（管理メカニズムを導入する）。" },
    { q:"「階層・ヒエラルキー」を意味するドイツ語名詞はどれか。", opts:["die Rechenschaft","die Hierarchie","der Konsens","die Autorität"], ans:1, hint:"starre Hierarchien abbauen（硬直した階層を解消する）の形でよく使う。", exp:"die Hierarchie（-，-n）＝階層・ヒエラルキー。starre Hierarchien abbauen（硬直した階層を解消する）。" },
    { q:"「正当性」を意味するドイツ語名詞はどれか。", opts:["die Struktur","die Legitimität","die Transparenz","die Institution"], ans:1, hint:"die Legitimität einer Entscheidung anzweifeln（決定の正当性を疑う）の形でよく使う。", exp:"die Legitimität（-，-）＝正当性。die Legitimität einer Entscheidung anzweifeln（決定の正当性を疑う）。" },
    { q:"「透明性」を意味するドイツ語名詞はどれか。", opts:["die Rechenschaft","der Konsens","die Transparenz","die Macht"], ans:2, hint:"mehr Transparenz im Verfahren fordern（手続きの透明性を求める）の形でよく使う。", exp:"die Transparenz（-，-）＝透明性。mehr Transparenz im Verfahren fordern（手続きの透明性を求める）。" },
    { q:"「説明責任・報告義務」を意味するドイツ語名詞はどれか。", opts:["die Transparenz","die Hierarchie","die Rechenschaft","die Legitimität"], ans:2, hint:"Rechenschaft ablegen müssen（説明責任を果たさなければならない）の形でよく使う。", exp:"die Rechenschaft（-，-）＝説明責任・報告義務。Rechenschaft ablegen müssen（説明責任を果たさなければならない）。" },
    { q:"「合意・コンセンサス」を意味するドイツ語名詞はどれか。", opts:["der Konsens","die Struktur","die Autorität","der Mechanismus"], ans:0, hint:"einen breiten Konsens erzielen（広いコンセンサスを達成する）の形でよく使う。", exp:"der Konsens（-es，-e）＝合意・コンセンサス。einen breiten Konsens erzielen（広いコンセンサスを達成する）。" },
    { q:"「変容・変革（構造的）」を意味するドイツ語名詞はどれか。", opts:["die Krise","der Wandel","der Übergang","die Kontinuität"], ans:1, hint:"einem tiefgreifenden Wandel unterliegen（深い変革にさらされる）の形でよく使う。", exp:"der Wandel（-s，-）＝変容・変革（構造的）。einem tiefgreifenden Wandel unterliegen（深い変革にさらされる）。" },
    { q:"「変換・転換・トランスフォーメーション」を意味するドイツ語名詞はどれか。", opts:["die Transformation","der Bruch","die Stagnation","der Rückschlag"], ans:0, hint:"eine digitale Transformation durchlaufen（デジタル転換を経る）の形でよく使う。", exp:"die Transformation（-，-en）＝変換・転換。eine digitale Transformation durchlaufen（デジタル転換を経る）。" },
    { q:"「移行・過渡期」を意味するドイツ語名詞はどれか。", opts:["der Impuls","die Krise","der Übergang","die Eskalation"], ans:2, hint:"in einer Phase des Übergangs stehen（移行期にある）の形でよく使う。", exp:"der Übergang（-s，Übergänge）＝移行・過渡期。in einer Phase des Übergangs stehen（移行期にある）。" },
    { q:"「危機」を意味するドイツ語名詞はどれか。", opts:["der Wandel","die Krise","die Stagnation","der Bruch"], ans:1, hint:"eine Krise bewältigen（危機を乗り越える）の形でよく使う。", exp:"die Krise（-，-n）＝危機。eine Krise bewältigen（危機を乗り越える）。" },
    { q:"「断絶・決裂・亀裂」を意味するドイツ語名詞はどれか。", opts:["der Rückschlag","der Bruch","die Eskalation","die Kontinuität"], ans:1, hint:"ein historischer Bruch mit der Vergangenheit（過去との歴史的断絶）の形でよく使う。", exp:"der Bruch（-s，Brüche）＝断絶・決裂・亀裂。ein historischer Bruch mit der Vergangenheit（過去との歴史的断絶）。" },
    { q:"「継続性・連続性」を意味するドイツ語名詞はどれか。", opts:["die Kontinuität","der Wandel","der Impuls","die Transformation"], ans:0, hint:"die Kontinuität der Politik wahren（政策の継続性を保つ）の形でよく使う。", exp:"die Kontinuität（-，-en）＝継続性・連続性。die Kontinuität der Politik wahren（政策の継続性を保つ）。" },
    { q:"「後退・挫折・逆風」を意味するドイツ語名詞はどれか。", opts:["die Eskalation","die Stagnation","der Rückschlag","die Krise"], ans:2, hint:"einen schweren Rückschlag erleiden（重大な後退を被る）の形でよく使う。", exp:"der Rückschlag（-s，Rückschläge）＝後退・挫折・逆風。einen schweren Rückschlag erleiden（重大な後退を被る）。" },

const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 20;

function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet;
  else sets.push(randomSet);
}
buildRandomSet();

let currentSet = 0, current = 0, score = 0, answered = false;

function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (s.label === RANDOM_LABEL ? ' random-btn' : '') + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}

function selectSet(idx) {
  if (sets[idx] && sets[idx].label === RANDOM_LABEL) buildRandomSet();
  currentSet = idx; current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (sets[i].label === RANDOM_LABEL ? ' random-btn' : '') + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  document.getElementById('q-num').textContent = `問${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-bar').style.width = `${((current+1)/qs.length)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${qs.length}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}

function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。　' + q.exp;
  }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}

function nextQuestion() {
  current++;
  if (current < sets[currentSet].questions.length) render();
  else showResult();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = pct >= 90 ? '素晴らしい！ほぼ完璧です。' : pct >= 70 ? 'よくできました。間違えた語を復習しましょう。' : pct >= 50 ? 'もう少しです。リストを見直してから再挑戦しましょう。' : '語彙リストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) { nb.style.display = 'inline-block'; nb.textContent = sets[currentSet + 1].label + 'へ →'; }
  else nb.style.display = 'none';
}

function restart() {
  current = 0; score = 0;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function goNextSet() { selectSet(currentSet + 1); }

initSetNav();
render();
</script>
