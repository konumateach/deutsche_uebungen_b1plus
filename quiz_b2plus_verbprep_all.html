<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動詞コロケーションテスト B2+レベル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 8px; }
  .question-text { font-size: 19px; font-weight: 500; margin-bottom: 6px; line-height: 1.7; font-family: "Segoe UI", "Candara", sans-serif; }
  .question-ex { font-size: 17px; color: #555; margin-bottom: 1.2rem; line-height: 1.6; font-family: "Segoe UI", "Candara", sans-serif; font-style: italic; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 16px; font-family: "Segoe UI", "Candara", sans-serif; font-weight: 500; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; display: none; font-family: "Segoe UI", "Candara", sans-serif; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>動詞コロケーションテスト　B2+レベル</h1>
    <p>空欄に入る前置詞を選びなさい。（各テスト10問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index_b2plus.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← 戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:10%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="question-ex" id="q-ex"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このテストをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のテストへ →</button>
    </div>
  </div>
</div>
<script>
const sets = [
  { label:"テストA", questions:[{ de:"mutieren _____ +D　「〜に変容する・〜に変わる」", ex:"Die Bewegung mutierte _____ einer Partei.", opts:["zu", "auf", "für", "in"], ans:0, hint:"〜に変容する・〜に変わる。zu +Dativ の形。", exp:"mutieren zu +D＝〜に変容する・〜に変わる。zu は Dativ 支配。" },
    { de:"einstehen _____ +A　「〜に責任を持つ・〜を保証する」", ex:"Ich stehe _____ meine Entscheidung ein.", opts:["an", "von", "für", "auf"], ans:2, hint:"〜に責任を持つ・〜を保証する。für +Akkusativ の形。", exp:"einstehen für +A＝〜に責任を持つ・〜を保証する。für は Akkusativ 支配。" },
    { de:"abzielen _____ +A　「〜を狙う・目指す」", ex:"Die Maßnahme zielt _____ eine Verbesserung ab.", opts:["auf", "für", "an", "zu"], ans:0, hint:"〜を狙う・目指す。auf +Akkusativ の形。", exp:"abzielen auf +A＝〜を狙う・目指す。auf は Akkusativ 支配。" },
    { de:"folgern _____ +D　「〜から結論を引き出す」", ex:"Was lässt sich daraus folgern?", opts:["von", "aus", "für", "an"], ans:1, hint:"〜から結論を引き出す。aus +Dativ の形。", exp:"folgern aus +D＝〜から結論を引き出す。aus は Dativ 支配。" },
    { de:"disponieren _____ +A　「〜を自由に使う・〜を処分する」", ex:"Er kann frei _____ sein Vermögen disponieren.", opts:["mit", "von", "über", "auf"], ans:2, hint:"〜を自由に使う・〜を処分する。über +Akkusativ の形。", exp:"disponieren über +A＝〜を自由に使う・〜を処分する。über は Akkusativ 支配。" },
    { de:"absehen _____ +D　「〜を見逃す・〜を除いて考える」", ex:"Von Ausnahmen abgesehen gilt die Regel.", opts:["an", "für", "mit", "von"], ans:3, hint:"〜を見逃す・〜を除いて考える。von +Dativ の形。", exp:"absehen von +D＝〜を見逃す・〜を除いて考える。von は Dativ 支配。" },
    { de:"sich annähern _____ +A　「〜に近づく・歩み寄る」", ex:"Beide Seiten nähern sich einer Lösung an.", opts:["an", "auf", "für", "zu"], ans:0, hint:"〜に近づく・歩み寄る。an +Akkusativ の形。", exp:"sich annähern an +A＝〜に近づく・歩み寄る。an は Akkusativ 支配。" },
    { de:"ankämpfen _____ +A　「〜と戦う・〜に抗う」", ex:"Sie kämpfte _____ die Ungerechtigkeit an.", opts:["für", "gegen", "an", "von"], ans:1, hint:"〜と戦う・〜に抗う。gegen +Akkusativ の形。", exp:"ankämpfen gegen +A＝〜と戦う・〜に抗う。gegen は Akkusativ 支配。" },
    { de:"anknüpfen _____ +A　「〜と結びつける・〜を引き継ぐ」", ex:"Er knüpfte _____ frühere Arbeiten an.", opts:["auf", "für", "von", "an"], ans:3, hint:"〜と結びつける・引き継ぐ。an +Akkusativ の形。", exp:"anknüpfen an +A＝〜と結びつける・〜を引き継ぐ。an は Akkusativ 支配。" },
    { de:"erkranken _____ +D　「〜の病気にかかる」", ex:"Er erkrankte _____ einer schweren Grippe.", opts:["von", "an", "für", "mit"], ans:1, hint:"〜の病気にかかる。an +Dativ の形。", exp:"erkranken an +D＝〜の病気にかかる。an は Dativ 支配。" }]},
  { label:"テストB", questions:[{ de:"garantieren _____ +A　「〜を保証する」", ex:"Dafür kann ich nicht garantieren.", opts:["an", "auf", "für", "von"], ans:2, hint:"〜を保証する。für +Akkusativ の形。", exp:"garantieren für +A＝〜を保証する。für は Akkusativ 支配。" },
    { de:"abrechnen _____ +D　「〜と清算する・〜を批判する」", ex:"In dem Buch rechnet er _____ seiner Vergangenheit ab.", opts:["von", "mit", "für", "an"], ans:1, hint:"〜と清算する・〜を批判する。mit +Dativ の形。", exp:"abrechnen mit +D＝〜と清算する・〜を批判する。mit は Dativ 支配。" },
    { de:"anspielen _____ +A　「〜をほのめかす・示唆する」", ex:"Worauf wollen Sie damit anspielen?", opts:["an", "für", "über", "auf"], ans:3, hint:"〜をほのめかす・示唆する。auf +Akkusativ の形。", exp:"anspielen auf +A＝〜をほのめかす・示唆する。auf は Akkusativ 支配。" },
    { de:"immunisieren _____ +A　「〜に免疫を与える・〜に対して鍛える」", ex:"Die Erfahrung immunisiert _____ Enttäuschungen.", opts:["gegen", "auf", "für", "an"], ans:0, hint:"〜に免疫を与える・〜に対して鍛える。gegen +Akkusativ の形。", exp:"immunisieren gegen +A＝〜に免疫を与える・〜に対して鍛える。gegen は Akkusativ 支配。" },
    { de:"hängen _____ +D　「〜に執着する・愛着を持つ」", ex:"Sie hängt sehr _____ ihrem alten Zuhause.", opts:["auf", "bei", "an", "von"], ans:2, hint:"〜に執着する・愛着を持つ。an +Dativ の形。", exp:"hängen an +D＝〜に執着する・愛着を持つ。an は Dativ 支配。" },
    { de:"warnen _____ +D　「〜に警告する」", ex:"Er warnte _____ den Risiken.", opts:["für", "vor", "an", "über"], ans:1, hint:"〜に警告する。vor +Dativ の形。", exp:"warnen vor +D＝〜に警告する。vor は Dativ 支配。" },
    { de:"handeln _____ +D　「〜を扱う・〜がテーマである」", ex:"Das Buch handelt _____ Toleranz.", opts:["von", "über", "an", "mit"], ans:0, hint:"〜を扱う・〜がテーマである。von +Dativ の形。", exp:"handeln von +D＝〜を扱う・〜がテーマである。von は Dativ 支配。" },
    { de:"heranführen _____ +A　「〜に導く・入門させる」", ex:"Das Buch führt Anfänger _____ das Thema heran.", opts:["für", "auf", "von", "an"], ans:3, hint:"〜に導く・入門させる。an +Akkusativ の形。", exp:"heranführen an +A＝〜に導く・入門させる。an は Akkusativ 支配。" },
    { de:"klagen _____ +A　「〜を嘆く・訴える」", ex:"Sie klagte _____ mangelnde Unterstützung.", opts:["für", "an", "über", "von"], ans:2, hint:"〜を嘆く・訴える。über +Akkusativ の形。", exp:"klagen über +A＝〜を嘆く・訴える。über は Akkusativ 支配。" },
    { de:"sich besinnen _____ +A　「〜を思い起こす・〜に立ち返る」", ex:"Es ist Zeit, sich _____ die Grundwerte zu besinnen.", opts:["von", "an", "für", "auf"], ans:3, hint:"〜を思い起こす・〜に立ち返る。auf +Akkusativ の形。", exp:"sich besinnen auf +A＝〜を思い起こす・〜に立ち返る。auf は Akkusativ 支配。" }]},
  { label:"テストC", questions:[{ de:"herrühren _____ +D　「〜に由来する・〜から生じる」", ex:"Der Fehler rührt _____ einem Missverständnis her.", opts:["von", "an", "aus", "für"], ans:0, hint:"〜に由来する・〜から生じる。von +Dativ の形。", exp:"herrühren von +D＝〜に由来する・〜から生じる。von は Dativ 支配。" },
    { de:"korrespondieren _____ +D　「〜と一致する・〜と文通する」", ex:"Das Ergebnis korrespondiert _____ unserer Hypothese.", opts:["für", "an", "von", "mit"], ans:3, hint:"〜と一致する・〜と文通する。mit +Dativ の形。", exp:"korrespondieren mit +D＝〜と一致する・〜と文通する。mit は Dativ 支配。" },
    { de:"rühren _____ +A　「〜に触れる・〜を揺さぶる」", ex:"Die Frage rührt _____ ein Tabu.", opts:["auf", "zu", "an", "gegen"], ans:2, hint:"〜に触れる・〜を揺さぶる。an +Akkusativ の形。", exp:"rühren an +A＝〜に触れる・〜を揺さぶる。an は Akkusativ 支配。" },
    { de:"bauen _____ +A　「〜を当てにする・〜を基盤とする」", ex:"Wir bauen _____ Ihre Unterstützung.", opts:["auf", "an", "für", "von"], ans:0, hint:"〜を当てにする・〜を基盤とする。auf +Akkusativ の形。", exp:"bauen auf +A＝〜を当てにする・〜を基盤とする。auf は Akkusativ 支配。" },
    { de:"opponieren _____ +A　「〜に反対する」", ex:"Mehrere Abgeordnete opponierten _____ den Plan.", opts:["an", "gegen", "für", "von"], ans:1, hint:"〜に反対する。gegen +Akkusativ の形。", exp:"opponieren gegen +A＝〜に反対する。gegen は Akkusativ 支配。" },
    { de:"sich einlassen _____ +A　「〜に関わる・〜に乗り出す」", ex:"Sie ließ sich _____ einen riskanten Deal ein.", opts:["auf", "an", "für", "von"], ans:0, hint:"〜に関わる・〜に乗り出す。auf +Akkusativ の形。", exp:"sich einlassen auf +A＝〜に関わる・〜に乗り出す。auf は Akkusativ 支配。" },
    { de:"mitwirken _____ +D　「〜に関与する・協力する」", ex:"Er wirkte _____ dem Projekt mit.", opts:["mit", "bei", "für", "an"], ans:3, hint:"〜に関与する・協力する。an +Dativ の形。", exp:"mitwirken an +D＝〜に関与する・協力する。an は Dativ 支配。" },
    { de:"meditieren _____ +A　「〜について深く考える」", ex:"Er meditierte _____ den Sinn des Lebens.", opts:["an", "mit", "über", "für"], ans:2, hint:"〜について深く考える。über +Akkusativ の形。", exp:"meditieren über +A＝〜について深く考える。über は Akkusativ 支配。" },
    { de:"haften _____ +A　「〜に責任を負う・弁償する」", ex:"Der Arbeitgeber haftet _____ den Schaden.", opts:["an", "für", "auf", "von"], ans:1, hint:"〜に責任を負う・弁償する。für +Akkusativ の形。", exp:"haften für +A＝〜に責任を負う・弁償する。für は Akkusativ 支配。" },
    { de:"tendieren _____ +D　「〜に傾く・〜の傾向がある」", ex:"Er tendiert _____ radikalen Lösungen.", opts:["an", "für", "auf", "zu"], ans:3, hint:"〜に傾く・〜の傾向がある。zu +Dativ の形。", exp:"tendieren zu +D＝〜に傾く・〜の傾向がある。zu は Dativ 支配。" }]},
  { label:"テストD", questions:[{ de:"greifen _____ +D　「〜に手を伸ばす・〜をつかもうとする」", ex:"Er griff _____ der Macht.", opts:["für", "an", "auf", "nach"], ans:3, hint:"〜に手を伸ばす・〜をつかもうとする。nach +Dativ の形。", exp:"greifen nach +D＝〜に手を伸ばす・〜をつかもうとする。nach は Dativ 支配。" },
    { de:"hervorgehen _____ +D　「〜から生まれる・〜の結果として生じる」", ex:"Aus dem Gespräch ging ein Kompromiss hervor.", opts:["von", "für", "aus", "an"], ans:2, hint:"〜から生まれる・〜の結果として生じる。aus +Dativ の形。", exp:"hervorgehen aus +D＝〜から生まれる・〜の結果として生じる。aus は Dativ 支配。" },
    { de:"triumphieren _____ +A　「〜に勝利する・〜に優る」", ex:"Sie triumphierte _____ ihre Widersacher.", opts:["von", "an", "über", "für"], ans:2, hint:"〜に勝利する・〜に優る。über +Akkusativ の形。", exp:"triumphieren über +A＝〜に勝利する・〜に優る。über は Akkusativ 支配。" },
    { de:"beharren _____ +A　「〜に固執する・譲らない」", ex:"Er beharrt _____ seiner Meinung.", opts:["von", "an", "auf", "für"], ans:2, hint:"〜に固執する・譲らない。auf +Akkusativ の形。", exp:"beharren auf +A＝〜に固執する・譲らない。auf は Akkusativ 支配。" },
    { de:"prahlen _____ +D　「〜を自慢する・〜を鼻にかける」", ex:"Er prahlt ständig _____ seinen Erfolgen.", opts:["über", "mit", "von", "für"], ans:1, hint:"〜を自慢する・〜を鼻にかける。mit +Dativ の形。", exp:"prahlen mit +D＝〜を自慢する・〜を鼻にかける。mit は Dativ 支配。" },
    { de:"sich einstellen _____ +A　「〜に備える・〜に合わせる」", ex:"Wir müssen uns _____ neue Bedingungen einstellen.", opts:["auf", "an", "für", "gegen"], ans:0, hint:"〜に備える・〜に合わせる。auf +Akkusativ の形。", exp:"sich einstellen auf +A＝〜に備える・〜に合わせる。auf は Akkusativ 支配。" },
    { de:"werben _____ +A　「〜を宣伝する・〜の支持を求める」", ex:"Er wirbt _____ seine Partei.", opts:["auf", "für", "an", "von"], ans:1, hint:"〜を宣伝する・〜の支持を求める。für +Akkusativ の形。", exp:"werben für +A＝〜を宣伝する・〜の支持を求める。für は Akkusativ 支配。" },
    { de:"zehren _____ +D　「〜で生きる・〜を消耗する」", ex:"Er zehrt noch immer _____ alten Erfolgen.", opts:["von", "an", "mit", "für"], ans:0, hint:"〜で生きる・〜を消耗する。von +Dativ の形。", exp:"zehren von +D＝〜で生きる・〜を消耗する。von は Dativ 支配。" },
    { de:"zurückschrecken _____ +D　「〜をためらう・〜を恐れて引く」", ex:"Sie schreckt _____ keiner Herausforderung zurück.", opts:["von", "an", "für", "vor"], ans:3, hint:"〜をためらう・〜を恐れて引く。vor +Dativ の形。", exp:"zurückschrecken vor +D＝〜をためらう・〜を恐れて引く。vor は Dativ 支配。" },
    { de:"überreden _____ +D　「〜を説得する・〜するよう口説く」", ex:"Sie überredete ihn _____ Teilnahme.", opts:["für", "zu", "auf", "an"], ans:1, hint:"〜を説得する・〜するよう口説く。zu +Dativ の形。", exp:"überreden zu +D＝〜を説得する・〜するよう口説く。zu は Dativ 支配。" }]},
  { label:"テストE", questions:[{ de:"sich emanzipieren _____ +D　「〜から自立する・〜から解放される」", ex:"Sie emanzipierte sich _____ überkommenen Normen.", opts:["für", "an", "von", "mit"], ans:2, hint:"〜から自立する・〜から解放される。von +Dativ の形。", exp:"sich emanzipieren von +D＝〜から自立する・〜から解放される。von は Dativ 支配。" },

const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 10;
function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet; else sets.push(randomSet);
}
buildRandomSet();
let currentSet=0, current=0, score=0, answered=false;
function initSetNav() {
  const nav = document.getElementById("set-nav");
  sets.forEach((s,i) => {
    const btn = document.createElement("button");
    btn.className = "set-btn"+(s.label===RANDOM_LABEL?" random-btn":"")+(i===0?" active":"");
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}
function selectSet(idx) {
  if (sets[idx]&&sets[idx].label===RANDOM_LABEL) buildRandomSet();
  currentSet=idx; current=0; score=0; answered=false;
  document.querySelectorAll(".set-btn").forEach((b,i) => {
    b.className="set-btn"+(sets[i].label===RANDOM_LABEL?" random-btn":"")+(i===idx?" active":"");
  });
  document.getElementById("result-card").style.display="none";
  document.getElementById("quiz-area").style.display="block";
  render();
}
function render() {
  const qs=sets[currentSet].questions, q=qs[current];
  document.getElementById("q-num").textContent=`問${current+1}`;
  document.getElementById("q-text").textContent=q.de;
  document.getElementById("q-ex").textContent=q.ex;
  document.getElementById("prog-bar").style.width=`${((current+1)/qs.length)*100}%`;
  document.getElementById("prog-text").textContent=`問${current+1} / ${qs.length}`;
  document.getElementById("hint-text").style.display="none";
  document.getElementById("hint-text").textContent=q.hint;
  document.getElementById("hint-btn").style.display="inline";
  document.getElementById("feedback").className="feedback";
  document.getElementById("feedback").textContent="";
  document.getElementById("next-btn").style.display="none";
  answered=false;
  const opts=document.getElementById("q-options");
  opts.innerHTML="";
  q.opts.forEach((opt,i) => {
    const btn=document.createElement("button");
    btn.className="option-btn"; btn.textContent=opt; btn.onclick=()=>select(i);
    opts.appendChild(btn);
  });
}
function showHint() {
  const ht=document.getElementById("hint-text");
  ht.style.display=ht.style.display==="none"?"block":"none";
}
function select(i) {
  if (answered) return;
  answered=true;
  const q=sets[currentSet].questions[current];
  const btns=document.querySelectorAll(".option-btn");
  btns.forEach(b=>b.disabled=true);
  document.getElementById("hint-btn").style.display="none";
  document.getElementById("hint-text").style.display="none";
  const fb=document.getElementById("feedback");
  if (i===q.ans) { score++; btns[i].classList.add("correct"); fb.className="feedback correct"; fb.textContent="✓ 正解！　"+q.exp; }
  else { btns[i].classList.add("wrong"); btns[q.ans].classList.add("reveal"); fb.className="feedback wrong"; fb.textContent="✗ 不正解。　"+q.exp; }
  const nb=document.getElementById("next-btn");
  nb.style.display="block";
  nb.textContent=current+1<sets[currentSet].questions.length?"次の問題 →":"結果を見る";
}
function nextQuestion() { current++; if (current<sets[currentSet].questions.length) render(); else showResult(); }
function showResult() {
  document.getElementById("quiz-area").style.display="none";
  const rc=document.getElementById("result-card"); rc.style.display="block";
  const total=sets[currentSet].questions.length, pct=Math.round(score/total*100);
  document.getElementById("result-title").textContent=sets[currentSet].label+"　終了";
  document.getElementById("score-display").textContent=`${score} / ${total}`;
  let msg=pct>=90?"素晴らしい！ほぼ完璧です。":pct>=70?"よくできました。間違えた表現を復習しましょう。":pct>=50?"もう少しです。リストを見直してから再挑戦しましょう。":"動詞コロケーションリストをもう一度確認してから再挑戦しましょう。";
  document.getElementById("score-msg").textContent=`正答率 ${pct}%　${msg}`;
  const nb=document.getElementById("next-set-btn");
  if (currentSet<sets.length-1) { nb.style.display="inline-block"; nb.textContent=sets[currentSet+1].label+"へ →"; }
  else nb.style.display="none";
}
function restart() { current=0; score=0; document.getElementById("result-card").style.display="none"; document.getElementById("quiz-area").style.display="block"; render(); }
function goNextSet() { selectSet(currentSet+1); }
initSetNav();
render();
</script>
