<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教養語彙テスト B1レベル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 5px 11px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 12px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 6px; }
  .pos-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-bottom: 10px; }
  .pos-N   { background: #e8f0fe; color: #1a56b0; }
  .pos-V   { background: #fef3e8; color: #b05a1a; }
  .pos-Adj { background: #fde8e8; color: #b01a1a; }
  .pos-Adv { background: #e8feee; color: #1a7a3c; }
  .question-text { font-size: 18px; font-weight: 500; margin-bottom: 1.25rem; line-height: 1.6; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 16px; font-family: "Segoe UI", "Candara", sans-serif; font-weight: 500; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; display: none; font-family: "Segoe UI", "Candara", sans-serif; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>教養語彙テスト　B1レベル</h1>
    <p>日本語の意味に対応するドイツ語を選びなさい。領域ごとにテストが分かれています。</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index_b1.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← 戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="pos-tag" id="pos-tag"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQ()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="res-title"></h2>
    <div class="score-big" id="res-score"></div>
    <div class="score-msg" id="res-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">もう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNext()">次のテスト →</button>
    </div>
  </div>
</div>
<script>
const sets = [
  { label:"①論理・思考", questions:[
    { q:"「証拠・証明」を意味するドイツ語はどれか。", pos:"N", opts:["der Wandel", "das Verhältnis", "der Beweis", "die Konsequenz"], ans:2, hint:"einen Beweis liefern（証拠を示す）の形が典型的。", exp:"証拠・証明＝der Beweis。einen Beweis liefern（証拠を示す）の形が典型的。" },
    { q:"「立場・見地」を意味するドイツ語はどれか。", pos:"N", opts:["der Kompromiss", "der Standpunkt", "der Einfluss", "der Schluss"], ans:1, hint:"von meinem Standpunkt aus（私の立場からは）の形でよく使う。", exp:"立場・見地＝der Standpunkt。von meinem Standpunkt aus（私の立場からは）の形でよく使う。" },
    { q:"「見解」を意味するドイツ語はどれか。", pos:"N", opts:["die Folge", "das Verhältnis", "der Grund", "die Ansicht"], ans:3, hint:"meiner Ansicht nach は Meinung よりフォーマル。", exp:"見解＝die Ansicht。meiner Ansicht nach は Meinung よりフォーマル。" },
    { q:"「仮定・前提」を意味するドイツ語はどれか。", pos:"N", opts:["die Annahme", "die Aussage", "das Ausmaß", "der Konflikt"], ans:0, hint:"von der Annahme ausgehen（〜という前提から出発する）の形でよく使う。", exp:"仮定・前提＝die Annahme。von der Annahme ausgehen（〜という前提から出発する）の形でよく使う。" },
    { q:"「論理的な」を意味するドイツ語はどれか。", pos:"Adj", opts:["dringend", "öffentlich", "wesentlich", "logisch"], ans:3, hint:"Das ist nicht logisch.（それは論理的でない）の形が典型的。", exp:"論理的な＝logisch。Das ist nicht logisch.（それは論理的でない）の形が典型的。" },
    { q:"「〜と思う・考える」を意味するドイツ語はどれか。", pos:"V", opts:["erreichen", "darstellen", "meinen", "beurteilen"], ans:2, hint:"Was meinen Sie dazu?（それについてどう思いますか）の形が典型的。", exp:"〜と思う・考える＝meinen。Was meinen Sie dazu?（それについてどう思いますか）の形が典型的。" },
    { q:"「認識する・気づく」を意味するドイツ語はどれか。", pos:"V", opts:["erkennen", "steigern", "zunehmen", "vergleichen"], ans:0, hint:"ein Problem erkennen（問題に気づく）の形が典型的。", exp:"認識する・気づく＝erkennen。ein Problem erkennen（問題に気づく）の形が典型的。" },
    { q:"「結論」を意味するドイツ語はどれか。", pos:"N", opts:["die Entwicklung", "der Schluss", "das Ausmaß", "der Konflikt"], ans:1, hint:"zu dem Schluss kommen（〜という結論に至る）の形が最頻出。", exp:"結論＝der Schluss。zu dem Schluss kommen（〜という結論に至る）の形が最頻出。" },
    { q:"「原因」を意味するドイツ語はどれか。", pos:"N", opts:["die Erklärung", "die Ursache", "die Beziehung", "die Möglichkeit"], ans:1, hint:"die Ursache des Problems（問題の原因）の形が典型的。", exp:"原因＝die Ursache。die Ursache des Problems（問題の原因）の形が典型的。" },
    { q:"「結果・影響」を意味するドイツ語はどれか。", pos:"N", opts:["der Rückgang", "der Mangel", "die Qualität", "die Folge"], ans:3, hint:"als Folge davon（その結果として）の形もよく使う。", exp:"結果・影響＝die Folge。als Folge davon（その結果として）の形もよく使う。" },
    { q:"「考える・検討する」を意味するドイツ語はどれか。", pos:"V", opts:["feststellen", "darstellen", "überlegen", "überzeugen"], ans:2, hint:"sich etw. überlegen（〜をよく考える）の再帰形が最頻出。", exp:"考える・検討する＝überlegen。sich etw. überlegen（〜をよく考える）の再帰形が最頻出。" },
    { q:"「しかしながら・ただし」を意味するドイツ語はどれか。", pos:"Adv", opts:["allerdings", "kaum", "im Vergleich zu", "auf der anderen Seite"], ans:0, hint:"前文の内容を認めつつも留保を加える副詞。文頭に置くことが多い。", exp:"しかしながら・ただし＝allerdings。前文の内容を認めつつも留保を加える副詞。文頭に置くことが多い。" },
    { q:"「意見」を意味するドイツ語はどれか。", pos:"N", opts:["der Hinweis", "die Meinung", "die Herausforderung", "der Einfluss"], ans:1, hint:"meiner Meinung nach（私の意見では）の形が最頻出。", exp:"意見＝die Meinung。meiner Meinung nach（私の意見では）の形が最頻出。" },
    { q:"「根拠を示す」を意味するドイツ語はどれか。", pos:"V", opts:["bewerten", "überzeugen", "begründen", "abnehmen"], ans:2, hint:"eine Entscheidung begründen（決定の根拠を示す）の形が典型的。", exp:"根拠を示す＝begründen。eine Entscheidung begründen（決定の根拠を示す）の形が典型的。" },
    { q:"「理由・根拠」を意味するドイツ語はどれか。", pos:"N", opts:["der Grund", "die Folge", "der Nachteil", "die Lösung"], ans:0, hint:"Grund と Ursache はどちらも「理由・原因」だが、Grund は主観的な理由に使うことが多い。", exp:"理由・根拠＝der Grund。Grund と Ursache はどちらも「理由・原因」だが、Grund は主観的な理由に使うことが多い。" },
    { q:"「関連・文脈」を意味するドイツ語はどれか。", pos:"N", opts:["der Hinweis", "die Verantwortung", "die Minderheit", "der Zusammenhang"], ans:3, hint:"in welchem Zusammenhang（どういう文脈で）の形が頻出。", exp:"関連・文脈＝der Zusammenhang。in welchem Zusammenhang（どういう文脈で）の形が頻出。" }
  ]},
  { label:"②変化・推移", questions:[
    { q:"「改善する」を意味するドイツ語はどれか。", pos:"V", opts:["bewerten", "betonen", "meinen", "verbessern"], ans:3, hint:"die Situation verbessern（状況を改善する）の形が典型的。", exp:"改善する＝verbessern。die Situation verbessern（状況を改善する）の形が典型的。" },
    { q:"「増加する」を意味するドイツ語はどれか。", pos:"V", opts:["reduzieren", "zunehmen", "beibehalten", "verhindern"], ans:1, hint:"Die Zahl nimmt zu.（数が増加する）の形が典型的。", exp:"増加する＝zunehmen。Die Zahl nimmt zu.（数が増加する）の形が典型的。" },
    { q:"「進歩・進展」を意味するドイツ語はどれか。", pos:"N", opts:["der Fortschritt", "das Verhältnis", "der Grund", "der Mangel"], ans:0, hint:"Fortschritte machen（進歩する）の形が最頻出。", exp:"進歩・進展＝der Fortschritt。Fortschritte machen（進歩する）の形が最頻出。" },
    { q:"「変容・変革（構造的）」を意味するドイツ語はどれか。", pos:"N", opts:["der Aspekt", "die Bedeutung", "der Wandel", "die Konsequenz"], ans:2, hint:"sozialer Wandel のように長期的・構造的な変化に使う。", exp:"変容・変革（構造的）＝der Wandel。sozialer Wandel のように長期的・構造的な変化に使う。" },
    { q:"「発展・展開」を意味するドイツ語はどれか。", pos:"N", opts:["die Maßnahme", "das Gespräch", "die Information", "die Entwicklung"], ans:3, hint:"eine positive Entwicklung（前向きな発展）の形が典型的。", exp:"発展・展開＝die Entwicklung。eine positive Entwicklung（前向きな発展）の形が典型的。" },
    { q:"「増加」を意味するドイツ語はどれか。", pos:"N", opts:["der Konflikt", "die Zunahme", "der Beweis", "der Unterschied"], ans:1, hint:"eine starke Zunahme（大幅な増加）の形が典型的。", exp:"増加＝die Zunahme。eine starke Zunahme（大幅な増加）の形が典型的。" },
    { q:"「維持する・保つ」を意味するドイツ語はどれか。", pos:"V", opts:["verhindern", "verbessern", "beibehalten", "zunehmen"], ans:2, hint:"einen Kurs beibehalten（方針を維持する）の形が典型的。", exp:"維持する・保つ＝beibehalten。einen Kurs beibehalten（方針を維持する）の形が典型的。" },
    { q:"「悪化する」を意味するドイツ語はどれか。", pos:"V", opts:["verschlechtern", "überlegen", "zusammenarbeiten", "abnehmen"], ans:0, hint:"sich verschlechtern（悪化する）の再帰形が最頻出。", exp:"悪化する＝verschlechtern。sich verschlechtern（悪化する）の再帰形が最頻出。" },
    { q:"「減少する」を意味するドイツ語はどれか。", pos:"V", opts:["abnehmen", "feststellen", "zusammenarbeiten", "nachweisen"], ans:0, hint:"Die Nachfrage nimmt ab.（需要が減少する）の形が典型的。", exp:"減少する＝abnehmen。Die Nachfrage nimmt ab.（需要が減少する）の形が典型的。" },
    { q:"「変化・変容」を意味するドイツ語はどれか。", pos:"N", opts:["das Ergebnis", "der Wert", "die Veränderung", "die Gleichheit"], ans:2, hint:"eine grundlegende Veränderung（根本的な変化）の形が典型的。", exp:"変化・変容＝die Veränderung。eine grundlegende Veränderung（根本的な変化）の形が典型的。" },
    { q:"「減少・後退」を意味するドイツ語はどれか。", pos:"N", opts:["der Grund", "die Voraussetzung", "die Herausforderung", "der Rückgang"], ans:3, hint:"ein deutlicher Rückgang（顕著な減少）の形が典型的。", exp:"減少・後退＝der Rückgang。ein deutlicher Rückgang（顕著な減少）の形が典型的。" },
    { q:"「徐々に」を意味するドイツ語はどれか。", pos:"Adv", opts:["zunehmend", "allmählich", "durchaus", "im Großen und Ganzen"], ans:1, hint:"allmählich besser werden（徐々によくなる）の形が典型的。", exp:"徐々に＝allmählich。allmählich besser werden（徐々によくなる）の形が典型的。" }
  ]},
  { label:"③評価・判断", questions:[
    { q:"「重要な・著しい」を意味するドイツ語はどれか。", pos:"Adj", opts:["logisch", "erheblich", "deutlich", "bedeutend"], ans:3, hint:"eine bedeutende Rolle spielen（重要な役割を果たす）の形が典型的。", exp:"重要な・著しい＝bedeutend。eine bedeutende Rolle spielen（重要な役割を果たす）の形が典型的。" },
    { q:"「比較」を意味するドイツ語はどれか。", pos:"N", opts:["der Vorteil", "der Vergleich", "die Minderheit", "die Beziehung"], ans:1, hint:"im Vergleich zu（〜と比較して）の形で最頻出。", exp:"比較＝der Vergleich。im Vergleich zu（〜と比較して）の形で最頻出。" },
    { q:"「評価する」を意味するドイツ語はどれか。", pos:"V", opts:["steigern", "nachweisen", "bewerten", "berücksichtigen"], ans:2, hint:"etw. positiv bewerten（〜を肯定的に評価する）の形が典型的。", exp:"評価する＝bewerten。etw. positiv bewerten（〜を肯定的に評価する）の形が典型的。" },
    { q:"「価値・価値観」を意味するドイツ語はどれか。", pos:"N", opts:["der Wert", "der Zusammenhang", "die Schwierigkeit", "die Gesellschaft"], ans:0, hint:"einen hohen Wert legen auf（〜を重視する）の形が典型的。", exp:"価値・価値観＝der Wert。einen hohen Wert legen auf（〜を重視する）の形が典型的。" },
    { q:"「批判・批評」を意味するドイツ語はどれか。", pos:"N", opts:["die Toleranz", "die Herausforderung", "die Gleichheit", "die Kritik"], ans:3, hint:"Kritik üben an（〜を批判する）の形が典型的。", exp:"批判・批評＝die Kritik。Kritik üben an（〜を批判する）の形が典型的。" },
    { q:"「欠点・短所」を意味するドイツ語はどれか。", pos:"N", opts:["der Nachteil", "die Gesellschaft", "die Ursache", "die Verantwortung"], ans:0, hint:"Nachteile in Kauf nehmen（欠点をやむなく受け入れる）の形も重要。", exp:"欠点・短所＝der Nachteil。Nachteile in Kauf nehmen（欠点をやむなく受け入れる）の形も重要。" },
    { q:"「強調する」を意味するドイツ語はどれか。", pos:"V", opts:["steigern", "verschlechtern", "betonen", "erreichen"], ans:2, hint:"die Wichtigkeit betonen（重要性を強調する）の形が典型的。", exp:"強調する＝betonen。die Wichtigkeit betonen（重要性を強調する）の形が典型的。" },
    { q:"「比較する」を意味するドイツ語はどれか。", pos:"V", opts:["feststellen", "vergleichen", "nachweisen", "verhindern"], ans:1, hint:"A mit B vergleichen（AとBを比較する）の形が典型的。", exp:"比較する＝vergleichen。A mit B vergleichen（AとBを比較する）の形が典型的。" },
    { q:"「意味・重要性」を意味するドイツ語はどれか。", pos:"N", opts:["die Information", "die Lösung", "die Bedeutung", "die Verantwortung"], ans:2, hint:"von großer Bedeutung sein（大きな意味を持つ）の形が典型的。", exp:"意味・重要性＝die Bedeutung。von großer Bedeutung sein（大きな意味を持つ）の形が典型的。" },
    { q:"「品質・質」を意味するドイツ語はどれか。", pos:"N", opts:["die Qualität", "die Bedeutung", "die Kritik", "die Ursache"], ans:0, hint:"auf Qualität achten（品質に気をつける）の形が典型的。", exp:"品質・質＝die Qualität。auf Qualität achten（品質に気をつける）の形が典型的。" },
    { q:"「側面・観点」を意味するドイツ語はどれか。", pos:"N", opts:["der Nachteil", "der Aspekt", "das Problem", "der Standpunkt"], ans:1, hint:"alle Aspekte berücksichtigen（すべての側面を考慮する）の形が典型的。", exp:"側面・観点＝der Aspekt。alle Aspekte berücksichtigen（すべての側面を考慮する）の形が典型的。" },

    { q:"「変容・変革（構造的）」を意味するドイツ語はどれか。", pos:"N", opts:["die Gemeinschaft", "der Wandel", "die Minderheit", "die Verantwortung"], ans:1, hint:"sozialer Wandel のように長期的・構造的な変化に使う。", exp:"変容・変革（構造的）＝der Wandel。sozialer Wandel のように長期的・構造的な変化に使う。" },
    { q:"「そのため・したがって」を意味するドイツ語はどれか。", pos:"Adv", opts:["daher", "im Hinblick auf", "insgesamt", "in der Regel"], ans:0, hint:"Daher ist eine Lösung notwendig. の形が典型的。", exp:"そのため・したがって＝daher。Daher ist eine Lösung notwendig. の形が典型的。" },
    { q:"「公の・公開の」を意味するドイツ語はどれか。", pos:"Adj", opts:["entsprechend", "wesentlich", "bedeutend", "öffentlich"], ans:3, hint:"öffentliches Interesse（公の利益）の形が典型的。", exp:"公の・公開の＝öffentlich。öffentliches Interesse（公の利益）の形が典型的。" },

    { q:"「しかしながら・ただし」を意味するドイツ語はどれか。", pos:"Adv", opts:["allerdings", "in erster Linie", "zumindest", "zum Teil"], ans:0, hint:"前文の内容を認めつつも留保を加える副詞。文頭に置くことが多い。", exp:"しかしながら・ただし＝allerdings。前文の内容を認めつつも留保を加える副詞。文頭に置くことが多い。" },

    { q:"「報告・レポート」を意味するドイツ語はどれか。", pos:"N", opts:["der Bericht", "das Ergebnis", "der Grund", "die Folge"], ans:0, hint:"einen Bericht erstellen（報告書を作成する）の形が典型的。", exp:"報告・レポート＝der Bericht。einen Bericht erstellen（報告書を作成する）の形が典型的。" },

    { q:"「品質・質」を意味するドイツ語はどれか。", pos:"N", opts:["die Erklärung", "der Aspekt", "die Konsequenz", "die Qualität"], ans:3, hint:"auf Qualität achten（品質に気をつける）の形が典型的。", exp:"品質・質＝die Qualität。auf Qualität achten（品質に気をつける）の形が典型的。" }
];
const RANDOM_COUNT = 20;
const posLabel = { N:"名詞", V:"動詞", Adj:"形容詞", Adv:"副詞" };

function shuffle(arr) {
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildRandomSet() {
  return shuffle(allQuestions).slice(0, RANDOM_COUNT);
}

let currentQuestions=[], cur=0, score=0, answered=false, curSetIdx=0;
const NAV_SETS = sets.map(s=>s.label).concat(["ランダム"]);

function initNav() {
  const nav=document.getElementById('set-nav');
  NAV_SETS.forEach((label,i)=>{
    const b=document.createElement('button');
    const isR=label==="ランダム";
    b.className='set-btn'+(isR?' random-btn':'')+(i===0?' active':'');
    b.textContent=label;
    b.onclick=()=>selectSet(i);
    nav.appendChild(b);
  });
}

function selectSet(i) {
  curSetIdx=i; cur=0; score=0; answered=false;
  document.querySelectorAll('.set-btn').forEach((b,j)=>{
    const isR=NAV_SETS[j]==="ランダム";
    b.className='set-btn'+(isR?' random-btn':'')+(j===i?' active':'');
  });
  currentQuestions=NAV_SETS[i]==="ランダム"?buildRandomSet():sets[i].questions;
  document.getElementById('result-card').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  render();
}

function render() {
  const q=currentQuestions[cur];
  document.getElementById('prog-bar').style.width=((cur+1)/currentQuestions.length*100)+'%';
  document.getElementById('prog-text').textContent='問'+(cur+1)+' / '+currentQuestions.length;
  document.getElementById('q-num').textContent='問'+(cur+1);
  const tag=document.getElementById('pos-tag');
  tag.textContent='【'+posLabel[q.pos]+'】';
  tag.className='pos-tag pos-'+q.pos;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('hint-text').textContent=q.hint;
  document.getElementById('hint-text').style.display='none';
  document.getElementById('hint-btn').style.display='inline';
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  document.getElementById('next-btn').style.display='none';
  answered=false;
  const opts=document.getElementById('q-options');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='option-btn'; b.textContent=o; b.onclick=()=>select(i);
    opts.appendChild(b);
  });
}

function showHint(){
  const h=document.getElementById('hint-text');
  h.style.display=h.style.display==='none'?'block':'none';
}

function select(i){
  if(answered)return;
  answered=true;
  const q=currentQuestions[cur];
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach(b=>b.disabled=true);
  document.getElementById('hint-btn').style.display='none';
  document.getElementById('hint-text').style.display='none';
  const fb=document.getElementById('feedback');
  if(i===q.ans){
    score++;
    btns[i].classList.add('correct');
    fb.className='feedback correct';
    fb.textContent='✓ 正解！　'+q.exp;
  }else{
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className='feedback wrong';
    fb.textContent='✗ 不正解。　'+q.exp;
  }
  const nb=document.getElementById('next-btn');
  nb.style.display='block';
  nb.textContent=cur+1<currentQuestions.length?'次の問題 →':'結果を見る';
}

function nextQ(){cur++;if(cur<currentQuestions.length)render();else showResult();}

function showResult(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('result-card').style.display='block';
  const total=currentQuestions.length,pct=Math.round(score/total*100);
  document.getElementById('res-title').textContent=NAV_SETS[curSetIdx]+'　終了';
  document.getElementById('res-score').textContent=score+' / '+total;
  const msgs=['語彙リストをもう一度確認してから再挑戦しましょう。','もう少しです。リストを見直してから再挑戦しましょう。','よくできました。間違えた語を復習しましょう。','素晴らしい！ほぼ完璧です。'];
  document.getElementById('res-msg').textContent='正答率 '+pct+'%　'+msgs[pct>=90?3:pct>=70?2:pct>=50?1:0];
  const nb=document.getElementById('next-set-btn');
  const nx=curSetIdx+1;
  if(nx<NAV_SETS.length){nb.style.display='inline-block';nb.textContent=NAV_SETS[nx]+' →';}
  else nb.style.display='none';
}

function restart(){
  cur=0;score=0;
  if(NAV_SETS[curSetIdx]==="ランダム")currentQuestions=buildRandomSet();
  document.getElementById('result-card').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  render();
}

function goNext(){selectSet(curSetIdx+1);}

currentQuestions=sets[0].questions;
initNav();
render();
</script>
