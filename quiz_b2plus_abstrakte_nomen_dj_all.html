<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象名詞テスト B2+レベル（独→日）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 6px; }
  .question-text { font-size: 22px; font-weight: 500; margin-bottom: 6px; font-family: "Segoe UI", "Candara", sans-serif; }
  .question-sub { font-size: 13px; color: #888; margin-bottom: 1.25rem; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: inherit; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; font-family: "Segoe UI", "Candara", sans-serif; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>抽象名詞テスト　B2+レベル（独→日）</h1>
    <p>ドイツ語名詞の日本語の意味を選びなさい。（各テスト20問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index_b2plus.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← ポータルに戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:5%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="question-sub" id="q-sub"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このテストをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のテストへ →</button>
    </div>
  </div>
</div>
<script>
// DJ: A=①1-5+③6-10+⑤6-10+⑦6-10  B=②1-5+④6-10+⑥6-10+⑧6-10
//     C=①6-10+②6-10+⑤1-5+⑦1-5   D=③1-5+④1-5+⑥1-5+⑧1-5
const sets = [
  { label:"テストA", questions:[
    // ①哲学1-5
    { q:"die Substanz", sub:"(-，-en)", opts:["存在論", "実質・本質・内容", "本質・核心", "超越性・超越"], ans:1, hint:"einem Argument Substanz verleihen（論拠に実質を与える）の形でよく使う。", exp:"die Substanz＝実質・本質・内容。einem Argument Substanz verleihen（論拠に実質を与える）。" },
    { q:"das Wesen", sub:"(-s，-)", opts:["本質・存在・性質", "抽象化・抽象概念", "偶然性・不確定性", "内在性"], ans:0, hint:"das Wesen einer Sache erfassen（物事の本質を把握する）の形でよく使う。", exp:"das Wesen＝本質・存在・性質。das Wesen einer Sache erfassen（物事の本質を把握する）。" },
    { q:"die Essenz", sub:"(-，-en)", opts:["存在論", "超越性・超越", "本質・核心", "弁証法・対話的思考"], ans:2, hint:"die Essenz einer Debatte herausarbeiten（議論の本質を抽出する）の形でよく使う。", exp:"die Essenz＝本質・エッセンス。die Essenz einer Debatte herausarbeiten（議論の本質を抽出する）。" },
    { q:"die Ontologie", sub:"(-，-n)", opts:["弁証法・対話的思考", "内在性", "逆説・矛盾命題", "存在論"], ans:3, hint:"ontologische Grundfragen aufwerfen（存在論の根本問題を提起する）の形でよく使う。", exp:"die Ontologie＝存在論。ontologische Grundfragen aufwerfen（存在論の根本問題を提起する）。" },
    { q:"die Transzendenz", sub:"(-，-)", opts:["内在性", "偶然性・不確定性", "超越性・超越", "本質・核心"], ans:2, hint:"nach Transzendenz suchen（超越性を求める）の形でよく使う。", exp:"die Transzendenz＝超越性・超越。nach Transzendenz suchen（超越性を求める）。" },
    // ③政治6-10
    { q:"die Repression", sub:"(-，-en)", opts:["抑圧・弾圧", "補助金・助成", "予防・防止", "制裁・承認（文脈による）"], ans:0, hint:"staatliche Repression dokumentieren（国家による弾圧を記録する）の形でよく使う。", exp:"die Repression＝抑圧・弾圧。staatliche Repression dokumentieren（国家による弾圧を記録する）。" },
    { q:"die Sanktion", sub:"(-，-en)", opts:["予防・防止", "管轄権・法的権限", "補助金・助成", "制裁・承認（文脈による）"], ans:3, hint:"wirtschaftliche Sanktionen verhängen（経済制裁を科す）の形でよく使う。", exp:"die Sanktion＝制裁・承認（文脈による）。wirtschaftliche Sanktionen verhängen（経済制裁を科す）。" },
    { q:"die Jurisdiktion", sub:"(-，-en)", opts:["制裁・承認（文脈による）", "管轄権・法的権限", "補助金・助成", "予防・防止"], ans:1, hint:"außerhalb der nationalen Jurisdiktion handeln（国家の管轄権の外で行動する）の形でよく使う。", exp:"die Jurisdiktion＝管轄権・法的権限。außerhalb der nationalen Jurisdiktion handeln（国家の管轄権の外で行動する）。" },
    { q:"die Prävention", sub:"(-，-en)", opts:["制裁・承認（文脈による）", "予防・防止", "補助金・助成", "管轄権・法的権限"], ans:1, hint:"Prävention statt Repression betreiben（抑圧の代わりに予防を行う）の形でよく使う。", exp:"die Prävention＝予防・防止。Prävention statt Repression betreiben（抑圧の代わりに予防を行う）。" },
    { q:"die Subvention", sub:"(-，-en)", opts:["予防・防止", "制裁・承認（文脈による）", "管轄権・法的権限", "補助金・助成"], ans:3, hint:"staatliche Subventionen abbauen（国家補助金を削減する）の形でよく使う。", exp:"die Subvention＝補助金・助成。staatliche Subventionen abbauen（国家補助金を削減する）。" },
    // ⑤文化6-10
    { q:"die Assimilation", sub:"(-，-en)", opts:["同化・吸収", "文化変容・適応", "代表・表象・表現", "周縁化・排除"], ans:0, hint:"zwischen Integration und Assimilation unterscheiden（統合と同化を区別する）の形でよく使う。", exp:"die Assimilation＝同化・吸収。zwischen Integration und Assimilation unterscheiden（統合と同化を区別する）。" },
    { q:"die Akkulturation", sub:"(-，-en)", opts:["周縁化・排除", "固定観念化・類型化", "文化変容・適応", "代表・表象・表現"], ans:2, hint:"Akkulturationsprozesse wissenschaftlich untersuchen（文化変容過程を学術的に研究する）の形でよく使う。", exp:"die Akkulturation＝文化変容・適応。Akkulturationsprozesse wissenschaftlich untersuchen（文化変容過程を学術的に研究する）。" },
    { q:"die Repräsentation", sub:"(-，-en)", opts:["固定観念化・類型化", "代表・表象・表現", "周縁化・排除", "同化・吸収"], ans:1, hint:"die mediale Repräsentation von Minderheiten（少数派のメディア表象）の形でよく使う。", exp:"die Repräsentation＝代表・表象・表現。die mediale Repräsentation von Minderheiten（少数派のメディア表象）。" },
    { q:"die Marginalisierung", sub:"(-，-en)", opts:["代表・表象・表現", "文化変容・適応", "同化・吸収", "周縁化・排除"], ans:3, hint:"die Marginalisierung bestimmter Gruppen überwinden（特定集団の周縁化を克服する）の形でよく使う。", exp:"die Marginalisierung＝周縁化・排除。die Marginalisierung bestimmter Gruppen überwinden（特定集団の周縁化を克服する）。" },
    { q:"die Stereotypisierung", sub:"(-，-en)", opts:["文化変容・適応", "代表・表象・表現", "固定観念化・類型化", "同化・吸収"], ans:2, hint:"Stereotypisierungen in der Berichterstattung kritisieren（報道におけるステレオタイプ化を批判する）の形でよく使う。", exp:"die Stereotypisierung＝固定観念化・ステレオタイプ化。Stereotypisierungen in der Berichterstattung kritisieren（報道におけるステレオタイプ化を批判する）。" },
    // ⑦変化6-10
    { q:"die Akkumulation", sub:"(-，-en)", opts:["蓄積・集積", "断片化・細分化", "均質化・同質化", "異質性・多様性（構成上の）"], ans:0, hint:"eine Akkumulation von Kapital und Wissen（資本と知識の蓄積）の形でよく使う。", exp:"die Akkumulation＝蓄積・集積。eine Akkumulation von Kapital und Wissen（資本と知識の蓄積）。" },
    { q:"die Fragmentierung", sub:"(-，-en)", opts:["均質化・同質化", "不安定化・揺さぶり", "断片化・細分化", "異質性・多様性（構成上の）"], ans:2, hint:"die Fragmentierung des Mediensystems（メディアシステムの断片化）の形でよく使う。", exp:"die Fragmentierung＝断片化・細分化。die Fragmentierung des Mediensystems（メディアシステムの断片化）。" },
    { q:"die Homogenisierung", sub:"(-，-en)", opts:["異質性・多様性（構成上の）", "均質化・同質化", "不安定化・揺さぶり", "断片化・細分化"], ans:1, hint:"eine globale Homogenisierung der Kultur（文化のグローバルな均質化）の形でよく使う。", exp:"die Homogenisierung＝均質化。eine globale Homogenisierung der Kultur（文化のグローバルな均質化）。" },
    { q:"die Heterogenität", sub:"(-，-en)", opts:["均質化・同質化", "蓄積・集積", "不安定化・揺さぶり", "異質性・多様性（構成上の）"], ans:3, hint:"die Heterogenität einer Gesellschaft als Stärke sehen（社会の異質性を強みとして見る）の形でよく使う。", exp:"die Heterogenität＝異質性・多様性（構成上の）。die Heterogenität einer Gesellschaft als Stärke sehen（社会の異質性を強みとして見る）。" },
    { q:"die Destabilisierung", sub:"(-，-en)", opts:["不安定化・揺さぶり", "蓄積・集積", "均質化・同質化", "断片化・細分化"], ans:0, hint:"eine gezielte Destabilisierung demokratischer Strukturen（民主的構造の意図的な不安定化）の形でよく使う。", exp:"die Destabilisierung＝不安定化・揺さぶり。eine gezielte Destabilisierung demokratischer Strukturen（民主的構造の意図的な不安定化）。" },
  ]},
  { label:"テストB", questions:[
    // ②認識1-5
    { q:"die Wahrheit", sub:"(-，-en)", opts:["真実・真理", "知覚・認知・受け止め方", "解釈・解読", "脱構築"], ans:0, hint:"nach Wahrheit streben（真理を追い求める）の形でよく使う。", exp:"die Wahrheit＝真実・真理。nach Wahrheit streben（真理を追い求める）。" },
    { q:"die Wahrnehmung", sub:"(-，-en)", opts:["解釈・解読", "知覚・認知・受け止め方", "相対性", "真実・真理"], ans:1, hint:"die öffentliche Wahrnehmung beeinflussen（世論の認知に影響する）の形でよく使う。", exp:"die Wahrnehmung＝知覚・認知・受け止め方。die öffentliche Wahrnehmung beeinflussen（世論の認知に影響する）。" },
    { q:"die Interpretation", sub:"(-，-en)", opts:["脱構築", "相対性", "解釈・解読", "知覚・認知・受け止め方"], ans:2, hint:"eine Interpretation in Frage stellen（解釈を問い直す）の形でよく使う。", exp:"die Interpretation＝解釈・解読。eine Interpretation in Frage stellen（解釈を問い直す）。" },
    { q:"die Dekonstruktion", sub:"(-，-en)", opts:["解釈・解読", "相対性", "真実・真理", "脱構築"], ans:3, hint:"eine Dekonstruktion überlieferter Begriffe vornehmen（伝承された概念の脱構築を行う）の形でよく使う。", exp:"die Dekonstruktion＝脱構築。eine Dekonstruktion überlieferter Begriffe vornehmen（伝承された概念の脱構築を行う）。" },
    { q:"die Relativität", sub:"(-，-en)", opts:["知覚・認知・受け止め方", "解釈・解読", "脱構築", "相対性"], ans:3, hint:"die Relativität moralischer Urteile diskutieren（道徳的判断の相対性を議論する）の形でよく使う。", exp:"die Relativität＝相対性。die Relativität moralischer Urteile diskutieren（道徳的判断の相対性を議論する）。" },
    // ④経済6-10
    { q:"die Rentabilität", sub:"(-，-)", opts:["収益性・採算性", "流動性・資金繰り", "変動性・不安定性", "多様化・分散"], ans:0, hint:"die Rentabilität einer Investition prüfen（投資の収益性を検討する）の形でよく使う。", exp:"die Rentabilität＝収益性・採算性。die Rentabilität einer Investition prüfen（投資の収益性を検討する）。" },
    { q:"die Liquidität", sub:"(-，-)", opts:["収益性・採算性", "流動性・資金繰り", "統合・強化・安定化", "変動性・不安定性"], ans:1, hint:"die Liquidität eines Unternehmens sichern（企業の流動性を確保する）の形でよく使う。", exp:"die Liquidität＝流動性・資金繰り。die Liquidität eines Unternehmens sichern（企業の流動性を確保する）。" },
    { q:"die Volatilität", sub:"(-，-)", opts:["多様化・分散", "統合・強化・安定化", "変動性・不安定性", "流動性・資金繰り"], ans:2, hint:"die Volatilität der Märkte einkalkulieren（市場の変動性を考慮に入れる）の形でよく使う。", exp:"die Volatilität＝変動性・不安定性。die Volatilität der Märkte einkalkulieren（市場の変動性を考慮に入れる）。" },
    { q:"die Diversifikation", sub:"(-，-en)", opts:["統合・強化・安定化", "収益性・採算性", "流動性・資金繰り", "多様化・分散"], ans:3, hint:"Risiken durch Diversifikation minimieren（多様化によってリスクを最小化する）の形でよく使う。", exp:"die Diversifikation＝多様化・分散。Risiken durch Diversifikation minimieren（多様化によってリスクを最小化する）。" },
    { q:"die Konsolidierung", sub:"(-，-en)", opts:["統合・強化・安定化", "変動性・不安定性", "収益性・採算性", "多様化・分散"], ans:0, hint:"eine Konsolidierung des Marktes beobachten（市場の統合を観察する）の形でよく使う。", exp:"die Konsolidierung＝統合・強化・安定化。eine Konsolidierung des Marktes beobachten（市場の統合を観察する）。" },
    // ⑥科学6-10
    { q:"die Falsifizierung", sub:"(-，-en)", opts:["再現可能性", "反証・反証可能性", "操作化・測定可能化", "帰納・帰納的推論"], ans:1, hint:"das Prinzip der Falsifizierung nach Popper（ポッパーによる反証原理）の形でよく使う。", exp:"die Falsifizierung＝反証・反証可能性。das Prinzip der Falsifizierung nach Popper（ポッパーによる反証原理）。" },
    { q:"die Replizierbarkeit", sub:"(-，-)", opts:["操作化・測定可能化", "帰納・帰納的推論", "再現可能性", "演繹・演繹的推論"], ans:2, hint:"die Replizierbarkeit von Experimenten fordern（実験の再現可能性を求める）の形でよく使う。", exp:"die Replizierbarkeit＝再現可能性。die Replizierbarkeit von Experimenten fordern（実験の再現可能性を求める）。" },
    { q:"die Operationalisierung", sub:"(-，-en)", opts:["帰納・帰納的推論", "操作化・測定可能化", "演繹・演繹的推論", "一般化"], ans:1, hint:"abstrakte Begriffe operationalisieren（抽象的概念を操作化する）の形でよく使う。", exp:"die Operationalisierung＝操作化・測定可能化。abstrakte Begriffe operationalisieren（抽象的概念を操作化する）。" },
    { q:"die Induktion", sub:"(-，-en)", opts:["演繹・演繹的推論", "反証・反証可能性", "再現可能性", "帰納・帰納的推論"], ans:3, hint:"Deduktion und Induktion gegenüberstellen（演繹と帰納を対比する）の形でよく使う。", exp:"die Induktion＝帰納・帰納的推論。Deduktion und Induktion gegenüberstellen（演繹と帰納を対比する）。" },

const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 20;
function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet; else sets.push(randomSet);
}
buildRandomSet();
let currentSet = 0, current = 0, score = 0, answered = false;
function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (s.label === RANDOM_LABEL ? ' random-btn' : '') + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}
function selectSet(idx) {
  if (sets[idx] && sets[idx].label === RANDOM_LABEL) buildRandomSet();
  currentSet = idx; current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (sets[i].label === RANDOM_LABEL ? ' random-btn' : '') + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}
function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  document.getElementById('q-num').textContent = `問${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-sub').textContent = q.sub;
  document.getElementById('prog-bar').style.width = `${((current+1)/qs.length)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${qs.length}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}
function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}
function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) { score++; btns[i].classList.add('correct'); fb.className = 'feedback correct'; fb.textContent = '✓ 正解！　' + q.exp; }
  else { btns[i].classList.add('wrong'); btns[q.ans].classList.add('reveal'); fb.className = 'feedback wrong'; fb.textContent = '✗ 不正解。　' + q.exp; }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}
function nextQuestion() { current++; if (current < sets[currentSet].questions.length) render(); else showResult(); }
function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = pct >= 90 ? '素晴らしい！ほぼ完璧です。' : pct >= 70 ? 'よくできました。間違えた語を復習しましょう。' : pct >= 50 ? 'もう少しです。リストを見直してから再挑戦しましょう。' : '語彙リストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) { nb.style.display = 'inline-block'; nb.textContent = sets[currentSet + 1].label + 'へ →'; }
  else nb.style.display = 'none';
}
function restart() { current = 0; score = 0; document.getElementById('result-card').style.display = 'none'; document.getElementById('quiz-area').style.display = 'block'; render(); }
function goNextSet() { selectSet(currentSet + 1); }
initSetNav();
render();
</script>
</body>
</html>
