<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象名詞テスト B1+レベル（独→日）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 6px; }
  .question-text { font-size: 22px; font-weight: 500; margin-bottom: 6px; letter-spacing: 0.01em; }
  .question-sub { font-size: 13px; color: #888; margin-bottom: 1.25rem; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: inherit; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>抽象名詞テスト　B1+レベル（独→日）</h1>
    <p>ドイツ語名詞の日本語の意味を選びなさい。（各セット20問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← ポータルに戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:5%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card" id="q-card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="question-sub" id="q-sub"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このセットをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のセットへ →</button>
    </div>
  </div>
</div>

<script>
// 形式: { q: "ドイツ語名詞", sub: "性・複数形", opts: ["日本語A","B","C","D"], ans: 正解index, hint: "ヒント", exp: "解説" }
const sets = [
  {
    label: "テストA",
    questions: [
      { q:"die Angst", sub:"(-，Ängste)", opts:["希望", "好奇心", "恐れ・不安", "満足感"], ans:2, hint:"Angst vor etw. haben の形でよく使う。", exp:"die Angst＝恐れ・不安。Angst vor etw. haben（〜を恐れている）。複数形 Ängste は変音する。" },
      { q:"die Hoffnung", sub:"(-，-en)", opts:["希望", "失望", "信頼", "悲しみ"], ans:0, hint:"hoffen（望む）の名詞形。", exp:"die Hoffnung＝希望。die Hoffnung aufgeben（希望を捨てる）。" },
      { q:"das Vertrauen", sub:"(-s，-)", opts:["不安", "信頼", "印象", "意識"], ans:1, hint:"vertrauen（信頼する）の名詞形。性は das。", exp:"das Vertrauen＝信頼。Vertrauen in jdn. haben（〜を信頼している）。" },
      { q:"die Einsamkeit", sub:"(-，-)", opts:["好奇心", "満足感", "悲しみ", "孤独感"], ans:3, hint:"einsam（孤独な）に -keit をつけた名詞。", exp:"die Einsamkeit＝孤独感。an Einsamkeit leiden（孤独に苦しむ）。" },
      { q:"die Meinung", sub:"(-，-en)", opts:["見解", "信念", "認識", "意見"], ans:3, hint:"meiner Meinung nach（私の意見では）の形が最頻出。", exp:"die Meinung＝意見。meiner Meinung nach（私の意見では）。" },
      { q:"die Erkenntnis", sub:"(-，-se)", opts:["疑念", "意識", "認識・気づき", "印象"], ans:2, hint:"erkennen（認識する）の名詞形。複数形に -se がつく。", exp:"die Erkenntnis＝認識・気づき。zu einer Erkenntnis kommen（認識に至る）。" },
      { q:"das Bewusstsein", sub:"(-s，-)", opts:["意識・自覚", "意図", "確信", "注意"], ans:0, hint:"bewusst（意識した）の名詞形。性は das。", exp:"das Bewusstsein＝意識・自覚。ein Bewusstsein für etw. entwickeln（〜への意識を育てる）。" },
      { q:"der Eindruck", sub:"(-s，Eindrücke)", opts:["影響", "印象", "注目", "差異"], ans:1, hint:"einen guten Eindruck machen（良い印象を与える）の形が典型的。", exp:"der Eindruck＝印象。einen guten Eindruck machen（良い印象を与える）。" },
      { q:"die Verantwortung", sub:"(-，-en)", opts:["協力", "尊重", "責任", "行動"], ans:2, hint:"Verantwortung übernehmen（責任を引き受ける）の形でよく使う。", exp:"die Verantwortung＝責任。Verantwortung übernehmen（責任を引き受ける）。" },
      { q:"die Zusammenarbeit", sub:"(-，-)", opts:["取り決め", "支援", "対立", "協力・協働"], ans:3, hint:"zusammen（一緒に）＋ Arbeit（仕事）からなる複合名詞。", exp:"die Zusammenarbeit＝協力・協働。eine enge Zusammenarbeit fördern（緊密な協力を促す）。" },
      { q:"der Konflikt", sub:"(-s，-e)", opts:["対立・葛藤", "尊重", "行動", "関係"], ans:0, hint:"英語 conflict と同語源。in Konflikt geraten mit の形も重要。", exp:"der Konflikt＝対立・葛藤。einen Konflikt lösen（対立を解消する）。" },
      { q:"der Respekt", sub:"(-s，-)", opts:["平等", "尊重・敬意", "行動", "責任"], ans:1, hint:"英語 respect と同語源。Respekt vor +D の形をとる。", exp:"der Respekt＝尊重・敬意。Respekt vor jdm. haben（〜を尊重している）。" },
      { q:"die Entwicklung", sub:"(-，-en)", opts:["変化", "発展・展開", "増加", "経過"], ans:1, hint:"sich entwickeln（発展する）の名詞形。", exp:"die Entwicklung＝発展・展開。eine positive Entwicklung beobachten（前向きな発展を観察する）。" },
      { q:"der Fortschritt", sub:"(-s，-e)", opts:["進歩・進展", "増加", "後退", "差異"], ans:0, hint:"fort（前へ）＋ Schritt（一歩）からなる複合名詞。", exp:"der Fortschritt＝進歩・進展。Fortschritte machen（進歩する）。" },
      { q:"der Einfluss", sub:"(-es，Einflüsse)", opts:["効果", "結果", "影響", "差異"], ans:2, hint:"auf +A の形をとる。einen großen Einfluss haben auf の形が典型的。", exp:"der Einfluss＝影響。einen großen Einfluss haben auf（〜に大きな影響を持つ）。" },
      { q:"der Unterschied", sub:"(-s，-e)", opts:["変化", "後退", "影響", "差異・相違"], ans:3, hint:"zwischen A und B の形とよく一緒に使われる。", exp:"der Unterschied＝差異・相違。einen wesentlichen Unterschied feststellen（本質的な差異を確認する）。" },
      { q:"die Lösung", sub:"(-，-en)", opts:["問題", "試み", "解決策", "危険"], ans:2, hint:"lösen（解決する）の名詞形。eine 〜 finden の形が典型的。", exp:"die Lösung＝解決策。eine Lösung finden（解決策を見つける）。" },
      { q:"das Risiko", sub:"(-s，Risiken)", opts:["危険", "リスク・危険性", "措置", "失敗"], ans:1, hint:"ein Risiko eingehen（リスクを冒す）の形で覚えよう。複数形は -en。", exp:"das Risiko＝リスク・危険性。ein Risiko eingehen（リスクを冒す）。" },
      { q:"der Wert", sub:"(-es，-e)", opts:["価値・価値観", "優先", "目標", "品質"], ans:0, hint:"wertvoll（価値ある）と同じ語幹。", exp:"der Wert＝価値・価値観。einen hohen Wert legen auf（〜を重視する）。" },
      { q:"das Ziel", sub:"(-s，-e)", opts:["優先事項", "要求", "成果", "目標・目的"], ans:3, hint:"zielen（狙う）と同じ語幹。性は das。", exp:"das Ziel＝目標・目的。ein Ziel verfolgen（目標を追い求める）。" },
    ]
  },
  {
    label: "テストB",
    questions: [
      { q:"die Angst", sub:"(-，Ängste)", opts:["恐れ・不安", "希望", "喜び", "孤独感"], ans:0, hint:"Angst vor +D の形をとる。", exp:"die Angst＝恐れ・不安。★テストAとの重複語。Angst vor etw. haben（〜を恐れている）。" },
      { q:"die Meinung", sub:"(-，-en)", opts:["見解", "確信", "意見", "疑念"], ans:2, hint:"meiner Meinung nach（私の意見では）の形が最頻出。", exp:"die Meinung＝意見。★テストAとの重複語。meiner Meinung nach（私の意見では）。" },
      { q:"die Freude", sub:"(-，-n)", opts:["悲しみ", "失望", "満足感", "喜び"], ans:3, hint:"sich freuen（喜ぶ）の名詞形。", exp:"die Freude＝喜び。große Freude empfinden（大きな喜びを感じる）。" },
      { q:"die Trauer", sub:"(-，-)", opts:["孤独感", "悲しみ", "失望", "好奇心"], ans:1, hint:"trauern（悲しむ）の名詞形。複数形はほぼ使われない。", exp:"die Trauer＝悲しみ。tiefe Trauer ausdrücken（深い悲しみを表す）。" },
      { q:"die Enttäuschung", sub:"(-，-en)", opts:["満足感", "孤独感", "失望・がっかり", "ストレス"], ans:2, hint:"enttäuscht（失望した）の名詞形。ent-täuschen（幻想を解く）が語源。", exp:"die Enttäuschung＝失望・がっかり。eine große Enttäuschung erleben（大きな失望を経験する）。" },
      { q:"die Zufriedenheit", sub:"(-，-)", opts:["好奇心", "ストレス", "失望", "満足感"], ans:3, hint:"zufrieden（満足した）に -heit をつけた名詞。", exp:"die Zufriedenheit＝満足感。mit etw. Zufriedenheit finden（〜に満足感を見出す）。" },
      { q:"der Stress", sub:"(-es，-)", opts:["ストレス・過重負担", "満足感", "孤独感", "悲しみ"], ans:0, hint:"英語 stress からの借用語。性は der。", exp:"der Stress＝ストレス・過重負担。unter starkem Stress stehen（強いストレスを受けている）。" },
      { q:"die Neugier(de)", sub:"(-，-)", opts:["ストレス", "好奇心", "希望", "失望"], ans:1, hint:"neu（新しい）＋ gier（欲求）からできた語。", exp:"die Neugier(de)＝好奇心。von Neugier getrieben sein（好奇心に駆られている）。" },
      { q:"die Überzeugung", sub:"(-，-en)", opts:["確信・信念", "疑念", "印象", "認識"], ans:0, hint:"überzeugt（確信した）と同じ語幹。", exp:"die Überzeugung＝確信・信念。von etw. überzeugt sein（〜を確信している）。" },
      { q:"der Zweifel", sub:"(-s，-)", opts:["確信", "意識", "見解", "疑い・疑念"], ans:3, hint:"zweifeln（疑う）の名詞形。Zweifel an +D の形をとる。", exp:"der Zweifel＝疑い・疑念。Zweifel an etw. haben（〜を疑っている）。" },
      { q:"die Absicht", sub:"(-，-en)", opts:["注意", "見解", "意図・目的", "印象"], ans:2, hint:"-sicht で終わる名詞グループの中で「狙う」ニュアンスが強い語。", exp:"die Absicht＝意図・目的。die Absicht haben, etw. zu tun（〜するつもりだ）。" },
      { q:"die Vorstellung", sub:"(-，-en)", opts:["見解", "考え・イメージ・想像", "意識", "注意"], ans:1, hint:"sich vorstellen（想像する・自己紹介する）の名詞形。", exp:"die Vorstellung＝考え・イメージ・想像。eine falsche Vorstellung haben（誤ったイメージを持つ）。" },
      { q:"die Ansicht", sub:"(-，-en)", opts:["意識", "見解・意見", "確信", "疑念"], ans:1, hint:"meiner Ansicht nach（私の見解では）の形が典型的。die Meinung より少しフォーマル。", exp:"die Ansicht＝見解・意見。meiner Ansicht nach（私の見解では）。" },
      { q:"die Aufmerksamkeit", sub:"(-，-)", opts:["意図", "意識", "確信", "注意・注目"], ans:3, hint:"aufmerksam（注意深い）に -keit をつけた名詞。", exp:"die Aufmerksamkeit＝注意・注目。die Aufmerksamkeit auf etw. lenken（注意を〜に向ける）。" },
      { q:"die Beziehung", sub:"(-，-en)", opts:["行動", "対立", "関係・つながり", "支援"], ans:2, hint:"sich beziehen auf（〜に関係する）と同じ語幹。", exp:"die Beziehung＝関係・つながり。eine gute Beziehung aufbauen（良い関係を築く）。" },
      { q:"das Verhalten", sub:"(-s，-)", opts:["行動・振る舞い", "支援", "責任", "対立"], ans:0, hint:"sich verhalten（ふるまう）の名詞形。性は das。", exp:"das Verhalten＝行動・振る舞い。auffälliges Verhalten zeigen（目立つ行動をとる）。" },
      { q:"die Unterstützung", sub:"(-，-en)", opts:["支援・サポート", "関係", "対立", "行動"], ans:0, hint:"unterstützen（支援する）の名詞形。", exp:"die Unterstützung＝支援・サポート。Unterstützung leisten（支援する）。" },
      { q:"das Verständnis", sub:"(-ses，-)", opts:["協力", "責任", "理解・思いやり", "行動"], ans:2, hint:"verstehen（理解する）の名詞形。Verständnis für jdn. zeigen の形でよく使う。", exp:"das Verständnis＝理解・思いやり。Verständnis für jdn. zeigen（〜への理解を示す）。" },
      { q:"der Rückgang", sub:"(-s，Rückgänge)", opts:["増加", "減少・後退", "発展", "差異"], ans:1, hint:"Rück-（後ろへ）＋ Gang（歩み）。die Zunahme（増加）と対になる語。", exp:"der Rückgang＝減少・後退。ein deutlicher Rückgang der Zahlen（数値の顕著な減少）。" },
      { q:"die Zunahme", sub:"(-，-n)", opts:["後退", "影響", "変化", "増加"], ans:3, hint:"zunehmen（増加する）の名詞形。der Rückgang の反対語。", exp:"die Zunahme＝増加。eine starke Zunahme verzeichnen（強い増加を記録する）。" },
    ]
  },
  {
    label: "テストC",
    questions: [
      { q:"die Überzeugung", sub:"(-，-en)", opts:["疑念", "見解", "確信・信念", "注意"], ans:2, hint:"überzeugt（確信した）と同じ語幹。", exp:"die Überzeugung＝確信・信念。★テストBとの重複語。von etw. überzeugt sein（〜を確信している）。" },
      { q:"der Rückgang", sub:"(-s，Rückgänge)", opts:["発展", "差異", "増加", "減少・後退"], ans:3, hint:"Rück-（後ろへ）＋ Gang（歩み）。", exp:"der Rückgang＝減少・後退。★テストBとの重複語。ein deutlicher Rückgang der Zahlen。" },
      { q:"der Einfluss", sub:"(-es，Einflüsse)", opts:["効果", "影響", "結果", "変化"], ans:1, hint:"auf +A の形をとる。", exp:"der Einfluss＝影響。★テストAとの重複語。einen großen Einfluss haben auf（〜に大きな影響を持つ）。" },
      { q:"die Gleichheit", sub:"(-，-)", opts:["平等・同等性", "尊重", "寛容", "責任"], ans:0, hint:"gleich（等しい）に -heit をつけた名詞。", exp:"die Gleichheit＝平等・同等性。Gleichheit vor dem Gesetz（法の前の平等）。" },
      { q:"die Toleranz", sub:"(-，-en)", opts:["尊重", "平等", "寛容・許容", "理解"], ans:2, hint:"tolerant（寛容な）の名詞形。英語 tolerance と同語源。", exp:"die Toleranz＝寛容・許容。Toleranz gegenüber anderen zeigen（他者への寛容を示す）。" },
      { q:"der Verlauf", sub:"(-s，Verläufe)", opts:["変化", "経過・推移", "発展", "増加"], ans:1, hint:"verlaufen（経過する）の名詞形。im Verlauf des Jahres の形が頻出。", exp:"der Verlauf＝経過・推移。im Verlauf des Jahres（その年の経過の中で）。" },
      { q:"die Wirkung", sub:"(-，-en)", opts:["効果・作用", "影響", "結果", "変化"], ans:0, hint:"wirken（作用する）の名詞形。der Einfluss より具体的な効果を指す。", exp:"die Wirkung＝効果・作用。eine positive Wirkung erzielen（良い効果を生む）。" },

      { q:"der Verlauf", sub:"(-s，Verläufe)", opts:["変化", "経過・推移", "発展", "差異"], ans:1, hint:"verlaufen（経過する）の名詞形。im Verlauf des Jahres の形が頻出。", exp:"der Verlauf＝経過・推移。im Verlauf des Jahres（その年の経過の中で）。" },
      { q:"die Veränderung", sub:"(-，-en)", opts:["発展", "増加", "変化・変容", "差異"], ans:2, hint:"sich verändern（変化する）の名詞形。", exp:"die Veränderung＝変化・変容。eine grundlegende Veränderung erfahren（根本的な変化を経験する）。" },
      { q:"die Zunahme", sub:"(-，-n)", opts:["後退", "差異", "影響", "増加"], ans:3, hint:"zunehmen（増加する）の名詞形。der Rückgang の反対語。", exp:"die Zunahme＝増加。eine starke Zunahme verzeichnen（強い増加を記録する）。" },
      { q:"der Versuch", sub:"(-s，-e)", opts:["試み・試験", "成功", "危険", "失敗"], ans:0, hint:"versuchen（試みる）の名詞形。性は der。", exp:"der Versuch＝試み・試験。einen Versuch unternehmen（試みを行う）。" },
      { q:"das Scheitern", sub:"(-s，-)", opts:["成功", "失敗・挫折", "試み", "課題"], ans:1, hint:"scheitern（失敗する）の名詞化。性は das。der Erfolg の反対語。", exp:"das Scheitern＝失敗・挫折。aus dem Scheitern lernen（失敗から学ぶ）。" },
    ]
  }
];

let currentSet = 0;
let current = 0;
let score = 0;
let answered = false;

function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (s.label === RANDOM_LABEL ? ' random-btn' : '') + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}

function selectSet(idx) {
  if (sets[idx] && sets[idx].label === RANDOM_LABEL) buildRandomSet();
  currentSet = idx;
  current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (sets[i].label === RANDOM_LABEL ? ' random-btn' : '') + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  document.getElementById('q-num').textContent = `問${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-sub').textContent = q.sub;
  document.getElementById('prog-bar').style.width = `${((current+1)/qs.length)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${qs.length}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}

function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。　' + q.exp;
  }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}

function nextQuestion() {
  current++;
  if (current < sets[currentSet].questions.length) {
    render();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = '';
  if (pct >= 90) msg = '素晴らしい！ほぼ完璧です。';
  else if (pct >= 70) msg = 'よくできました。間違えた語を復習しましょう。';
  else if (pct >= 50) msg = 'もう少しです。リストを見直してから再挑戦してみましょう。';
  else msg = '語彙リストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) {
    nb.style.display = 'inline-block';
    nb.textContent = sets[currentSet + 1].label + 'へ →';
  } else {
    nb.style.display = 'none';
  }
}

function restart() {
  current = 0; score = 0;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function goNextSet() { selectSet(currentSet + 1); }


// ── ランダムモード ────────────────────────────────
const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 20;

function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet;
  else sets.push(randomSet);
}

// ランダムセットを初回構築
buildRandomSet();
// ──────────────────────────────────────────────────

initSetNav();
render();
</script>
