<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象名詞テスト B1+レベル（独→日）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 6px; }
  .question-text { font-size: 22px; font-weight: 500; margin-bottom: 6px; font-family: "Segoe UI", "Candara", sans-serif; }
  .question-sub { font-size: 13px; color: #888; margin-bottom: 1.25rem; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: inherit; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; font-family: "Segoe UI", "Candara", sans-serif; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>抽象名詞テスト　B1+レベル（独→日）</h1>
    <p>ドイツ語名詞の日本語の意味を選びなさい。（各テスト20問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index_b1plus.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← 戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:5%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="question-sub" id="q-sub"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このテストをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のテストへ →</button>
    </div>
  </div>
</div>
<script>
// DJ テストA: ①感情1-5 + ③社会6-10 + ⑤問題6-10 + ⑦情報6-10
// DJ テストB: ②思考1-5 + ④変化6-10 + ⑥価値6-10 + ⑧量6-10
// DJ テストC: ①感情6-10 + ②思考6-10 + ⑤問題1-5 + ⑥価値1-5
// DJ テストD: ③社会1-5 + ④変化1-5 + ⑦情報1-5 + ⑧量1-5
const sets = [
  { label:"テストA", questions:[
    // ①感情1-5
    { q:"die Angst", sub:"(-，Ängste)", opts:["希望・期待", "恐れ・不安", "好奇心・探究心", "満足感・充足感"], ans:1, hint:"Angst vor etw. haben（〜を恐れている）の形でよく使う。", exp:"die Angst＝恐れ・不安。Angst vor etw. haben（〜を恐れている）。" },
    { q:"die Hoffnung", sub:"(-，-en)", opts:["失望・がっかり", "悲しみ・哀しみ", "希望・期待", "孤独感・孤立感"], ans:2, hint:"hoffen（望む）の名詞形。die Hoffnung aufgeben（希望を捨てる）。", exp:"die Hoffnung＝希望。die Hoffnung aufgeben（希望を捨てる）。" },
    { q:"die Freude", sub:"(-，-n)", opts:["悲しみ・哀しみ", "失望・がっかり", "過重負担・ストレス", "喜び・歓び"], ans:3, hint:"sich freuen（喜ぶ）の名詞形。große Freude empfinden（大きな喜びを感じる）。", exp:"die Freude＝喜び。große Freude empfinden（大きな喜びを感じる）。" },
    { q:"die Trauer", sub:"(-，-)", opts:["悲しみ・哀しみ", "希望・期待", "信頼・信用", "孤独感・孤立感"], ans:0, hint:"trauern（悲しむ）の名詞形。tiefe Trauer ausdrücken（深い悲しみを表す）。", exp:"die Trauer＝悲しみ。tiefe Trauer ausdrücken（深い悲しみを表す）。" },
    { q:"die Enttäuschung", sub:"(-，-en)", opts:["過重負担・ストレス", "失望・がっかり", "信頼・信用", "好奇心・探究心"], ans:1, hint:"enttäuscht（失望した）の名詞形。eine große Enttäuschung erleben（大きな失望を経験する）。", exp:"die Enttäuschung＝失望・がっかり。eine große Enttäuschung erleben（大きな失望を経験する）。" },
    // ③社会6-10
    { q:"die Unterstützung", sub:"(-，-en)", opts:["尊重・敬意", "平等・同等性", "理解・思いやり", "支援・援助"], ans:3, hint:"unterstützen（支援する）の名詞形。Unterstützung leisten（支援する）。", exp:"die Unterstützung＝支援・サポート。Unterstützung leisten（支援する）。" },
    { q:"der Respekt", sub:"(-s，-)", opts:["尊重・敬意", "理解・思いやり", "寛容・許容", "平等・同等性"], ans:0, hint:"英語 respect と同語源。Respekt vor +D の形をとる。", exp:"der Respekt＝尊重・敬意。Respekt vor jdm. haben（〜を尊重している）。" },
    { q:"das Verständnis", sub:"(-ses，-)", opts:["平等・同等性", "寛容・許容", "理解・思いやり", "支援・援助"], ans:2, hint:"verstehen（理解する）の名詞形。Verständnis für jdn. zeigen（〜への理解を示す）。", exp:"das Verständnis＝理解・思いやり。Verständnis für jdn. zeigen（〜への理解を示す）。" },
    { q:"die Gleichheit", sub:"(-，-)", opts:["尊重・敬意", "寛容・許容", "支援・援助", "平等・同等性"], ans:3, hint:"gleich（等しい）に -heit をつけた名詞。Gleichheit vor dem Gesetz（法の前の平等）。", exp:"die Gleichheit＝平等・同等性。Gleichheit vor dem Gesetz（法の前の平等）。" },
    { q:"die Toleranz", sub:"(-，-en)", opts:["平等・同等性", "寛容・許容", "理解・思いやり", "尊重・敬意"], ans:1, hint:"tolerant（寛容な）の名詞形。英語 tolerance と同語源。", exp:"die Toleranz＝寛容・許容。Toleranz gegenüber anderen zeigen（他者への寛容を示す）。" },
    // ⑤問題6-10
    { q:"die Gefahr", sub:"(-，-en)", opts:["危険・脅威", "措置・対策", "試み・試験", "成功・達成"], ans:0, hint:"gefährlich（危険な）の元になる語。in Gefahr geraten（危険にさらされる）。", exp:"die Gefahr＝危険。in Gefahr geraten（危険にさらされる）。" },
    { q:"die Maßnahme", sub:"(-，-n)", opts:["試み・試験", "成功・達成", "措置・対策", "失敗・挫折"], ans:2, hint:"Maßnahmen ergreifen（措置を講じる）の形が典型的。", exp:"die Maßnahme＝措置・対策。Maßnahmen ergreifen（措置を講じる）。" },
    { q:"der Versuch", sub:"(-s，-e)", opts:["試み・試験", "失敗・挫折", "成功・達成", "危険・脅威"], ans:0, hint:"versuchen（試みる）の名詞形。einen Versuch unternehmen（試みを行う）。", exp:"der Versuch＝試み・試験。einen Versuch unternehmen（試みを行う）。" },
    { q:"der Erfolg", sub:"(-s，-e)", opts:["失敗・挫折", "成功・達成", "危険・脅威", "措置・対策"], ans:1, hint:"erfolgreich（成功した）と同じ語幹。zum Erfolg führen（成功に導く）。", exp:"der Erfolg＝成功。zum Erfolg führen（成功に導く）。" },
    { q:"das Scheitern", sub:"(-s，-)", opts:["成功・達成", "試み・試験", "失敗・挫折", "措置・対策"], ans:2, hint:"scheitern（失敗する）の名詞化。性は das。aus dem Scheitern lernen（失敗から学ぶ）。", exp:"das Scheitern＝失敗・挫折。aus dem Scheitern lernen（失敗から学ぶ）。" },
    // ⑦情報6-10
    { q:"die Diskussion", sub:"(-，-en)", opts:["提案・申し出", "決定・決断", "問い合わせ・申請", "議論・討論"], ans:3, hint:"diskutieren（議論する）の名詞形。eine Diskussion führen（議論を行う）。", exp:"die Diskussion＝議論・討論。eine Diskussion führen（議論を行う）。" },
    { q:"die Entscheidung", sub:"(-，-en)", opts:["決定・決断", "取り決め・合意", "問い合わせ・申請", "議論・討論"], ans:0, hint:"entscheiden（決める）の名詞形。eine Entscheidung treffen（決断を下す）。", exp:"die Entscheidung＝決定・決断。eine Entscheidung treffen（決断を下す）。" },
    { q:"der Vorschlag", sub:"(-s，Vorschläge)", opts:["問い合わせ・申請", "提案・申し出", "取り決め・合意", "決定・決断"], ans:1, hint:"vorschlagen（提案する）の名詞形。einen Vorschlag machen（提案する）。", exp:"der Vorschlag＝提案。einen Vorschlag machen（提案する）。" },
    { q:"die Anfrage", sub:"(-，-n)", opts:["取り決め・合意", "提案・申し出", "問い合わせ・申請", "議論・討論"], ans:2, hint:"anfragen（問い合わせる）の名詞形。eine Anfrage stellen（問い合わせをする）。", exp:"die Anfrage＝問い合わせ・申請。eine Anfrage stellen（問い合わせをする）。" },
    { q:"die Vereinbarung", sub:"(-，-en)", opts:["議論・討論", "決定・決断", "問い合わせ・申請", "取り決め・合意"], ans:3, hint:"sich vereinbaren（合意する）の名詞形。eine Vereinbarung treffen（取り決めを結ぶ）。", exp:"die Vereinbarung＝取り決め・合意。eine Vereinbarung treffen（取り決めを結ぶ）。" },
  ]},
  { label:"テストB", questions:[
    // ②思考1-5
    { q:"die Meinung", sub:"(-，-en)", opts:["意見・見方", "確信・信念", "疑い・疑念", "認識・気づき"], ans:0, hint:"meiner Meinung nach（私の意見では）の形が最頻出。", exp:"die Meinung＝意見。meiner Meinung nach（私の意見では）。" },
    { q:"die Überzeugung", sub:"(-，-en)", opts:["印象・感触", "確信・信念", "意識・自覚", "疑い・疑念"], ans:1, hint:"überzeugt（確信した）と同じ語幹。von etw. überzeugt sein（〜を確信している）。", exp:"die Überzeugung＝確信・信念。von etw. überzeugt sein（〜を確信している）。" },
    { q:"der Zweifel", sub:"(-s，-)", opts:["認識・気づき", "見解・意見", "意図・目的", "疑い・疑念"], ans:3, hint:"zweifeln（疑う）の名詞形。Zweifel an +D の形をとる。", exp:"der Zweifel＝疑い・疑念。Zweifel an etw. haben（〜を疑っている）。" },
    { q:"die Erkenntnis", sub:"(-，-se)", opts:["確信・信念", "意識・自覚", "認識・気づき", "意図・目的"], ans:2, hint:"erkennen（認識する）の名詞形。zu einer Erkenntnis kommen（認識に至る）。", exp:"die Erkenntnis＝認識・気づき。zu einer Erkenntnis kommen（認識に至る）。" },
    { q:"das Bewusstsein", sub:"(-s，-)", opts:["見解・意見", "疑い・疑念", "印象・感触", "意識・自覚"], ans:3, hint:"bewusst（意識した）の名詞形。ein Bewusstsein für etw. entwickeln（〜への意識を育てる）。", exp:"das Bewusstsein＝意識・自覚。ein Bewusstsein für etw. entwickeln（〜への意識を育てる）。" },
    // ④変化6-10
    { q:"der Verlauf", sub:"(-s，Verläufe)", opts:["差異・相違", "経過・推移", "影響・作用", "増加・拡大"], ans:1, hint:"verlaufen（経過する）の名詞形。im Verlauf des Jahres（その年の経過の中で）。", exp:"der Verlauf＝経過・推移。im Verlauf des Jahres（その年の経過の中で）。" },
    { q:"der Einfluss", sub:"(-es，Einflüsse)", opts:["差異・相違", "結果・影響", "影響・作用", "効果・作用"], ans:2, hint:"auf +A の形をとる。einen großen Einfluss haben auf（〜に大きな影響を持つ）。", exp:"der Einfluss＝影響。einen großen Einfluss haben auf（〜に大きな影響を持つ）。" },
    { q:"die Wirkung", sub:"(-，-en)", opts:["効果・作用", "結果・影響", "差異・相違", "影響・作用"], ans:0, hint:"wirken（作用する）の名詞形。eine positive Wirkung erzielen（良い効果を生む）。", exp:"die Wirkung＝効果・作用。eine positive Wirkung erzielen（良い効果を生む）。" },
    { q:"die Folge", sub:"(-，-n)", opts:["差異・相違", "結果・影響", "影響・作用", "効果・作用"], ans:1, hint:"folgen（続く・従う）の名詞形。als Folge davon（その結果として）の形も重要。", exp:"die Folge＝結果・影響。die Folgen abschätzen（結果を見積もる）。" },
    { q:"der Unterschied", sub:"(-s，-e)", opts:["変化・変容", "結果・影響", "差異・相違", "影響・作用"], ans:2, hint:"zwischen A und B の形とよく一緒に使われる。", exp:"der Unterschied＝差異・相違。einen wesentlichen Unterschied feststellen（本質的な差異を確認する）。" },
    // ⑥価値6-10
    { q:"die Kritik", sub:"(-，-en)", opts:["目標・目的", "成果・業績・能力", "優先事項・優先度", "批判・批評"], ans:3, hint:"kritisch（批判的な）と同じ語幹。Kritik üben an +D の形。", exp:"die Kritik＝批判・批評。Kritik üben an（〜に批判を加える）。" },
    { q:"das Ziel", sub:"(-s，-e)", opts:["目標・目的", "成果・業績・能力", "優先事項・優先度", "要求・主張・権利"], ans:0, hint:"zielen（狙う）と同じ語幹。性は das。ein Ziel verfolgen（目標を追い求める）。", exp:"das Ziel＝目標・目的。ein Ziel verfolgen（目標を追い求める）。" },
    { q:"die Priorität", sub:"(-，-en)", opts:["批判・批評", "優先事項・優先度", "目標・目的", "要求・主張・権利"], ans:1, hint:"英語 priority と同語源。Prioritäten setzen（優先順位をつける）の形が典型的。", exp:"die Priorität＝優先事項。Prioritäten setzen（優先順位をつける）。" },
    { q:"der Anspruch", sub:"(-s，Ansprüche)", opts:["成果・業績・能力", "優先事項・優先度", "要求・主張・権利", "目標・目的"], ans:2, hint:"in Anspruch nehmen（〜を必要とする）の形でもよく使われる。", exp:"der Anspruch＝要求・主張・権利。hohe Ansprüche stellen（高い要求をする）。" },
    { q:"die Leistung", sub:"(-，-en)", opts:["成果・業績・能力", "批判・批評", "目標・目的", "優先事項・優先度"], ans:0, hint:"leisten（成し遂げる）の名詞形。eine hohe Leistung erbringen（高い成果を上げる）。", exp:"die Leistung＝成果・業績・能力。eine hohe Leistung erbringen（高い成果を上げる）。" },
    // ⑧量6-10
    { q:"der Überfluss", sub:"(-es，-)", opts:["不足・欠如", "程度・規模", "割合・分担", "過剰・豊富さ"], ans:3, hint:"über（超えて）＋Fluss（流れ）からのイメージ。der Mangel の反対語。", exp:"der Überfluss＝過剰・豊富さ。im Überfluss vorhanden sein（豊富に存在する）。" },
    { q:"der Grad", sub:"(-es，-e)", opts:["水準・程度", "程度・度合い", "割合・分担", "頻度・回数"], ans:1, hint:"温度や円の単位にも使われる語。in hohem Grad（高い程度で）の形。", exp:"der Grad＝程度・度合い。in hohem Grad（高い程度で）。" },
    { q:"das Niveau", sub:"(-s，-s)", opts:["程度・規模", "割合・分担", "水準・程度", "頻度・回数"], ans:2, hint:"フランス語由来の借用語。複数形が -s になる珍しい名詞。auf hohem Niveau（高い水準で）。", exp:"das Niveau＝水準・レベル。auf hohem Niveau（高い水準で）。" },

    { q:"die Minderheit", sub:"(-，-en)", opts:["多数・多数派", "水準・程度", "程度・規模", "少数・少数派"], ans:3, hint:"minder（より少ない）＋-heit。die Mehrheit（多数派）の反対語。", exp:"die Minderheit＝少数・少数派。eine sprachliche Minderheit（言語的少数派）。" },

const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 20;
function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet; else sets.push(randomSet);
}
buildRandomSet();
let currentSet = 0, current = 0, score = 0, answered = false;
function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (s.label === RANDOM_LABEL ? ' random-btn' : '') + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}
function selectSet(idx) {
  if (sets[idx] && sets[idx].label === RANDOM_LABEL) buildRandomSet();
  currentSet = idx; current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (sets[i].label === RANDOM_LABEL ? ' random-btn' : '') + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}
function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  document.getElementById('q-num').textContent = `問${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-sub').textContent = q.sub;
  document.getElementById('prog-bar').style.width = `${((current+1)/qs.length)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${qs.length}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}
function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}
function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。　' + q.exp;
  }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}
function nextQuestion() {
  current++;
  if (current < sets[currentSet].questions.length) render(); else showResult();
}
function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = pct >= 90 ? '素晴らしい！ほぼ完璧です。' : pct >= 70 ? 'よくできました。間違えた語を復習しましょう。' : pct >= 50 ? 'もう少しです。リストを見直してから再挑戦しましょう。' : '語彙リストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) { nb.style.display = 'inline-block'; nb.textContent = sets[currentSet + 1].label + 'へ →'; }
  else nb.style.display = 'none';
}
function restart() {
  current = 0; score = 0;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}
function goNextSet() { selectSet(currentSet + 1); }
initSetNav();
render();
