<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象名詞テスト B1+レベル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 8px; }
  .question-text { font-size: 17px; font-weight: 500; margin-bottom: 1.25rem; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: "Segoe UI", "Candara", sans-serif; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>抽象名詞テスト　B1+レベル</h1>
    <p>日本語の意味に合うドイツ語名詞を選びなさい。（各テスト20問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← ポータルに戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:5%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このテストをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のテストへ →</button>
    </div>
  </div>
</div>
<script>
// JD: テストA=①感情1-5+②思考1-5+③社会1-5+④変化1-5
//     テストB=①感情6-10+②思考6-10+③社会6-10+④変化6-10
//     テストC=⑤問題+⑥価値
//     テストD=⑦情報+⑧量
const sets = [
  { label:"テストA", questions:[
    { q:"「恐れ・不安」を意味するドイツ語名詞はどれか。", opts:["die Hoffnung", "die Einsamkeit", "die Freude", "die Angst"], ans:3, hint:"Angst vor etw. haben（〜を恐れている）の形でよく使う。", exp:"die Angst（-，Ängste）＝恐れ・不安。Angst vor etw. haben（〜を恐れている）。" },
    { q:"「希望」を意味するドイツ語名詞はどれか。", opts:["die Hoffnung", "das Vertrauen", "die Trauer", "die Angst"], ans:0, hint:"hoffen（望む）の名詞形。die Hoffnung aufgeben（希望を捨てる）。", exp:"die Hoffnung（-，-en）＝希望。die Hoffnung aufgeben（希望を捨てる）。" },
    { q:"「喜び」を意味するドイツ語名詞はどれか。", opts:["die Trauer", "die Freude", "die Angst", "die Einsamkeit"], ans:1, hint:"sich freuen（喜ぶ）の名詞形。große Freude empfinden（大きな喜びを感じる）。", exp:"die Freude（-，-n）＝喜び。große Freude empfinden（大きな喜びを感じる）。" },
    { q:"「悲しみ」を意味するドイツ語名詞はどれか。", opts:["die Freude", "das Vertrauen", "die Trauer", "die Hoffnung"], ans:2, hint:"trauern（悲しむ）の名詞形。tiefe Trauer ausdrücken（深い悲しみを表す）。", exp:"die Trauer（-，-）＝悲しみ。tiefe Trauer ausdrücken（深い悲しみを表す）。" },
    { q:"「失望・がっかり」を意味するドイツ語名詞はどれか。", opts:["die Zufriedenheit", "die Neugier(de)", "der Stress", "die Enttäuschung"], ans:3, hint:"enttäuscht（失望した）の名詞形。eine große Enttäuschung erleben（大きな失望を経験する）。", exp:"die Enttäuschung（-，-en）＝失望・がっかり。eine große Enttäuschung erleben（大きな失望を経験する）。" },
    { q:"「意見」を意味するドイツ語名詞はどれか。", opts:["die Erkenntnis", "die Absicht", "die Meinung", "der Zweifel"], ans:2, hint:"meiner Meinung nach（私の意見では）の形が最頻出。", exp:"die Meinung（-，-en）＝意見。meiner Meinung nach（私の意見では）。" },
    { q:"「確信・信念」を意味するドイツ語名詞はどれか。", opts:["die Überzeugung", "die Ansicht", "die Vorstellung", "das Bewusstsein"], ans:0, hint:"überzeugt（確信した）と同じ語幹。von etw. überzeugt sein（〜を確信している）。", exp:"die Überzeugung（-，-en）＝確信・信念。von etw. überzeugt sein（〜を確信している）。" },
    { q:"「疑い・疑念」を意味するドイツ語名詞はどれか。", opts:["die Erkenntnis", "der Zweifel", "die Meinung", "die Absicht"], ans:1, hint:"zweifeln（疑う）の名詞形。Zweifel an +D の形をとる。", exp:"der Zweifel（-s，-）＝疑い・疑念。Zweifel an etw. haben（〜を疑っている）。" },
    { q:"「認識・気づき」を意味するドイツ語名詞はどれか。", opts:["das Bewusstsein", "die Vorstellung", "der Eindruck", "die Erkenntnis"], ans:3, hint:"erkennen（認識する）の名詞形。zu einer Erkenntnis kommen（認識に至る）。", exp:"die Erkenntnis（-，-se）＝認識・気づき。zu einer Erkenntnis kommen（認識に至る）。" },
    { q:"「意識・自覚」を意味するドイツ語名詞はどれか。", opts:["das Bewusstsein", "die Absicht", "die Ansicht", "die Aufmerksamkeit"], ans:0, hint:"bewusst（意識した）の名詞形。ein Bewusstsein für etw. entwickeln（〜への意識を育てる）。", exp:"das Bewusstsein（-s，-）＝意識・自覚。ein Bewusstsein für etw. entwickeln（〜への意識を育てる）。" },
    { q:"「責任」を意味するドイツ語名詞はどれか。", opts:["die Zusammenarbeit", "die Verantwortung", "das Verhalten", "der Respekt"], ans:1, hint:"Verantwortung übernehmen（責任を引き受ける）の形でよく使う。", exp:"die Verantwortung（-，-en）＝責任。Verantwortung übernehmen（責任を引き受ける）。" },
    { q:"「協力・協働」を意味するドイツ語名詞はどれか。", opts:["die Beziehung", "der Konflikt", "die Zusammenarbeit", "die Unterstützung"], ans:2, hint:"zusammen（一緒に）＋Arbeit（仕事）からなる複合名詞。", exp:"die Zusammenarbeit（-，-）＝協力・協働。eine enge Zusammenarbeit fördern（緊密な協力を促す）。" },
    { q:"「関係・つながり」を意味するドイツ語名詞はどれか。", opts:["die Verantwortung", "das Verständnis", "die Zusammenarbeit", "die Beziehung"], ans:3, hint:"sich beziehen auf（〜に関係する）と同じ語幹。eine gute Beziehung aufbauen（良い関係を築く）。", exp:"die Beziehung（-，-en）＝関係・つながり。eine gute Beziehung aufbauen（良い関係を築く）。" },
    { q:"「行動・振る舞い」を意味するドイツ語名詞はどれか。", opts:["das Verhalten", "der Konflikt", "die Beziehung", "der Respekt"], ans:0, hint:"sich verhalten（ふるまう）の名詞形。auffälliges Verhalten zeigen（目立つ行動をとる）。", exp:"das Verhalten（-s，-）＝行動・振る舞い。auffälliges Verhalten zeigen（目立つ行動をとる）。" },
    { q:"「対立・葛藤」を意味するドイツ語名詞はどれか。", opts:["die Unterstützung", "das Verständnis", "der Konflikt", "die Verantwortung"], ans:2, hint:"英語 conflict と同語源。einen Konflikt lösen（対立を解消する）。", exp:"der Konflikt（-s，-e）＝対立・葛藤。einen Konflikt lösen（対立を解消する）。" },
    { q:"「変化・変容」を意味するドイツ語名詞はどれか。", opts:["die Entwicklung", "die Veränderung", "der Rückgang", "die Zunahme"], ans:1, hint:"sich verändern（変化する）の名詞形。eine grundlegende Veränderung erfahren（根本的な変化を経験する）。", exp:"die Veränderung（-，-en）＝変化・変容。eine grundlegende Veränderung erfahren（根本的な変化を経験する）。" },
    { q:"「発展・展開」を意味するドイツ語名詞はどれか。", opts:["der Verlauf", "der Unterschied", "die Veränderung", "die Entwicklung"], ans:3, hint:"sich entwickeln（発展する）の名詞形。eine positive Entwicklung beobachten（前向きな発展を観察する）。", exp:"die Entwicklung（-，-en）＝発展・展開。eine positive Entwicklung beobachten（前向きな発展を観察する）。" },
    { q:"「進歩・進展」を意味するドイツ語名詞はどれか。", opts:["der Rückgang", "der Fortschritt", "die Zunahme", "der Einfluss"], ans:1, hint:"fort（前へ）＋Schritt（一歩）からなる複合名詞。Fortschritte machen（進歩する）。", exp:"der Fortschritt（-s，-e）＝進歩・進展。Fortschritte machen（進歩する）。" },
    { q:"「減少・後退」を意味するドイツ語名詞はどれか。", opts:["der Rückgang", "die Zunahme", "der Verlauf", "der Fortschritt"], ans:0, hint:"Rück-（後ろへ）＋Gang（歩み）。ein deutlicher Rückgang der Zahlen（数値の顕著な減少）。", exp:"der Rückgang（-s，Rückgänge）＝減少・後退。ein deutlicher Rückgang der Zahlen（数値の顕著な減少）。" },
    { q:"「増加」を意味するドイツ語名詞はどれか。", opts:["der Verlauf", "die Wirkung", "die Zunahme", "der Einfluss"], ans:2, hint:"zunehmen（増加する）の名詞形。der Rückgang の反対語。", exp:"die Zunahme（-，-n）＝増加。eine starke Zunahme verzeichnen（強い増加を記録する）。" },
  ]},
  { label:"テストB", questions:[
    { q:"「満足感」を意味するドイツ語名詞はどれか。", opts:["die Enttäuschung", "der Stress", "die Zufriedenheit", "die Neugier(de)"], ans:2, hint:"zufrieden（満足した）に -heit をつけた名詞。mit etw. Zufriedenheit finden（〜に満足感を見出す）。", exp:"die Zufriedenheit（-，-）＝満足感。mit etw. Zufriedenheit finden（〜に満足感を見出す）。" },
    { q:"「ストレス・過重負担」を意味するドイツ語名詞はどれか。", opts:["die Einsamkeit", "die Hoffnung", "die Zufriedenheit", "der Stress"], ans:3, hint:"英語 stress からの借用語。unter starkem Stress stehen（強いストレスを受けている）。", exp:"der Stress（-es，-）＝ストレス・過重負担。unter starkem Stress stehen（強いストレスを受けている）。" },
    { q:"「信頼」を意味するドイツ語名詞はどれか。", opts:["das Vertrauen", "die Neugier(de)", "die Angst", "die Freude"], ans:0, hint:"vertrauen（信頼する）の名詞形。性は das。Vertrauen in jdn. haben（〜を信頼している）。", exp:"das Vertrauen（-s，-）＝信頼。Vertrauen in jdn. haben（〜を信頼している）。" },
    { q:"「孤独感」を意味するドイツ語名詞はどれか。", opts:["die Trauer", "die Einsamkeit", "der Stress", "die Enttäuschung"], ans:1, hint:"einsam（孤独な）に -keit をつけた名詞。an Einsamkeit leiden（孤独に苦しむ）。", exp:"die Einsamkeit（-，-）＝孤独感。an Einsamkeit leiden（孤独に苦しむ）。" },
    { q:"「好奇心」を意味するドイツ語名詞はどれか。", opts:["die Neugier(de)", "das Vertrauen", "die Hoffnung", "der Stress"], ans:0, hint:"neu（新しい）＋gier（欲求）からできた語。von Neugier getrieben sein（好奇心に駆られている）。", exp:"die Neugier(de)（-，-）＝好奇心。von Neugier getrieben sein（好奇心に駆られている）。" },
    { q:"「意図・目的」を意味するドイツ語名詞はどれか。", opts:["die Ansicht", "die Aufmerksamkeit", "die Absicht", "der Eindruck"], ans:2, hint:"-sicht で終わる名詞グループ。die Absicht haben, etw. zu tun（〜するつもりだ）。", exp:"die Absicht（-，-en）＝意図・目的。die Absicht haben, etw. zu tun（〜するつもりだ）。" },
    { q:"「考え・イメージ・想像」を意味するドイツ語名詞はどれか。", opts:["das Bewusstsein", "die Meinung", "die Überzeugung", "die Vorstellung"], ans:3, hint:"sich vorstellen（想像する・自己紹介する）の名詞形。eine falsche Vorstellung haben（誤ったイメージを持つ）。", exp:"die Vorstellung（-，-en）＝考え・イメージ・想像。eine falsche Vorstellung haben（誤ったイメージを持つ）。" },
    { q:"「見解・意見」を意味するドイツ語名詞はどれか。", opts:["die Erkenntnis", "die Ansicht", "der Zweifel", "die Vorstellung"], ans:1, hint:"meiner Ansicht nach（私の見解では）の形が典型的。die Meinung より少しフォーマル。", exp:"die Ansicht（-，-en）＝見解・意見。meiner Ansicht nach（私の見解では）。" },
    { q:"「印象」を意味するドイツ語名詞はどれか。", opts:["die Aufmerksamkeit", "die Absicht", "der Eindruck", "die Erkenntnis"], ans:2, hint:"einen guten Eindruck machen（良い印象を与える）の形が典型的。", exp:"der Eindruck（-s，Eindrücke）＝印象。einen guten Eindruck machen（良い印象を与える）。" },
    { q:"「注意・注目」を意味するドイツ語名詞はどれか。", opts:["die Ansicht", "die Aufmerksamkeit", "die Meinung", "der Zweifel"], ans:1, hint:"aufmerksam（注意深い）に -keit をつけた名詞。die Aufmerksamkeit auf etw. lenken（注意を〜に向ける）。", exp:"die Aufmerksamkeit（-，-）＝注意・注目。die Aufmerksamkeit auf etw. lenken（注意を〜に向ける）。" },
    { q:"「支援・サポート」を意味するドイツ語名詞はどれか。", opts:["das Verständnis", "die Gleichheit", "die Toleranz", "die Unterstützung"], ans:3, hint:"unterstützen（支援する）の名詞形。Unterstützung leisten（支援する）。", exp:"die Unterstützung（-，-en）＝支援・サポート。Unterstützung leisten（支援する）。" },
    { q:"「尊重・敬意」を意味するドイツ語名詞はどれか。", opts:["der Respekt", "die Gleichheit", "das Verständnis", "die Toleranz"], ans:0, hint:"英語 respect と同語源。Respekt vor +D の形をとる。", exp:"der Respekt（-s，-）＝尊重・敬意。Respekt vor jdm. haben（〜を尊重している）。" },
    { q:"「理解・思いやり」を意味するドイツ語名詞はどれか。", opts:["die Toleranz", "das Verständnis", "die Gleichheit", "der Respekt"], ans:1, hint:"verstehen（理解する）の名詞形。Verständnis für jdn. zeigen（〜への理解を示す）。", exp:"das Verständnis（-ses，-）＝理解・思いやり。Verständnis für jdn. zeigen（〜への理解を示す）。" },
    { q:"「平等・同等性」を意味するドイツ語名詞はどれか。", opts:["die Unterstützung", "die Toleranz", "die Gleichheit", "der Respekt"], ans:2, hint:"gleich（等しい）に -heit をつけた名詞。Gleichheit vor dem Gesetz（法の前の平等）。", exp:"die Gleichheit（-，-）＝平等・同等性。Gleichheit vor dem Gesetz（法の前の平等）。" },
    { q:"「寛容・許容」を意味するドイツ語名詞はどれか。", opts:["die Toleranz", "das Verständnis", "die Unterstützung", "die Gleichheit"], ans:0, hint:"tolerant（寛容な）の名詞形。英語 tolerance と同語源。", exp:"die Toleranz（-，-en）＝寛容・許容。Toleranz gegenüber anderen zeigen（他者への寛容を示す）。" },
    { q:"「経過・推移」を意味するドイツ語名詞はどれか。", opts:["die Wirkung", "die Folge", "der Einfluss", "der Verlauf"], ans:3, hint:"verlaufen（経過する）の名詞形。im Verlauf des Jahres（その年の経過の中で）。", exp:"der Verlauf（-s，Verläufe）＝経過・推移。im Verlauf des Jahres（その年の経過の中で）。" },

const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 20;

function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet; else sets.push(randomSet);
}
buildRandomSet();

let currentSet = 0, current = 0, score = 0, answered = false;

function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (s.label === RANDOM_LABEL ? ' random-btn' : '') + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}
function selectSet(idx) {
  if (sets[idx] && sets[idx].label === RANDOM_LABEL) buildRandomSet();
  currentSet = idx; current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (sets[i].label === RANDOM_LABEL ? ' random-btn' : '') + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}
function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  document.getElementById('q-num').textContent = `問${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-bar').style.width = `${((current+1)/qs.length)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${qs.length}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}
function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}
function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。　' + q.exp;
  }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}
function nextQuestion() {
  current++;
  if (current < sets[currentSet].questions.length) render(); else showResult();
}
function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = pct >= 90 ? '素晴らしい！ほぼ完璧です。' : pct >= 70 ? 'よくできました。間違えた語を復習しましょう。' : pct >= 50 ? 'もう少しです。リストを見直してから再挑戦しましょう。' : '語彙リストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) { nb.style.display = 'inline-block'; nb.textContent = sets[currentSet + 1].label + 'へ →'; }
  else nb.style.display = 'none';
}
function restart() {
  current = 0; score = 0;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}
function goNextSet() { selectSet(currentSet + 1); }
initSetNav();
render();
</script>
</body>
</html>
