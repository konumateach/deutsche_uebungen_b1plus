<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象名詞テスト B1+レベル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 8px; }
  .question-text { font-size: 17px; font-weight: 500; margin-bottom: 1.25rem; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: inherit; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>抽象名詞テスト　B1+レベル</h1>
    <p>日本語の意味に合うドイツ語名詞を選びなさい。（各セット20問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← ポータルに戻る</a></div>
  <div class="set-nav" id="set-nav"></div>

  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:5%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card" id="q-card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このセットをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のセットへ →</button>
    </div>
  </div>
</div>

<script>
const sets = [
  {
    id: 1,
    label: "テストA",
    info: "感情・思考・社会・変化・問題・価値・情報・量の各領域から出題",
    questions: [
      { q:"「責任」を意味するドイツ語名詞はどれか。", opts:["die Vereinbarung", "die Vorstellung", "die Verantwortung", "das Verständnis"], ans:2, hint:"「引き受ける・取る」という動詞とよく一緒に使われる名詞。", exp:"die Verantwortung（-，-en）＝責任。Verantwortung übernehmen（責任を引き受ける）の形でよく使われる。" },
      { q:"「印象」を意味するドイツ語名詞はどれか。", opts:["der Eindruck", "der Einfluss", "der Eingang", "der Einsatz"], ans:0, hint:"「良い〜を与える」という表現でよく出てくる。", exp:"der Eindruck（-s，Eindrücke）＝印象。einen guten Eindruck machen（良い印象を与える）の形が典型的。" },
      { q:"「頻度」を意味するドイツ語名詞はどれか。", opts:["die Dauer", "die Häufigkeit", "die Mehrheit", "die Zunahme"], ans:1, hint:"「よく起こる」という意味の形容詞 häufig と同じ語幹。", exp:"die Häufigkeit（-，-en）＝頻度。mit zunehmender Häufigkeit（頻度が増すにつれて）の形が典型的。" },
      { q:"「差異・相違」を意味するドイツ語名詞はどれか。", opts:["der Verlauf", "der Rückgang", "der Einfluss", "der Unterschied"], ans:3, hint:"「〜と〜の間の」という前置詞 zwischen と一緒に使われることが多い。", exp:"der Unterschied（-s，-e）＝差異・相違。einen wesentlichen Unterschied feststellen（本質的な差異を確認する）。" },
      { q:"「措置・対策」を意味するドイツ語名詞はどれか。", opts:["die Lösung", "die Herausforderung", "die Gefahr", "die Maßnahme"], ans:3, hint:"政治や行政の文脈で「〜を講じる」とセットになる名詞。", exp:"die Maßnahme（-，-n）＝措置・対策。Maßnahmen ergreifen（措置を講じる）の形が頻出。" },
      { q:"「確信・信念」を意味するドイツ語名詞はどれか。", opts:["die Absicht", "die Ansicht", "die Überzeugung", "die Aufmerksamkeit"], ans:2, hint:"形容詞 überzeugt（確信した）と同じ語幹。", exp:"die Überzeugung（-，-en）＝確信・信念。von etw. überzeugt sein（〜を確信している）と対応する。" },
      { q:"「協力・協働」を意味するドイツ語名詞はどれか。", opts:["die Zusammenarbeit", "die Toleranz", "die Beziehung", "die Gleichheit"], ans:0, hint:"zusammen（一緒に）＋ Arbeit（仕事）からできた複合名詞。", exp:"die Zusammenarbeit（-，-）＝協力・協働。zusammenarbeiten（協力して働く）の名詞形。" },
      { q:"「水準・レベル」を意味するドイツ語名詞はどれか。", opts:["der Grad", "das Niveau", "das Ausmaß", "der Anteil"], ans:1, hint:"フランス語由来の借用語で、複数形が -s になる珍しい名詞。", exp:"das Niveau（-s，-s）＝水準・レベル。auf hohem Niveau（高い水準で）の形が典型的。フランス語由来の借用語。" },
      { q:"「好奇心」を意味するドイツ語名詞はどれか。", opts:["die Einsamkeit", "die Zufriedenheit", "die Neugier(de)", "die Trauer"], ans:2, hint:"neu（新しい）＋ gier（欲求）からできた語。", exp:"die Neugier(de)（-，-）＝好奇心。von Neugier getrieben sein（好奇心に駆られている）。Neugier と Neugierde どちらも正しい。" },
      { q:"「発言・陳述」を意味するドイツ語名詞はどれか。", opts:["die Anfrage", "die Erklärung", "die Vereinbarung", "die Aussage"], ans:3, hint:"aussagen（陳述する・証言する）の名詞形。", exp:"die Aussage（-，-n）＝発言・陳述。eine Aussage machen（発言する）。法律の文脈では「証言」の意味にもなる。" },
      { q:"「リスク・危険性」を意味するドイツ語名詞はどれか。", opts:["das Risiko", "die Gefahr", "der Versuch", "das Scheitern"], ans:0, hint:"複数形が -en になる外来語。ein 〜 eingehen（〜を冒す）とよく使われる。", exp:"das Risiko（-s，Risiken）＝リスク・危険性。ein Risiko eingehen（リスクを冒す）。die Gefahr は「差し迫った危険」のニュアンスが強い。" },
      { q:"「割合・分担」を意味するドイツ語名詞はどれか。", opts:["der Mangel", "der Anteil", "der Überfluss", "der Grad"], ans:1, hint:"an（〜の一部として）＋ Teil（部分）からなる語。", exp:"der Anteil（-s，-e）＝割合・分担・シェア。einen hohen Anteil ausmachen（高い割合を占める）。" },
      { q:"「成果・業績・能力」を意味するドイツ語名詞はどれか。", opts:["die Qualität", "die Leistung", "die Priorität", "der Anspruch"], ans:1, hint:"leisten（成し遂げる）の名詞形。FVGの leisten グループと関連する。", exp:"die Leistung（-，-en）＝成果・業績・能力。eine hohe Leistung erbringen（高い成果を上げる）。スポーツや学業の「成績」にも使う。" },
      { q:"「孤独感」を意味するドイツ語名詞はどれか。", opts:["die Einsamkeit", "der Stress", "die Trauer", "die Enttäuschung"], ans:0, hint:"形容詞 einsam（孤独な）に -keit をつけた名詞。", exp:"die Einsamkeit（-，-）＝孤独感。an Einsamkeit leiden（孤独に苦しむ）。形容詞 einsam（孤独な）の名詞形。" },
      { q:"「減少・後退」を意味するドイツ語名詞はどれか。", opts:["die Zunahme", "der Fortschritt", "der Rückgang", "der Verlauf"], ans:2, hint:"Rück-（後ろへ）＋ Gang（歩み）からなる複合名詞。die Zunahme の反対語。", exp:"der Rückgang（-s，Rückgänge）＝減少・後退。ein deutlicher Rückgang der Zahlen（数値の顕著な減少）。die Zunahme（増加）と対になる表現。" },
      { q:"「意図・目的」を意味するドイツ語名詞はどれか。", opts:["die Ansicht", "die Aussicht", "die Aufsicht", "die Absicht"], ans:3, hint:"-sicht で終わる名詞が多い紛らわしいグループ。「意図して行う」感が強い語。", exp:"die Absicht（-，-en）＝意図・目的。die Absicht haben, etw. zu tun（〜するつもりだ）。ab-sicht：見据えた上で「狙う」ニュアンス。" },
      { q:"「取り決め・合意」を意味するドイツ語名詞はどれか。", opts:["die Diskussion", "die Anfrage", "die Vereinbarung", "die Begründung"], ans:2, hint:"sich vereinbaren（合意する）の名詞形。eine 〜 treffen（〜を結ぶ）とセット。", exp:"die Vereinbarung（-，-en）＝取り決め・合意。eine Vereinbarung treffen（取り決めを結ぶ）。sich vereinbaren（合意する）の名詞形。" },
      { q:"「理解・思いやり」を意味するドイツ語名詞はどれか。", opts:["das Vertrauen", "das Verständnis", "das Verhalten", "die Vereinbarung"], ans:1, hint:"verstehen（理解する）の名詞形。Ver- で始まる紛らわしい語に注意。", exp:"das Verständnis（-ses，-）＝理解・思いやり。Verständnis für jdn. zeigen（〜への理解を示す）。verstehen（理解する）の名詞形。" },
      { q:"「注意・注目」を意味するドイツ語名詞はどれか。", opts:["die Aufmerksamkeit", "die Erkenntnis", "die Überzeugung", "das Bewusstsein"], ans:0, hint:"aufmerksam（注意深い）に -keit をつけた名詞。", exp:"die Aufmerksamkeit（-，-）＝注意・注目。die Aufmerksamkeit auf etw. lenken（注意を〜に向ける）。aufmerksam（注意深い）の名詞形。" },
      { q:"「多数・多数派」を意味するドイツ語名詞はどれか。", opts:["die Minderheit", "der Überfluss", "der Anteil", "die Mehrheit"], ans:3, hint:"mehr（より多い）＋ -heit。die Minderheit（少数派）との対比を意識しよう。", exp:"die Mehrheit（-，-en）＝多数・多数派。die Mehrheit der Bevölkerung（人口の多数）。die Minderheit（少数派）と対になる語。" },
    ]
  },
  {
    id: 2,
    label: "テストB",
    info: "との重複：die Überzeugung・der Rückgang",
    questions: [
      { q:"「希望」を意味するドイツ語名詞はどれか。", opts:["die Hoffnung", "das Vertrauen", "die Freude", "die Enttäuschung"], ans:0, hint:"hoffen（望む）の名詞形。", exp:"die Hoffnung（-，-en）＝希望。die Hoffnung aufgeben（希望を捨てる）の形が典型的。" },
      { q:"「恐れ・不安」を意味するドイツ語名詞はどれか。", opts:["die Hoffnung", "die Trauer", "die Angst", "die Zufriedenheit"], ans:2, hint:"「〜を恐れている」という表現で haben とセットになる。", exp:"die Angst（-，Ängste）＝恐れ・不安。Angst vor etw. haben の形が頻出。複数形は変音する点に注意。" },
      { q:"「信頼」を意味するドイツ語名詞はどれか。", opts:["der Stress", "die Überzeugung", "die Zufriedenheit", "das Vertrauen"], ans:3, hint:"vertrauen（信頼する）の名詞形。性は das。", exp:"das Vertrauen（-s，-）＝信頼。Vertrauen in jdn. haben（〜を信頼している）の形が頻出。" },
      { q:"「意見」を意味するドイツ語名詞はどれか。", opts:["die Ansicht", "die Meinung", "die Erkenntnis", "das Bewusstsein"], ans:1, hint:"meiner 〜 nach（私の〜では）という慣用句でよく使われる。", exp:"die Meinung（-，-en）＝意見。meiner Meinung nach（私の意見では）の形が最頻出。" },
      { q:"「疑い・疑念」を意味するドイツ語名詞はどれか。", opts:["die Vorstellung", "die Ansicht", "der Zweifel", "die Meinung"], ans:2, hint:"zweifeln（疑う）の名詞形。Zweifel an +D の形をとる。", exp:"der Zweifel（-s，-）＝疑い・疑念。Zweifel an etw. haben（〜を疑っている）の形が頻出。" },
      { q:"「認識・気づき」を意味するドイツ語名詞はどれか。", opts:["das Bewusstsein", "die Überzeugung", "der Zweifel", "die Erkenntnis"], ans:3, hint:"erkennen（認識する）の名詞形。複数形に -se がつく。", exp:"die Erkenntnis（-，-se）＝認識・気づき。zu einer Erkenntnis kommen（認識に至る）の形が典型的。" },
      { q:"「意識・自覚」を意味するドイツ語名詞はどれか。", opts:["das Bewusstsein", "die Vorstellung", "die Ansicht", "die Meinung"], ans:0, hint:"bewusst（意識した）の名詞形。性は das。", exp:"das Bewusstsein（-s，-）＝意識・自覚。ein Bewusstsein für etw. entwickeln（〜への意識を育てる）の形が頻出。" },
      { q:"「考え・イメージ・想像」を意味するドイツ語名詞はどれか。", opts:["die Ansicht", "die Vorstellung", "die Erkenntnis", "die Überzeugung"], ans:1, hint:"sich vorstellen（想像する・自己紹介する）の名詞形。", exp:"die Vorstellung（-，-en）＝考え・イメージ・想像。eine falsche Vorstellung haben（誤ったイメージを持つ）。" },
      { q:"「見解・意見」を意味するドイツ語名詞はどれか。（die Meinung と同義で使われる語）", opts:["die Ansicht", "das Bewusstsein", "die Erkenntnis", "die Vorstellung"], ans:0, hint:"meiner 〜 nach という構文で die Meinung と対比して覚えよう。", exp:"die Ansicht（-，-en）＝見解・意見。meiner Ansicht nach（私の見解では）の形が典型的。die Meinung より少しフォーマルな語感。" },
      { q:"「確信・信念」を意味するドイツ語名詞はどれか。", opts:["die Angst", "die Ansicht", "die Erkenntnis", "die Überzeugung"], ans:3, hint:"überzeugt（確信した）と同じ語幹。", exp:"die Überzeugung（-，-en）＝確信・信念。" },
      { q:"「喜び」を意味するドイツ語名詞はどれか。", opts:["die Trauer", "die Hoffnung", "die Freude", "die Angst"], ans:2, hint:"sich freuen（喜ぶ）の名詞形。", exp:"die Freude（-，-n）＝喜び。große Freude empfinden（大きな喜びを感じる）の形が典型的。" },
      { q:"「悲しみ」を意味するドイツ語名詞はどれか。", opts:["die Enttäuschung", "die Trauer", "die Angst", "der Stress"], ans:1, hint:"trauern（悲しむ）の名詞形。Trauerfeier（葬儀）とも関連する。", exp:"die Trauer（-，-）＝悲しみ。tiefe Trauer ausdrücken（深い悲しみを表す）。" },
      { q:"「失望・がっかり」を意味するドイツ語名詞はどれか。", opts:["die Zufriedenheit", "die Enttäuschung", "die Hoffnung", "der Stress"], ans:1, hint:"enttäuscht（失望した）の名詞形。ent-täuschen（幻想を解く）が語源。", exp:"die Enttäuschung（-，-en）＝失望・がっかり。eine große Enttäuschung erleben（大きな失望を経験する）。" },
      { q:"「満足感」を意味するドイツ語名詞はどれか。", opts:["die Freude", "die Enttäuschung", "das Vertrauen", "die Zufriedenheit"], ans:3, hint:"zufrieden（満足した）に -heit をつけた名詞。", exp:"die Zufriedenheit（-，-）＝満足感。mit etw. Zufriedenheit finden（〜に満足感を見出す）。" },
      { q:"「ストレス・過重負担」を意味するドイツ語名詞はどれか。", opts:["das Vertrauen", "die Angst", "der Stress", "die Trauer"], ans:2, hint:"英語 stress からの借用語。性は der。", exp:"der Stress（-es，-）＝ストレス・過重負担。unter starkem Stress stehen（強いストレスを受けている）の形が頻出。" },
      { q:"「関係・つながり」を意味するドイツ語名詞はどれか。", opts:["die Beziehung", "die Unterstützung", "der Konflikt", "das Verhalten"], ans:0, hint:"sich beziehen auf（〜に関係する）と同じ語幹。", exp:"die Beziehung（-，-en）＝関係・つながり。eine gute Beziehung aufbauen（良い関係を築く）。" },

let currentSet = 0;
let current = 0;
let score = 0;
let answered = false;

function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (s.label === RANDOM_LABEL ? ' random-btn' : '') + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}

function selectSet(idx) {
  if (sets[idx] && sets[idx].label === RANDOM_LABEL) buildRandomSet();
  currentSet = idx;
  current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (sets[i].label === RANDOM_LABEL ? ' random-btn' : '') + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  document.getElementById('q-num').textContent = `問${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-bar').style.width = `${((current+1)/qs.length)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${qs.length}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}

function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。　' + q.exp;
  }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}

function nextQuestion() {
  current++;
  if (current < sets[currentSet].questions.length) {
    render();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = '';
  if (pct >= 90) msg = '素晴らしい！ほぼ完璧です。';
  else if (pct >= 70) msg = 'よくできました。間違えた語を復習しましょう。';
  else if (pct >= 50) msg = 'もう少しです。リストを見直してから再挑戦してみましょう。';
  else msg = '語彙リストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) {
    nb.style.display = 'inline-block';
    nb.textContent = sets[currentSet + 1].label + 'へ →';
  } else {
    nb.style.display = 'none';
  }
}

function restart() {
  current = 0; score = 0;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function goNextSet() {
  selectSet(currentSet + 1);
}


// ── ランダムモード ────────────────────────────────
const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 20;

function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet;
  else sets.push(randomSet);
}

// ランダムセットを初回構築
buildRandomSet();
// ──────────────────────────────────────────────────

initSetNav();
render();
</script>
