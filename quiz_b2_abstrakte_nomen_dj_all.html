<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象名詞テスト B2レベル（独→日）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 6px; }
  .question-text { font-size: 22px; font-weight: 500; margin-bottom: 6px; font-family: "Segoe UI", "Candara", sans-serif; }
  .question-sub { font-size: 13px; color: #888; margin-bottom: 1.25rem; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: inherit; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; font-family: "Segoe UI", "Candara", sans-serif; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>抽象名詞テスト　B2レベル（独→日）</h1>
    <p>ドイツ語名詞の日本語の意味を選びなさい。（各テスト20問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index_b2.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← ポータルに戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:5%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="question-sub" id="q-sub"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このテストをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のテストへ →</button>
    </div>
  </div>
</div>
<script>
// テストA：①思想5＋⑤関係5＋⑦知識5＋⑧結果5
// テストB：②認識5＋⑥評価5＋⑧結果5＋④変容5
// テストC：③社会5＋④変容5＋⑤関係5＋⑦知識5
// テストD：①思想5＋②認識5＋③社会5＋⑥評価5
const sets = [
  { label:"テストA", questions:[
    // ①思想×5
    { q:"die Haltung", sub:"(-，-en)", opts:["世界観", "規範", "態度・姿勢・立場", "道徳"], ans:2, hint:"eine klare Haltung einnehmen（明確な立場をとる）の形でよく使う。", exp:"die Haltung＝態度・姿勢・立場。eine klare Haltung einnehmen（明確な立場をとる）。" },
    { q:"das Paradigma", sub:"(-s，-men)", opts:["前提", "パラダイム・思考の枠組み", "命題", "理想"], ans:1, hint:"ein Paradigma überwinden（パラダイムを乗り越える）の形でよく使う。ギリシャ語由来。", exp:"das Paradigma＝パラダイム・思考の枠組み。ein Paradigma überwinden（パラダイムを乗り越える）。" },
    { q:"die These", sub:"(-，-n)", opts:["前提", "道徳", "原則", "命題・主張"], ans:3, hint:"eine These aufstellen und belegen（命題を立てて論証する）の形でよく使う。", exp:"die These＝命題・主張。eine These aufstellen und belegen（命題を立てて論証する）。" },
    { q:"die Norm", sub:"(-，-en)", opts:["規範・基準", "理想", "態度", "パラダイム"], ans:0, hint:"gesellschaftliche Normen in Frage stellen（社会的規範を問い直す）の形でよく使う。", exp:"die Norm＝規範・基準。gesellschaftliche Normen in Frage stellen（社会的規範を問い直す）。" },
    { q:"die Moral", sub:"(-，-en)", opts:["命題", "原則", "規範", "道徳・倫理"], ans:3, hint:"moralische Grundsätze verletzen（道徳的原則を犯す）の形でよく使う。", exp:"die Moral＝道徳・倫理。moralische Grundsätze verletzen（道徳的原則を犯す）。" },
    // ⑤関係×5
    { q:"die Rivalität", sub:"(-，-en)", opts:["連帯", "協力", "対抗・ライバル関係", "相互依存"], ans:2, hint:"eine Rivalität zwischen zwei Lagern（二つの陣営間のライバル関係）の形でよく使う。", exp:"die Rivalität＝対抗・ライバル関係。eine Rivalität zwischen zwei Lagern（二つの陣営間のライバル関係）。" },
    { q:"die Solidarität", sub:"(-，-)", opts:["連帯", "依存", "競争", "二極化"], ans:0, hint:"Solidarität mit Betroffenen zeigen（被影響者との連帯を示す）の形でよく使う。", exp:"die Solidarität＝連帯。Solidarität mit Betroffenen zeigen（被影響者との連帯を示す）。" },
    { q:"die Interdependenz", sub:"(-，-en)", opts:["協力", "相互依存", "対抗", "緊張"], ans:1, hint:"globale Interdependenzen berücksichtigen（グローバルな相互依存を考慮する）の形でよく使う。", exp:"die Interdependenz＝相互依存。globale Interdependenzen berücksichtigen（グローバルな相互依存を考慮する）。" },
    { q:"die Kooperation", sub:"(-，-en)", opts:["競争", "協力・連携（公式・組織的）", "二極化", "依存"], ans:1, hint:"eine internationale Kooperation aufbauen（国際協力を構築する）の形でよく使う。", exp:"die Kooperation＝協力・連携（公式・組織的）。eine internationale Kooperation aufbauen（国際協力を構築する）。" },
    { q:"die Polarisierung", sub:"(-，-en)", opts:["緊張", "対抗", "妥協", "二極化・分極化"], ans:3, hint:"eine zunehmende Polarisierung der Gesellschaft（社会の進む二極化）の形でよく使う。", exp:"die Polarisierung＝二極化・分極化。eine zunehmende Polarisierung der Gesellschaft（社会の進む二極化）。" },
    // ⑦知識×5
    { q:"die Kreativität", sub:"(-，-)", opts:["専門知識", "伝統", "創造性", "言説"], ans:2, hint:"Kreativität fördern und entfalten（創造性を促進し開花させる）の形でよく使う。", exp:"die Kreativität＝創造性。Kreativität fördern und entfalten（創造性を促進し開花させる）。" },
    { q:"die Narration", sub:"(-，-en)", opts:["物語・語り・ナラティブ", "複雑性", "ニュアンス", "革新"], ans:0, hint:"eine politische Narration konstruieren（政治的ナラティブを構築する）の形でよく使う。", exp:"die Narration＝物語・語り・ナラティブ。eine politische Narration konstruieren（政治的ナラティブを構築する）。" },
    { q:"die Innovation", sub:"(-，-en)", opts:["伝統", "革新・イノベーション", "創造性", "言説"], ans:1, hint:"Innovationen vorantreiben（イノベーションを推進する）の形でよく使う。", exp:"die Innovation＝革新・イノベーション。Innovationen vorantreiben（イノベーションを推進する）。" },
    { q:"die Nuance", sub:"(-，-n)", opts:["複雑性", "言説", "ニュアンス・細かな差異", "専門知識"], ans:2, hint:"Nuancen in der Argumentation erkennen（議論の中のニュアンスを見分ける）の形でよく使う。", exp:"die Nuance＝ニュアンス・細かな差異。Nuancen in der Argumentation erkennen（議論の中のニュアンスを見分ける）。" },
    { q:"der Diskurs", sub:"(-es，-e)", opts:["言説・ディスコース", "ナラティブ", "革新", "複雑性"], ans:0, hint:"den öffentlichen Diskurs prägen（公共の言説を形成する）の形でよく使う。", exp:"der Diskurs＝言説・ディスコース。den öffentlichen Diskurs prägen（公共の言説を形成する）。" },
    // ⑧結果×5
    { q:"die Tendenz", sub:"(-，-en)", opts:["原因", "所見", "副作用", "傾向・趨勢"], ans:3, hint:"eine beunruhigende Tendenz beobachten（懸念される傾向を観察する）の形でよく使う。", exp:"die Tendenz＝傾向・趨勢。eine beunruhigende Tendenz beobachten（懸念される傾向を観察する）。" },
    { q:"der Faktor", sub:"(-s，-en)", opts:["視点", "要因・ファクター", "関連", "結果"], ans:1, hint:"entscheidende Faktoren berücksichtigen（決定的要因を考慮する）の形でよく使う。", exp:"der Faktor＝要因・ファクター。entscheidende Faktoren berücksichtigen（決定的要因を考慮する）。" },
    { q:"die Auswirkung", sub:"(-，-en)", opts:["副作用", "含意", "影響・波及効果（具体的）", "原因"], ans:2, hint:"weitreichende Auswirkungen haben auf（〜に広範な影響を及ぼす）の形でよく使う。", exp:"die Auswirkung＝影響・波及効果（具体的）。weitreichende Auswirkungen haben auf（〜に広範な影響を及ぼす）。" },
    { q:"die Ursache", sub:"(-，-n)", opts:["傾向", "結果", "要因", "原因"], ans:3, hint:"die eigentliche Ursache eines Problems（問題の本当の原因）の形でよく使う。", exp:"die Ursache＝原因。die eigentliche Ursache eines Problems（問題の本当の原因）。" },
    { q:"die Perspektive", sub:"(-，-n)", opts:["視点・展望・見通し", "所見", "副作用", "傾向"], ans:0, hint:"eine andere Perspektive einnehmen（別の視点をとる）の形でよく使う。", exp:"die Perspektive＝視点・展望・見通し。eine andere Perspektive einnehmen（別の視点をとる）。" },
  ]},
  { label:"テストB", questions:[
    // ②認識×5
    { q:"die Hypothese", sub:"(-，-n)", opts:["結論", "仮説", "実践", "矛盾"], ans:1, hint:"eine Hypothese aufstellen und testen（仮説を立てて検証する）の形でよく使う。", exp:"die Hypothese＝仮説。eine Hypothese aufstellen und testen（仮説を立てて検証する）。" },
    { q:"der Widerspruch", sub:"(-s，Widersprüche)", opts:["主観性", "理論", "曖昧性", "矛盾・反論"], ans:3, hint:"in Widerspruch zu etw. stehen（〜と矛盾している）の形でよく使う。", exp:"der Widerspruch＝矛盾・反論。in Widerspruch zu etw. stehen（〜と矛盾している）。" },
    { q:"die Schlussfolgerung", sub:"(-，-en)", opts:["実践", "客観性", "結論・推論", "論拠"], ans:2, hint:"eine voreilige Schlussfolgerung ziehen（早まった結論を出す）の形でよく使う。", exp:"die Schlussfolgerung＝結論・推論。eine voreilige Schlussfolgerung ziehen（早まった結論を出す）。" },
    { q:"die Ambiguität", sub:"(-，-en)", opts:["曖昧性・多義性", "客観性", "理論", "証拠"], ans:0, hint:"mit Ambiguität produktiv umgehen（曖昧さを積極的に扱う）の形でよく使う。", exp:"die Ambiguität＝曖昧性・多義性。mit Ambiguität produktiv umgehen（曖昧さを積極的に扱う）。" },
    { q:"die Evidenz", sub:"(-，-en)", opts:["理論", "主観性", "根拠・証拠・エビデンス", "矛盾"], ans:2, hint:"empirische Evidenz vorlegen（実証的根拠を提示する）の形でよく使う。", exp:"die Evidenz＝根拠・証拠・エビデンス。empirische Evidenz vorlegen（実証的根拠を提示する）。" },
    // ⑥評価×5
    { q:"die Integrität", sub:"(-，-)", opts:["正義", "誠実さ・高潔さ", "能力", "信頼性"], ans:1, hint:"die persönliche Integrität wahren（個人の誠実さを保つ）の形でよく使う。", exp:"die Integrität＝誠実さ・高潔さ。die persönliche Integrität wahren（個人の誠実さを保つ）。" },
    { q:"die Verhältnismäßigkeit", sub:"(-，-)", opts:["均衡性・比例原則", "恣意性", "正義", "能力"], ans:0, hint:"den Grundsatz der Verhältnismäßigkeit beachten（比例原則を守る）の形でよく使う。", exp:"die Verhältnismäßigkeit＝均衡性・比例原則。den Grundsatz der Verhältnismäßigkeit beachten（比例原則を守る）。" },
    { q:"die Willkür", sub:"(-，-)", opts:["信頼性", "均衡性", "歪曲", "恣意性・専横"], ans:3, hint:"staatliche Willkür verhindern（国家の恣意的行為を防ぐ）の形でよく使う。", exp:"die Willkür＝恣意性・専横。staatliche Willkür verhindern（国家の恣意的行為を防ぐ）。" },
    { q:"die Verzerrung", sub:"(-，-en)", opts:["正義", "歪曲・偏り・バイアス", "能力", "誠実さ"], ans:1, hint:"eine Verzerrung der Wahrnehmung korrigieren（認知の歪みを修正する）の形でよく使う。", exp:"die Verzerrung＝歪曲・偏り・バイアス。eine Verzerrung der Wahrnehmung korrigieren（認知の歪みを修正する）。" },
    { q:"die Objektivierung", sub:"(-，-en)", opts:["恣意性", "均衡性", "信頼性", "客観化・数値化"], ans:3, hint:"eine Objektivierung der Bewertungskriterien（評価基準の客観化）の形でよく使う。", exp:"die Objektivierung＝客観化・数値化。eine Objektivierung der Bewertungskriterien（評価基準の客観化）。" },
    // ⑧結果×5
    { q:"die Implikation", sub:"(-，-en)", opts:["含意・波及効果", "副作用", "傾向", "所見"], ans:0, hint:"die Implikationen einer Entscheidung abwägen（決定の含意を検討する）の形でよく使う。", exp:"die Implikation＝含意・波及効果。die Implikationen einer Entscheidung abwägen（決定の含意を検討する）。" },
    { q:"der Nebeneffekt", sub:"(-s，-e)", opts:["関連", "原因", "副作用・副次的効果", "含意"], ans:2, hint:"unerwünschte Nebeneffekte in Kauf nehmen（望ましくない副作用を甘受する）の形でよく使う。", exp:"der Nebeneffekt＝副作用・副次的効果。unerwünschte Nebeneffekte in Kauf nehmen（望ましくない副作用を甘受する）。" },
    { q:"der Befund", sub:"(-s，-e)", opts:["所見・調査結果", "副作用", "傾向", "要因"], ans:0, hint:"empirische Befunde präsentieren（実証的所見を提示する）の形でよく使う。", exp:"der Befund＝所見・調査結果。empirische Befunde präsentieren（実証的所見を提示する）。" },
    { q:"das Ergebnis", sub:"(-ses，-se)", opts:["傾向", "所見", "結果・成果・成績", "視点"], ans:2, hint:"zu einem eindeutigen Ergebnis kommen（明確な結果に至る）の形でよく使う。", exp:"das Ergebnis＝結果・成果・成績。zu einem eindeutigen Ergebnis kommen（明確な結果に至る）。" },
    { q:"der Zusammenhang", sub:"(-s，Zusammenhänge)", opts:["副作用", "関連・文脈・つながり", "含意", "所見"], ans:1, hint:"einen kausalen Zusammenhang herstellen（因果関係を確立する）の形でよく使う。", exp:"der Zusammenhang＝関連・文脈・つながり。einen kausalen Zusammenhang herstellen（因果関係を確立する）。" },
    // ④変容×5
    { q:"die Transformation", sub:"(-，-en)", opts:["停滞", "移行", "後退", "変換・転換"], ans:3, hint:"eine digitale Transformation durchlaufen（デジタル転換を経る）の形でよく使う。", exp:"die Transformation＝変換・転換。eine digitale Transformation durchlaufen（デジタル転換を経る）。" },
    { q:"der Bruch", sub:"(-s，Brüche)", opts:["移行", "継続性", "断絶・決裂・亀裂", "停滞"], ans:2, hint:"ein historischer Bruch mit der Vergangenheit（過去との歴史的断絶）の形でよく使う。", exp:"der Bruch＝断絶・決裂・亀裂。ein historischer Bruch mit der Vergangenheit（過去との歴史的断絶）。" },

const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 20;

function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet;
  else sets.push(randomSet);
}
buildRandomSet();

let currentSet = 0, current = 0, score = 0, answered = false;

function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (s.label === RANDOM_LABEL ? ' random-btn' : '') + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}

function selectSet(idx) {
  if (sets[idx] && sets[idx].label === RANDOM_LABEL) buildRandomSet();
  currentSet = idx; current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (sets[i].label === RANDOM_LABEL ? ' random-btn' : '') + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  document.getElementById('q-num').textContent = `問${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-sub').textContent = q.sub;
  document.getElementById('prog-bar').style.width = `${((current+1)/qs.length)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${qs.length}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}

function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。　' + q.exp;
  }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}

function nextQuestion() {
  current++;
  if (current < sets[currentSet].questions.length) render();
  else showResult();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = pct >= 90 ? '素晴らしい！ほぼ完璧です。' : pct >= 70 ? 'よくできました。間違えた語を復習しましょう。' : pct >= 50 ? 'もう少しです。リストを見直してから再挑戦しましょう。' : '語彙リストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) { nb.style.display = 'inline-block'; nb.textContent = sets[currentSet + 1].label + 'へ →'; }
  else nb.style.display = 'none';
}

function restart() {
  current = 0; score = 0;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function goNextSet() { selectSet(currentSet + 1); }

initSetNav();
render();
</script>
