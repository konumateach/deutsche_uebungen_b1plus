<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽象名詞テスト B2レベル（独→日）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 21px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: #666; }
  .set-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .set-btn { padding: 6px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
  .set-btn:hover { background: #f0f0f0; }
  .set-btn.random-btn { border-color: #185FA5; color: #185FA5; }
  .set-btn.random-btn.active { background: #185FA5; color: #fff; border-color: #185FA5; }
  .set-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar-wrap { background: #ddd; border-radius: 4px; height: 4px; margin-bottom: 6px; }
  .progress-bar { background: #185FA5; height: 4px; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; }
  .question-num { font-size: 12px; color: #999; margin-bottom: 6px; }
  .question-text { font-size: 22px; font-weight: 500; margin-bottom: 6px; font-family: "Segoe UI", "Candara", sans-serif; }
  .question-sub { font-size: 13px; color: #888; margin-bottom: 1.25rem; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { text-align: left; padding: 10px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fafafa; cursor: pointer; font-size: 15px; font-family: inherit; transition: background 0.15s, border-color 0.15s; }
  .option-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #999; }
  .option-btn.correct { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn.wrong   { background: #fcebeb; border-color: #a32d2d; color: #791f1f; }
  .option-btn.reveal  { background: #e1f5ee; border-color: #0f6e56; color: #085041; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; font-family: "Segoe UI", "Candara", sans-serif; }
  .feedback.correct { background: #e1f5ee; color: #085041; display: block; }
  .feedback.wrong    { background: #fcebeb; color: #791f1f; display: block; }
  .hint-btn { margin-top: 10px; font-size: 13px; color: #185FA5; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; }
  .hint-text { font-size: 13px; color: #666; margin-top: 6px; display: none; }
  .next-btn { margin-top: 1.25rem; padding: 10px 20px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; display: none; }
  .next-btn:hover { background: #333; }
  .result-card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 2rem; text-align: center; display: none; }
  .result-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .score-big { font-size: 48px; font-weight: 500; color: #185FA5; margin: 1rem 0; }
  .score-msg { font-size: 15px; color: #555; margin-bottom: 1.5rem; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 10px 24px; border-radius: 8px; background: #1a1a18; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .restart-btn:hover { background: #333; }
  .next-set-btn { padding: 10px 24px; border-radius: 8px; background: #185FA5; color: #fff; border: none; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; }
  .next-set-btn:hover { background: #0c447c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>抽象名詞テスト　B2レベル（独→日）</h1>
    <p>ドイツ語名詞の日本語の意味を選びなさい。（各テスト20問）</p>
  </header>
  <div style="margin-bottom:1rem;"><a href="index.html" style="display:inline-block;padding:7px 16px;border-radius:8px;border:0.5px solid #ccc;background:#fafafa;color:#1a1a18;text-decoration:none;font-size:13px;font-family:inherit;">← ポータルに戻る</a></div>
  <div class="set-nav" id="set-nav"></div>
  <div id="quiz-area">
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:5%"></div></div>
    <div class="progress-text" id="prog-text"></div>
    <div class="card">
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="question-sub" id="q-sub"></div>
      <div class="options" id="q-options"></div>
      <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
      <div class="hint-text" id="hint-text"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>
  <div class="result-card" id="result-card">
    <h2 id="result-title"></h2>
    <div class="score-big" id="score-display"></div>
    <div class="score-msg" id="score-msg"></div>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">このテストをもう一度</button>
      <button class="next-set-btn" id="next-set-btn" onclick="goNextSet()">次のテストへ →</button>
    </div>
  </div>
</div>
<script>
// 形式: { q:"ドイツ語名詞", sub:"性・複数形", opts:["日本語A","B","C","D"], ans:正解index, hint:"ヒント", exp:"解説" }
const sets = [
  { label:"テストA", questions:[
    { q:"die Haltung", sub:"(-，-en)", opts:["世界観","態度・姿勢・立場","前提","規範"], ans:1, hint:"eine klare Haltung einnehmen（明確な立場をとる）の形でよく使う。", exp:"die Haltung＝態度・姿勢・立場。eine klare Haltung einnehmen（明確な立場をとる）。" },
    { q:"die Weltanschauung", sub:"(-，-en)", opts:["パラダイム","理想","世界観","イデオロギー"], ans:2, hint:"Welt（世界）＋ Anschauung（見方）からなる複合名詞。", exp:"die Weltanschauung＝世界観。eine konservative Weltanschauung vertreten（保守的な世界観を持つ）。" },
    { q:"das Prinzip", sub:"(-s，-ien)", opts:["命題","原則・原理","規範","前提"], ans:1, hint:"an einem Prinzip festhalten（原則を守る）の形でよく使う。", exp:"das Prinzip＝原則・原理。an einem Prinzip festhalten（原則を守る）。" },
    { q:"die Norm", sub:"(-，-en)", opts:["理想","態度","規範・基準","道徳"], ans:2, hint:"gesellschaftliche Normen（社会的規範）の形でよく使う。", exp:"die Norm＝規範・基準。gesellschaftliche Normen in Frage stellen（社会的規範を問い直す）。" },
    { q:"das Ideal", sub:"(-s，-e)", opts:["原則","理想","命題","パラダイム"], ans:1, hint:"einem Ideal nachjagen（理想を追い求める）の形でよく使う。", exp:"das Ideal＝理想。einem Ideal nachjagen（理想を追い求める）。" },
    { q:"die Ideologie", sub:"(-，-n)", opts:["世界観","規範","パラダイム","イデオロギー・思想体系"], ans:3, hint:"einer Ideologie anhängen（イデオロギーに傾倒する）の形でよく使う。", exp:"die Ideologie＝イデオロギー・思想体系。einer Ideologie anhängen（イデオロギーに傾倒する）。" },
    { q:"das Paradigma", sub:"(-s，-men)", opts:["パラダイム・思考の枠組み","命題","前提","理想"], ans:0, hint:"ein Paradigma überwinden（パラダイムを乗り越える）の形でよく使う。ギリシャ語由来。", exp:"das Paradigma＝パラダイム・思考の枠組み。ein Paradigma überwinden（パラダイムを乗り越える）。" },
    { q:"die Prämisse", sub:"(-，-n)", opts:["原則","命題","前提・大前提","世界観"], ans:2, hint:"von falschen Prämissen ausgehen（誤った前提から出発する）の形でよく使う。", exp:"die Prämisse＝前提・大前提。von falschen Prämissen ausgehen（誤った前提から出発する）。" },
    { q:"die These", sub:"(-，-n)", opts:["命題・主張","道徳","理想","規範"], ans:0, hint:"eine These aufstellen und belegen（命題を立てて論証する）の形でよく使う。", exp:"die These＝命題・主張。eine These aufstellen und belegen（命題を立てて論証する）。" },
    { q:"die Moral", sub:"(-，-en)", opts:["原則","イデオロギー","道徳・倫理","命題"], ans:2, hint:"moralische Grundsätze verletzen（道徳的原則を犯す）の形でよく使う。", exp:"die Moral＝道徳・倫理。moralische Grundsätze verletzen（道徳的原則を犯す）。" },
    { q:"das Argument", sub:"(-s，-e)", opts:["仮説","結論","客観性","論拠・議論"], ans:3, hint:"ein überzeugendes Argument liefern（説得力ある論拠を示す）の形でよく使う。", exp:"das Argument＝論拠・議論。ein überzeugendes Argument liefern（説得力ある論拠を示す）。" },
    { q:"die Hypothese", sub:"(-，-n)", opts:["根拠","仮説","理論","実践"], ans:1, hint:"eine Hypothese aufstellen und testen（仮説を立てて検証する）の形でよく使う。", exp:"die Hypothese＝仮説。eine Hypothese aufstellen und testen（仮説を立てて検証する）。" },
    { q:"die Schlussfolgerung", sub:"(-，-en)", opts:["客観性","曖昧性","結論・推論","主観性"], ans:2, hint:"eine voreilige Schlussfolgerung ziehen（早まった結論を出す）の形でよく使う。", exp:"die Schlussfolgerung＝結論・推論。eine voreilige Schlussfolgerung ziehen（早まった結論を出す）。" },
    { q:"die Praxis", sub:"(-，Praxen)", opts:["理論","根拠","実践・現場・慣行","矛盾"], ans:2, hint:"Theorie und Praxis in Einklang bringen（理論と実践を一致させる）の形でよく使う。", exp:"die Praxis＝実践・現場・慣行。Theorie und Praxis in Einklang bringen（理論と実践を一致させる）。" },
    { q:"die Theorie", sub:"(-，-n)", opts:["実践","仮説","理論","証拠"], ans:2, hint:"eine Theorie widerlegen（理論を反証する）の形でよく使う。", exp:"die Theorie＝理論。eine Theorie widerlegen（理論を反証する）。" },
    { q:"der Widerspruch", sub:"(-s，Widersprüche)", opts:["主観性","矛盾・反論","客観性","証拠"], ans:1, hint:"in Widerspruch zu etw. stehen（〜と矛盾している）の形でよく使う。", exp:"der Widerspruch＝矛盾・反論。in Widerspruch zu etw. stehen（〜と矛盾している）。" },
    { q:"die Objektivität", sub:"(-，-)", opts:["曖昧性","主観性","証拠","客観性"], ans:3, hint:"wissenschaftliche Objektivität wahren（科学的客観性を保つ）の形でよく使う。", exp:"die Objektivität＝客観性。wissenschaftliche Objektivität wahren（科学的客観性を保つ）。" },
    { q:"die Subjektivität", sub:"(-，-)", opts:["客観性","論拠","主観性","仮説"], ans:2, hint:"die Subjektivität des Urteils eingestehen（判断の主観性を認める）の形でよく使う。", exp:"die Subjektivität＝主観性。die Subjektivität des Urteils eingestehen（判断の主観性を認める）。" },
    { q:"die Evidenz", sub:"(-，-en)", opts:["矛盾","曖昧性","理論","根拠・証拠・エビデンス"], ans:3, hint:"empirische Evidenz vorlegen（実証的根拠を提示する）の形でよく使う。", exp:"die Evidenz＝根拠・証拠・エビデンス。empirische Evidenz vorlegen（実証的根拠を提示する）。" },
    { q:"die Ambiguität", sub:"(-，-en)", opts:["客観性","曖昧性・多義性","矛盾","理論"], ans:1, hint:"mit Ambiguität produktiv umgehen（曖昧さを積極的に扱う）の形でよく使う。", exp:"die Ambiguität＝曖昧性・多義性。mit Ambiguität produktiv umgehen（曖昧さを積極的に扱う）。" },
  ]},
  { label:"テストB", questions:[
    { q:"die Macht", sub:"(-，Mächte)", opts:["権威","権力・力","制度","構造"], ans:1, hint:"Macht ausüben（権力を行使する）の形でよく使う。", exp:"die Macht＝権力・力。Macht ausüben und Macht missbrauchen（権力を行使し、権力を乱用する）。" },
    { q:"die Autorität", sub:"(-，-en)", opts:["透明性","正当性","権威・権限","合意"], ans:2, hint:"die Autorität des Staates in Frage stellen（国家の権威を問い直す）の形でよく使う。", exp:"die Autorität＝権威・権限。die Autorität des Staates in Frage stellen（国家の権威を問い直す）。" },
    { q:"die Institution", sub:"(-，-en)", opts:["制度・機関","構造","階層","メカニズム"], ans:0, hint:"demokratische Institutionen stärken（民主的機関を強化する）の形でよく使う。", exp:"die Institution＝制度・機関。demokratische Institutionen stärken（民主的機関を強化する）。" },
    { q:"die Struktur", sub:"(-，-en)", opts:["階層","構造","権力","正当性"], ans:1, hint:"bestehende Strukturen aufbrechen（既存の構造を打破する）の形でよく使う。", exp:"die Struktur＝構造。bestehende Strukturen aufbrechen（既存の構造を打破する）。" },
    { q:"der Mechanismus", sub:"(-，-men)", opts:["透明性","合意","権威","メカニズム・仕組み"], ans:3, hint:"einen Kontrollmechanismus einführen（管理メカニズムを導入する）の形でよく使う。", exp:"der Mechanismus＝メカニズム・仕組み。einen Kontrollmechanismus einführen（管理メカニズムを導入する）。" },
    { q:"die Hierarchie", sub:"(-，-n)", opts:["権力","階層・ヒエラルキー","正当性","制度"], ans:1, hint:"starre Hierarchien abbauen（硬直した階層を解消する）の形でよく使う。", exp:"die Hierarchie＝階層・ヒエラルキー。starre Hierarchien abbauen（硬直した階層を解消する）。" },
    { q:"die Legitimität", sub:"(-，-)", opts:["透明性","権威","正当性","説明責任"], ans:2, hint:"die Legitimität einer Entscheidung anzweifeln（決定の正当性を疑う）の形でよく使う。", exp:"die Legitimität＝正当性。die Legitimität einer Entscheidung anzweifeln（決定の正当性を疑う）。" },
    { q:"die Transparenz", sub:"(-，-)", opts:["説明責任","透明性","合意","権力"], ans:1, hint:"mehr Transparenz im Verfahren fordern（手続きの透明性を求める）の形でよく使う。", exp:"die Transparenz＝透明性。mehr Transparenz im Verfahren fordern（手続きの透明性を求める）。" },
    { q:"die Rechenschaft", sub:"(-，-)", opts:["合意","構造","説明責任・報告義務","正当性"], ans:2, hint:"Rechenschaft ablegen müssen（説明責任を果たさなければならない）の形でよく使う。", exp:"die Rechenschaft＝説明責任・報告義務。Rechenschaft ablegen müssen（説明責任を果たさなければならない）。" },
    { q:"der Konsens", sub:"(-es，-e)", opts:["階層","メカニズム","権威","合意・コンセンサス"], ans:3, hint:"einen breiten Konsens erzielen（広いコンセンサスを達成する）の形でよく使う。", exp:"der Konsens＝合意・コンセンサス。einen breiten Konsens erzielen（広いコンセンサスを達成する）。" },
    { q:"der Wandel", sub:"(-s，-)", opts:["危機","変容・変革（構造的）","断絶","停滞"], ans:1, hint:"einem tiefgreifenden Wandel unterliegen（深い変革にさらされる）の形でよく使う。", exp:"der Wandel＝変容・変革（構造的）。einem tiefgreifenden Wandel unterliegen（深い変革にさらされる）。" },
    { q:"die Transformation", sub:"(-，-en)", opts:["移行","変換・転換","停滞","後退"], ans:1, hint:"eine digitale Transformation durchlaufen（デジタル転換を経る）の形でよく使う。", exp:"die Transformation＝変換・転換。eine digitale Transformation durchlaufen（デジタル転換を経る）。" },
    { q:"der Übergang", sub:"(-s，Übergänge)", opts:["断絶","継続性","移行・過渡期","変容"], ans:2, hint:"in einer Phase des Übergangs stehen（移行期にある）の形でよく使う。", exp:"der Übergang＝移行・過渡期。in einer Phase des Übergangs stehen（移行期にある）。" },
    { q:"die Krise", sub:"(-，-n)", opts:["停滞","後退","危機","断絶"], ans:2, hint:"eine Krise bewältigen（危機を乗り越える）の形でよく使う。", exp:"die Krise＝危機。eine Krise bewältigen（危機を乗り越える）。" },
    { q:"der Bruch", sub:"(-s，Brüche)", opts:["移行","変容","継続性","断絶・決裂・亀裂"], ans:3, hint:"ein historischer Bruch mit der Vergangenheit（過去との歴史的断絶）の形でよく使う。", exp:"der Bruch＝断絶・決裂・亀裂。ein historischer Bruch mit der Vergangenheit（過去との歴史的断絶）。" },
    { q:"die Kontinuität", sub:"(-，-en)", opts:["危機","後退","継続性・連続性","停滞"], ans:2, hint:"die Kontinuität der Politik wahren（政策の継続性を保つ）の形でよく使う。", exp:"die Kontinuität＝継続性・連続性。die Kontinuität der Politik wahren（政策の継続性を保つ）。" },
    { q:"der Rückschlag", sub:"(-s，Rückschläge)", opts:["衝動","エスカレーション","停滞","後退・挫折・逆風"], ans:3, hint:"einen schweren Rückschlag erleiden（重大な後退を被る）の形でよく使う。", exp:"der Rückschlag＝後退・挫折・逆風。einen schweren Rückschlag erleiden（重大な後退を被る）。" },
    { q:"die Eskalation", sub:"(-，-en)", opts:["移行","断絶","エスカレーション・拡大","変容"], ans:2, hint:"eine Eskalation des Konflikts verhindern（紛争のエスカレーションを防ぐ）の形でよく使う。", exp:"die Eskalation＝エスカレーション・拡大。eine Eskalation des Konflikts verhindern（紛争のエスカレーションを防ぐ）。" },
    { q:"die Stagnation", sub:"(-，-en)", opts:["後退","停滞","危機","変容"], ans:1, hint:"aus einer wirtschaftlichen Stagnation herausfinden（経済的停滞から抜け出す）の形でよく使う。", exp:"die Stagnation＝停滞。aus einer wirtschaftlichen Stagnation herausfinden（経済的停滞から抜け出す）。" },
    { q:"der Impuls", sub:"(-es，-e)", opts:["断絶","衝動・刺激・推進力","変容","停滞"], ans:1, hint:"einen neuen Impuls geben（新たな推進力を与える）の形でよく使う。", exp:"der Impuls＝衝動・刺激・推進力。einen neuen Impuls geben（新たな推進力を与える）。" },
  ]},
  { label:"テストC", questions:[
    { q:"die Spannung", sub:"(-，-en)", opts:["依存","緊張・張力・葛藤","連帯","競争"], ans:1, hint:"soziale Spannungen abbauen（社会的緊張を緩和する）の形でよく使う。", exp:"die Spannung＝緊張・張力・葛藤。soziale Spannungen abbauen（社会的緊張を緩和する）。" },

const RANDOM_LABEL = "ランダム";
const RANDOM_COUNT = 20;

function getAllQuestions() {
  const all = [];
  sets.forEach(s => { if (s.label !== RANDOM_LABEL) s.questions.forEach(q => all.push(q)); });
  return all;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildRandomSet() {
  const all = shuffle(getAllQuestions());
  const picked = all.slice(0, Math.min(RANDOM_COUNT, all.length));
  const idx = sets.findIndex(s => s.label === RANDOM_LABEL);
  const randomSet = { label: RANDOM_LABEL, questions: picked };
  if (idx >= 0) sets[idx] = randomSet;
  else sets.push(randomSet);
}
buildRandomSet();

let currentSet = 0, current = 0, score = 0, answered = false;

function initSetNav() {
  const nav = document.getElementById('set-nav');
  sets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'set-btn' + (s.label === RANDOM_LABEL ? ' random-btn' : '') + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectSet(i);
    nav.appendChild(btn);
  });
}

function selectSet(idx) {
  if (sets[idx] && sets[idx].label === RANDOM_LABEL) buildRandomSet();
  currentSet = idx; current = 0; score = 0; answered = false;
  document.querySelectorAll('.set-btn').forEach((b, i) => {
    b.className = 'set-btn' + (sets[i].label === RANDOM_LABEL ? ' random-btn' : '') + (i === idx ? ' active' : '');
  });
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function render() {
  const qs = sets[currentSet].questions;
  const q = qs[current];
  document.getElementById('q-num').textContent = `問${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-sub').textContent = q.sub;
  document.getElementById('prog-bar').style.width = `${((current+1)/qs.length)*100}%`;
  document.getElementById('prog-text').textContent = `問${current+1} / ${qs.length}`;
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-btn').style.display = 'inline';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  answered = false;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => select(i);
    opts.appendChild(btn);
  });
}

function showHint() {
  const ht = document.getElementById('hint-text');
  ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = sets[currentSet].questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('hint-text').style.display = 'none';
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✓ 正解！　' + q.exp;
  } else {
    btns[i].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = '✗ 不正解。　' + q.exp;
  }
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = current + 1 < sets[currentSet].questions.length ? '次の問題 →' : '結果を見る';
}

function nextQuestion() {
  current++;
  if (current < sets[currentSet].questions.length) render();
  else showResult();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.style.display = 'block';
  const total = sets[currentSet].questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('result-title').textContent = sets[currentSet].label + '　終了';
  document.getElementById('score-display').textContent = `${score} / ${total}`;
  let msg = pct >= 90 ? '素晴らしい！ほぼ完璧です。' : pct >= 70 ? 'よくできました。間違えた語を復習しましょう。' : pct >= 50 ? 'もう少しです。リストを見直してから再挑戦しましょう。' : '語彙リストをもう一度確認してから再挑戦しましょう。';
  document.getElementById('score-msg').textContent = `正答率 ${pct}%　${msg}`;
  const nb = document.getElementById('next-set-btn');
  if (currentSet < sets.length - 1) { nb.style.display = 'inline-block'; nb.textContent = sets[currentSet + 1].label + 'へ →'; }
  else nb.style.display = 'none';
}

function restart() {
  current = 0; score = 0;
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

function goNextSet() { selectSet(currentSet + 1); }

initSetNav();
render();
</script>
